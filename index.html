\n2.入學本校學士班學生須於畢業前(建議在大三結束\n前)修習「社會實踐課程」(包含實踐6 至10 小時)。\n修習「社會實踐課程」及格者方得畢業。身心障礙學\n生之「社會實踐課程」內容，得由授課教師依實際情\n形適當調整，特殊狀況者，經通識教育中心同意後，\n得予免修「社會實踐課程」。本項規定若有異動，以學\n生入學時適用之規定為準。"],["2110144","國立中正大學","哲學系",1,26,"","＊英文須達本類組前標。\n＊國文、數學B 須達本類組均標。\n入學本校學士班學生須於畢業前(建議在大三結束前)\n修習「社會實踐課程」(包含實踐6 至10 小時)。修習\n「社會實踐課程」及格者方得畢業。身心障礙學生之\n「社會實踐課程」內容，得由授課教師依實際情形適\n當調整，特殊狀況者，經通識教育中心同意後，得予\n免修「社會實踐課程」。本項規定若有異動，以學生入\n學時適用之規定為準。"],["2110145","國立中正大學","社會福利學系",3,27,"","＊英文須達本類組前標。\n＊國文、數學B 須達本類組均標。\n1.本系以培養社會福利全方位人才為目標，課程強調\n整合社會科學知識，探討福利相關議題，以培養學生\n制度分析、政策規劃、行政管理、福利服務之專業能\n力。畢業後除繼續深造外，可於非營利組織或政府部\n門中，從事福利政策規劃、社會工作與社會行政等相\n關工作。\n2.入學本校學士班學生須於畢業前(建議在大三結束\n前)修習「社會實踐課程」(包含實踐6 至10 小時)。\n修習「社會實踐課程」及格者方得畢業。身心障礙學\n生之「社會實踐課程」內容，得由授課教師依實際情\n形適當調整，特殊狀況者，經通識教育中心同意後，\n得予免修「社會實踐課程」。本項規定若有異動，以學\n生入學時適用之規定為準。"],["2110147","國立中正大學","勞工關係學系",2,27,"","＊國文、英文、數學B 須達本類組均標。\n1.本系擁有經濟、社會、法律與人力資源管理等領域\n之師資，提供跨科際整合之課程，強調全球化之視\n野，協助培養同學兼顧具理論與實務之專業知識，以\n利就業或再深造之需要。升大四暑假有實習課程，利\n用暑假進入實務機構內實際體驗職場及學習。畢業後\n除繼續深造外，可於公部門或工會服務，也可選擇於\n私部門從事人力資源管理等相關工作。\n2.入學本校學士班學生須於畢業前(建議在大三結束\n前)修習「社會實踐課程」(包含實踐6 至10 小時)。\n修習「社會實踐課程」及格者方得畢業。身心障礙學\n生之「社會實踐課程」內容，得由授課教師依實際情\n形適當調整，特殊狀況者，經通識教育中心同意後，\n得予免修「社會實踐課程」。本項規定若有異動，以學\n生入學時適用之規定為準。"],["2110148","國立中正大學","政治學系",1,27,"","＊國文、英文須達本類組前標。\n＊數學B 須達本類組均標。\n1.本系之招生期望係為具備人文關懷、公共參與以及\n服務社會，對於公共議題能有理解能力以及省思能\n力，且對國際關係、比較政治、公行與政策、科技與\n政治有興趣及具發展潛力之人才。\n2.課程學習著重於獨立思辨並培養學生溝通能力，核\n心課程包含閱讀大量資訊並判斷分析、基礎數理邏輯\n運算以及製作報告和口語能力之表達。\n3.入學本校學士班學生須於畢業前(建議在大三結束\n前)修習「社會實踐課程」(包含實踐6 至10 小時)。\n修習「社會實踐課程」及格者方得畢業。身心障礙學\n生之「社會實踐課程」內容，得由授課教師依實際情\n形適當調整，特殊狀況者，經通識教育中心同意後，\n得予免修「社會實踐課程」。本項規定若有異動，以學\n生入學時適用之規定為準。"],["2110151","國立中正大學","經濟學系",2,28,"","＊數學B 須達本類組頂標。\n＊國文、英文須達本類組均標。\n1.本系旨在培養學生基本的經濟邏輯，強調運用所學\n理論與知識處理相關問題，鼓勵學生跨領域學習與擴\n展視野，並培養職場專業能力與求學深造之競爭力。\n2.入學本校學士班學生須於畢業前(建議在大三結束\n前)修習「社會實踐課程」(包含實踐6 至10 小時)。\n修習「社會實踐課程」及格者方得畢業。身心障礙學\n生之「社會實踐課程」內容，得由授課教師依實際情\n形適當調整，特殊狀況者，經通識教育中心同意後，\n得予免修「社會實踐課程」。本項規定若有異動，以學\n生入學時適用之規定為準。"],["2110152","國立中正大學","財務金融學系",1,28,"","＊英文、數學B 須達本類組前標。\n＊國文須達本類組均標。\n1.隨著資訊、金融市場環境的快速變遷及相關法規、\n制度的建立，優秀的財金決 10169","國立體育大學","適應體育學系",1,33,"","＊國文須達本類組均標。\n＊英文須達本類組底標。\n本系乃國內唯一專注於此領域的學系，旨在培育適應\n體育的專業人才，並促進相關的建置與服務，以提升\n特殊需求者(包括障礙者、銀髮族、傷病未癒者等)之\n健康與福祉。本系重點培育「適應體育教學」與「運\n動照護指導」等專業人才，及促進相關學術之發展與\n提昇，並拓及障礙者於運動與休閒之參與和內容升\n級、特殊族群妥適的運動照護服務、社區各群體發展\n和密切融合、藉由身體適能與休閒活動獲得增進健康\n與提升生活品質。"],["2110044","國立臺灣體育運動大學","休閒運動學系",1,33,"","＊國文須達本類組底標。\n本系課程包含上課討論、電腦操作、課程實作，並且\n休閒運動術科課程亦為本系課程之重心，例如水上活\n動、登山、攀岩等，需要進行不同肢體的活動與運\n作，並亦需要一定程度之團隊合作及抗壓能力。"],["2110172","國立臺灣體育運動大學","運動資訊與傳播學系",1,33,"","＊國文、英文、數學B 須達本類組後標。\n1.本系為培育運動資訊傳播專業人才，需具備口語表\n達、溝通能力，轉播工作需久站、運用肢體操作攝影\n機等設備。\n2.具人際互動溝通協調能力、能控管自身情緒、具相\n當之抗壓能力。\n3.體育術科:本校訂有校訂必修游泳課程，院訂必修田\n徑課程各1 學分課程，另訂系選修術科5 學分。"],["2110005","國立屏東大學","特殊教育學系",1,33,"","＊總成績須達本類組均標。\n錄取者為非師資培育生，欲修讀教育學程者，可依規\n定提出申請參加遴選，通過者得修習教育學程(含國\n小、特教、幼教等類科)，相關資訊請參\n閱:https://cte.nptu.edu.tw。"],["2110006","國立屏東大學","教育心理與輔導學系",1,33,"","＊總成績須達本類組均標。\n錄取者為非師資培育生，欲修讀教育學程者，可依規\n定提出申請參加遴選，通過者得修習教育學程(含國\n小、特教、幼教等類科)，相關資訊請參\n閱:https://cte.nptu.edu.tw。"],["2110146","東海大學","財務金融學系",3,33,"","＊英文須達本類組後標。"],["2110188","東海大學","社會工作學系",1,33,"","＊總成績須達本類組均標。"],["2110011","輔仁大學","社會工作學系",1,33,"","＊國文、英文須達本類組均標。\n1.本系課程重視實務教學，並有安排校外實習，教學\n上多採分組討論，且重視團隊合作與溝通。\n2.本系重視口語表達、組織能力及解決問題能力，並\n能自我管理情緒且與他人互動。\n3.本校將英文與資訊等二項基本能力列入畢業條件，\n相關規定請於報名前詳閱學系網頁之「修業規則」及\n本校全人教育課程中心網頁「基本素養培育與檢測」\n專區，網\n址:http://www.hec.fju.edu.tw/article.jsp?articleID=93"],["2110015","輔仁大學","哲學系",2,34,"","1.本系相關資訊請參見本系網址\nhttps://www.philosophy.fju.edu.tw\n2.本校將英文與資訊等二項基本能力列入畢業條件，相\n關規定請於報名前詳閱學系網頁之「修業規則」及本\n校全人教育課程中心網頁「基本素養培育與檢測」專\n區，網址:\nhttp://www.hec.fju.edu.tw/article.jsp?articleID=93"],["2110019","輔仁大學","經濟學系",1,34,"","＊英文、數學B 須達本類組底標。\n1.本系教師教學重溝通理解及表達能力，需具備相當視\n覺、聽覺功能及口語表達能力。\n2.學生須於大二學年結束前參加英語能力測驗檢定考\n試，成績並應達CEF 之B1 進階級或其他測驗相對應\n之同等級標準，未達上述標準者，須於大三學年結束\n前再考一次，仍未通過者，大四必需修讀本系規定之\n英語課程且成績及格始具有畢業資格。\n3.本校將英文與資訊等二項基本能力列入畢業條件，相\n關規定請於報名前詳閱學系網頁之「修業規則」及本\n校全人教育課程中心網頁「基本素養培育與檢測」專\n區，網址:\nhttp://www.hec.fju.edu.tw/article.jsp?articleID=93"],["2110014","輔仁大學","社會學系",1,34,"","＊國文、英文須達本類組底標。\n本校將英文與資訊等二項基本能力列入畢業條件，相\n關規定請於報名前詳閱學系網頁之「修業規則」及本\n校全人 認識及選擇學系，請務必上網查詢課程與簡\n介(https://law.pu.edu.tw/)。"],["2110189","靜宜大學","人文跨域與應用學系",1,39,"","＊國文須達本類組底標。\n1.本系學習內容除文學、文化課程外，尚有數位與文創\n實作等跨域課程。\n2.為更詳盡認識及選擇學系，請務必上網查詢課程與簡\n介 (https://diha.pu.edu.tw/)"],["2110024","大葉大學","設計學系",2,39,"","＊國文須達本類組底標。\n1.本系提供多元且具彈性的設計課程，學生可依個人興\n趣、能力與學習需求，選擇適合的專業方向。\n2.專業領域涵蓋視覺傳達、數位媒體、AI 設計應用、\n產品設計、交通與無人載具設計、文創設計及地方創\n生等，並重視跨域學習與產業實務連結。\n3.課程重視創意思考、設計實作、數位工具應用及團隊\n合作，並結合大葉大學德國師徒制教學特色及業師協\n同教學，強化學生專業實作能力與產業接軌經驗。\n4.畢業後可依個人興趣與專長，投入相關設計產業，亦\n可選擇繼續升學，具備多元職涯發展方向。\n5.大葉歡迎同學至本校就讀；未來課業學習若遇困難，\n資源教室輔導員將盡力協助媒合相關專長教師，進行\n課後補救教學或個別課業輔導。\n6.本系網址:https://ds.dyu.edu.tw/；聯絡電話:04-8511888\n分機5011。"],["2110025","大葉大學","多媒體數位內容學士學位學程",3,39,"","＊國文須達本類組底標。\n1.由跨領域之數位媒體設計師資組成，課程以動畫設\n計、影視特效設計、遊戲設計、互動設計、動漫美\n術、模型製作及AI 輔助設計等產業所需人才進行一條\n龍的專業能力養成，提供學生將來進入這個兆元產業\n最佳的課程與專業訓練。\n2.大葉歡迎同學至本校就讀；未來課業學習若遇困難，\n資源教室輔導員將盡力協助媒合相關專長教師，進行\n課後補救教學或個別課業輔導。\n3.網址: http://mdc.dyu.edu.tw/，聯絡電話04-\n8511888#2421。"],["2110037","大葉大學","空間設計學系建築組",2,40,"","＊國文須達本類組底標。\n1.本系課程教授採分組討論及發表報告，部分課程需親\n自操作具危險性機器設備，以奠定基礎專業技能。\n2.大葉歡迎同學至本校就讀；未來課業學習若遇困難，\n資源教室輔導員將盡力協助媒合相關專長教師，進行\n課後補救教學或個別課業輔導。\n3.本系網址:http://sp.dyu.edu.tw，臉書搜尋「大葉大學\n空間設計學系/建築研究所」，聯絡電話:04-8511888 轉\n5195。"],["2110038","大葉大學","空間設計學系室內設計組",2,40,"",""],["2110043","大葉大學","財務金融學系",1,40,"","＊國文須達本類組底標。\n1.本系於學生入學後即給予職涯方向輔導，期望大二\n起，即對智慧投資、銀行專業及公司財務組有一確切\n的專攻方向。聘請業界師資協同授課、提供海內外實\n習及證照輔導，並鼓勵大四提前進入職場實習。財金\n工作高起薪的特性，可讓學生贏在人生的起跑點。\n2.大葉歡迎同學至本校就讀；未來課業學習若遇困難，\n資源教室輔導員將盡力協助媒合相關專長教師，進行\n課後補救教學或個別課業輔導。\n3.本系網址 http://fm.dyu.edu.tw/，聯絡電話04-\n8511888#3521。"],["2110052","大葉大學","會計與資訊管理學系",1,40,"","＊國文須達本類組底標。\n1.因應人工智慧AI 的崛起及相關應用，本系設立「人\n工智慧科技管理組」專長。培養學生具備協助企業商\n業智慧化，及開發使用人工智慧軟體，協助企業做精\n準行銷及企業自動化。課程包含時下最夯智慧行銷分\n析、人工智慧工具應用、智慧物流與供應鏈管理、資\n訊安全等。\n2.教育目標:(1)培育能夠應用人工智慧(AI)技術的資訊\n管理、數位會計、智慧稽核、投資理財及永續管理等\n領域的創新專業人才(2)透過跨領域整合與AI 技術的實\n務應用，致力於將學生打造成未來數位化社會中的領\n導者、激發潛能，以提升學生在數位轉型及智慧化管\n理中的競爭力。\n3.大葉歡迎同學至本校就讀；未來課業學習若遇困難，\n資源教室輔導員將盡力協助媒合相關專長教師，進行\n課後補救教學或個別課業輔導。\n4.電話:04-8511888 轉3131；網址:\nhttps://ai.dyu.edu.tw。"],["2110176","大葉大學","AI 創新設計學士學位學程",2,41,"","＊國文須達本類組底標。\n1.AI 創新設計學程\n(1)目標:讓學生會畫圖能設計流程、驗證成效、串接工\n具，直接進入智慧電商與智慧廣告職場。\n(2)發展方向與課程規劃:智慧電商×智慧廣告×AI 數位\n內容系統設計，以設計為核心，整合生成式AI、No-\nCode 工具、數位看板、眼動分析與企業實習，培養整\n合跨域設計人才。\n(3)建立學程護城河:從傳統設計與一般AI 課程中區\n隔，創造新的專業藍海。數位內容+軟體應用+硬體整\n合+商業情境，形成差異化定位的數位內容系統整合設\n計師，透過智慧電商、智慧廣告、軟硬體整合與企業\n實習等特色，提升學生就業辨識度，強化學程品牌與\n招生競爭力。\n2.大葉歡迎同學至本校就讀；未來課業學習若遇困難，\n資源教室輔導員將盡力協助媒合相關專長教師，進行\n課後補救教學或個別課業輔導。\n3.網址: http://aiid.dyu.edu.tw/， 聯絡電話04-\n8511888#5141。"],["2110128","銘傳大學","商業設計學系（桃園校區）",1,41,"","＊國文、英文須達本類組底標。\n1.本系課程包含色彩設計、觀察及顏色辨識能力，並\n有實務操作與專題製作課程。\n2.本系在桃園校區上課。\n3.學生在校期間需通過「英語能力」、「資訊能力」、\n「中文能力」、「運動能力」及「專業基本能力」檢定\n者，始得畢業。"],["2110196","銘傳大學","人工智慧應用暨管理學士學位學程(台北校區)",1,41,"","1.本系在台北校區上課。\n2.本系歡迎身心障礙同學就讀，惟地處台北校區階梯\n較多，建議選填志願前可先至校園，瞭解環境。\n3.學生在校期間需通過「英語能力」、「資訊能力」、\n「中文能力」、「運動能力」及「專業基本能力」檢\n定，始得畢業。"],["2110149","實踐大學","休閒產業管理學系（高雄校區）",1,41,"","＊國文須達本類組底標。\n本系以豐富的遊憩、運動與健身設施器材、校內外營\n運體驗場地與業師，培養專業的遊憩運動企劃人才。\n學生更可跨領域修習精品咖啡烘焙經營、休閒文創規\n劃和文化設計策展等特色課程，所學呼應全球綠色產\n業(重視環境生態)、橘色經濟(關注人本人文與健康)\n趨勢。學生享有豐富實用課程、國家證照保障學程、\n薪資優渥實習，保證學生畢業即就業，更是當代渴望\n的跨領域職能人才。"],["2110161","實踐大學","風險管理與保險學系（臺北校區）",3,41,"","1.本校諮商中心設有資源教室及輔導老師，提供課業\n及生活諮詢輔導之協助。\n2.本學系課程包含較多人群互動，且大四有「保險實\n作」實習課程。\n3.學生須於修業年限內修畢本學系組應修學分，並通\n過規定之「專業證照」畢業門檻。"],["2110150","實踐大學","服飾設計與經營學系（高雄校區）",1,42,"","＊國文須達本類組底標。\n1.本系課程重視溝通理解及表達，須具備視覺設計與\n色彩判定能力及口語表達能力。\n2.本系畢業製作必須通過系上總評展演評量，方可畢\n業。\n3.本系以創意與品牌經營為本，人文美學、AI 應用與\n技術為輔，並配合國家經濟發展，以培養具備時尚服\n飾專業知識及經營行銷能力之優秀專業人才為目標，\n達到適量、適質、適時及適地的發展。\n4.學系聯絡電話07-6678888#4320~4322。"],["2110154","實踐大學","時尚設計學系（高雄校區）",1,42,"","＊國文須達本類組底標。\n1.本系課程重視溝通理解及表達能力，並須具備視覺\n設計與色彩判定能力。\n2.本系設計製作必須通過系上總評展演評量，方可畢\n業。\n3 本系以創意設計思維為本，人文美學與經營管理為\n輔。希望以務實嚴謹的學習，創造未來的競爭力。\n培養思想創造的強者，重視美感的養成與設計思維的\n訓練。以培育優秀之時尚整體造型及傳媒影像設計的\n專業知識與管理統合能力人才為方向目標。\n4.學系聯絡電話07-6678888#4361。"],["2110160","實踐大學","社會工作學系（臺北校區）",4,42,"","1.本校諮商中心設有資源教室及輔導老師，提供課業\n及生活諮詢輔導之協助。\n2.本學系著重實務操作及課程實習(含機構實習)。\n3.學生須於修業年限內修畢本學系組應修學分，並通\n過規定之專業能力畢業門檻。"],["2110187","實踐大學","電腦動畫學士學位學程（高雄校區）",2,42,"","＊國文須達本類組底標。\n1.本學程課程包含美術設計及2D、3D 動畫軟體操作，\n教師教學重溝通理解及表達能力，需具備相當視覺、\n聽覺功能及口語表達能力。\n2.學生除須於修業年限內修畢所屬學程組應修學分\n外，畢業門檻必須達到學校規定。\n3.本學程特色:\n(1)各類型(2D、3D、多媒材)動畫企劃創作至製作完成\n輸出影片，完整的專業訓練。\n(2)導入動畫相關各項產學專案，讓學生在學期間實際\n接觸產業技術需求和訓練，引導媒合到業界實習或專\n案實習，達到畢業即就業的目標。\n(3)專業課程全由來自產業界具有實務經驗的專業師資\n授課。\n4.本學程網\n址:https://bpca.kh.usc.edu.tw/app/home.php。"],["2110200","大同大學","數位媒體設計學系",1,43,"","＊國文、英文須達本類組底標。\n本系旨在培養互動設計與遊戲設計人才，著重介面設\n計(UI)、使用者經驗(UX)、互動設計、虛擬實境/擴增\n實境、2D/3D 遊戲等設計與開發。廣邀實務經驗豐富之\n業師共同授課，培養符合產業需求的競爭力。鼓勵學\n生參與國內外展演與設計競賽，提供國際交換及碩士\n雙聯學位的跨國學習管道，以提升學生的國際觀及競\n爭優勢，培育具備設計創新應用、跨域整合、全球視\n野及具社會觀懷的設計菁英與領導人才。"],["2110173","慈濟大學","兒童發展與家庭教育學系",1,43,"",""],["2110174","慈濟大學","人類發展與心理學系",2,43,"","＊國文須達本類組底標。"],["2110175","慈濟大學","社會工作學系",1,43,"","＊國文須達本類組底標。"],["2110009","臺北醫學大學","醫務管理學系",4,43,"","＊國文、英文、總成績須達本類組均標。\n1.本學系旨在培養醫務管理人才，並設有碩士班，鼓\n勵大學部優秀學生參與先修碩士班課程，達到連續學\n習之目的，使其擁有醫學精神內涵和各種醫療管理知\n識、觀念及技術。歡迎具有人文素養、樂於服務，並\n具有自我學習及成長能力之學生加入。\n2.本學系必修課程包含至醫療機構或業界見實習，且\n因專業學習的性質，課程須繳交書面及口頭報告。\n3.學系網址:http://hca.tmu.edu.tw"],["2110197","長榮大學","國際企業學系",1,43,"","本校設有資源教室，關懷並提供學生課業及生活諮詢\n服務。"],["2110198","長榮大學","運動競技學系",2,43,"",""],["2110199","長榮大學","數位媒體設計學系",1,43,"","1.本校設有資源教室，關懷並提供學生課業及生活諮\n詢服務。\n2.本系課程內容包含理論及實作(編排設計、電腦繪\n圖、電腦輔助設計、電腦動畫、數位遊戲設計…等)須\n具備電腦軟體操作及辨別顏色能力。\n3.本系以藝術美學為基礎，結合美藝理論與數位媒體\n之專業實務；應用於廣告商展企劃、視覺設計、包裝\n設計、遊戲設計、數位媒體、網頁設計、2D 與3D 動畫\n等文創與數位媒體產業，培育兼具人文思考、藝術創\n意、美學素養、科技創新，並符合數位科技脈動，契\n合現代社會潮流的數位媒體專業人才。"],["2110010","玄奘大學","社會工作學系",1,43,"","＊國文須達本類組底標。\n1.本校學務處學生輔導暨職涯發展中心設有資源教\n室，提供學生校園生活關懷、課業輔導及生職涯諮詢\n等服務。特殊教育學生應主動提出該障礙類別輔具及\n特殊教育需求。\n2.本系著重實務教學，課堂多採分組討論，大三及大\n四課程包含兩階段校外機構實習。\n3.相關資訊請參閱本系網\n址:https://www.hcu.edu.tw/sw。"],["2110013","玄奘大學","應用心理學系",1,44,"","＊國文須達本類組底標。\n1.本系學習內容包含基礎心理學、助人心理學、工商\n心理學與犯罪心理學。凡是對人感興趣者，適合報考\n本系。同時，鼓勵同學跨域學習，培養多元技能。\n2.本校學務處學生輔導暨職涯發展中心設有資源教\n室，提供學生校園生活關懷、課業輔導及生職涯諮詢\n等服務。特殊教育學生應主動提出該障礙類別輔具及\n特殊教育需求。"],["2110103","亞洲大學","心理學系",1,44,"","＊總成績須達本類組均標。\n1.本校設有資源教室，關懷並提供學生課業及生活諮\n詢服務。\n2.本系教師教學重溝通理解及表達能力、分組討論，\n課程著重實務及實習教學，並有專題製作、報告作\n業，需具有良好自我學習、管理與情緒適應能力。\n3.具備電腦操作能力者。\n4.本系畢業門檻要求學生須赴企業或機構完成實務實\n習。"],["2110106","亞洲大學","財經法律學系",1,44,"","＊國文、歷史須達本類組底標。\n1.為配合社會對科技法律人才之迫切需要、及改善科\n技法律風險之不確定性，本系科法組，課程均以因應\n時代之需求並提供學生專業之就業機會而規劃。本組\n畢業生除從事科技法律業之相關工作外，亦可參加國\n家司法人員考試(司法官、律師)、法制人員、記帳\n士、會計師等專技人員考試，或選擇進入研究所深\n造，發展機會寬廣。\n2.本學系課程專業須具備自我學習，惟因本系需校外\n實習，需依實習單位安排時間，自行前往。\n3.本系相關資訊、修課規定及畢業條件等請參閱本系\n網頁:https://fel.asia.edu.tw。"],["2110107","亞洲大學","社會工作學系",1,44,"","＊國文須達本類組均標。\n1.本系重視表達與思辯，學習歷程中強調小組討論與\n報告，需具人際互動溝通協調能力、能控管自身情\n緒、具相當之抗壓能力。\n2.本系著重實務，課程包含兩階段校外機構實習課程\n(實習共兩次至少400 小時以上，實習時數依機構規\n定)，需具備好體能、移動能力。\n3.本畢業後除繼續深造外，可於非營利組織或政府部\n門中，從事福利政策規劃、社會工作與社會行政等相\n關工作。"],["2110108","亞洲大學","數位媒體設計學系",2,44,"","＊總成績須達本類組均標。\n1.本校設有資源教室，關懷並提供學生課業及生活諮\n詢服務。\n2.本系教師教學重溝通理解及表達能力、分組討論，\n課程著重實務及實習教學，並有專題製作、報告作\n業，需具有良好自我學習、管理與情緒適應能力。\n3.具備電腦操作能力。\n4.本系基本能力含有手繪設計、構想能力、視覺、辨\n色手部運用之能力。可參與業界實務實習，並完成實\n務操作。"],["2110109","亞洲大學","創意商品設計學系",1,45,"","＊總成績須達本類組均標。\n1.本校設有資源教室，關懷並提供學生課業及生活諮\n詢服務。\n2.教師採分組討論，課程著重實務及實習教學，並有\n專題製作。\n3.本系基本能力含有手繪設計、構想能力、視覺、辨\n色、手部運用之能力；可參與業界實務實習者，並完\n成實務操作。\n4.具備電腦操作能力者。\n5.本系課程含有在機器操作及手作要求，宜具有良好\n自我學習、管理與情緒適應能力。"],["2110186","亞洲大學","職能治療學系",1,45,"","＊國文、英文須達本類組均標。\n1.本系畢業生須通過專技高考，取得證照後執業。臨\n床工作需引導治療團體並提供專業治療，學生具備人\n際互動與溝通協調能力、控管自身情緒、良好抗壓能\n力。\n2.本系為醫療健康相關學系，學習課程具有與人直接\n互動的特性，學生須具備醫學專業知識、醫療技能與\n人文素養。學生於就學期間將修習活動分析與判斷、\n大體解剖、醫療團隊溝通、建立醫病關係等專業內\n容，課程多以原文書為主。\n3.本校設有資源教室，關懷與服務身心障礙學生，可\n提供學生課業及生活等方面諮詢服務。\n4.本校學士班學生需通過「英文畢業門檻」及「系專\n業選修學程」課程，始具畢業資格。"],["2110035","開南大學","AI 科技與創新設計學士學位學程",2,45,"","＊國文須達本類組底標。\n本系教師教學重溝通理解，學生須具備表達能力及電\n腦操作能力。"],["2110040","開南大學","資訊管理學系",2,45,"",""],["2110012","佛光大學","產品與媒體設計學系",1,45,"","1.本校位處山坡地，建議選填志願前可至校園了解環\n境。\n2.本系各專業課程均重視學生之專注能力、辨色能\n力，以及雙手靈活操作能力，另須進行口頭報告及實\n際作品產品。"],["2110002","臺北市立大學","特殊教育學系",1,45,"","＊國文、英文須達本類組均標。\n本系為師資培育學系，經本入學管道錄取者為外加名\n額，須經教育部核准後，方能取得師資生資格。"],["2110003","臺北市立大學","休閒運動管理學系",1,45,"","＊國文須達本類組後標。\n本系有休閒運動術科課程，故有大量體能活動。"],["2120012","國立政治大學","資訊工程學系",1,45,"","＊數學 A 須達本類組前標。\n＊英文、物理須達本類組均標。\n本系館建物年代較早、樓梯較多，建議選填志願前可先行了解本系環境。"],["2120077","國立政治大學","地政學系土地測量與資訊組",1,46,"","＊國文、數學A 須達本類組前標。\n＊英文須達本類組均標。\n本系必修之實習課程包含操作測量儀器及野外資料蒐\n集，需具備基本體能及移動能力。"],["2120029","國立清華大學","化學工程學系",1,46,"","＊英文、物理、化學須達本類 」和「數位通訊」\n兩大專業領域，並涵蓋射頻電路與天線、信號處理與\n系統、網路協定與系統等三項子領域，為同學提供多\n元化的學習與發展途徑。同時，配合教學實驗室的實\n作課程，致力於培養學生兼具寬廣視野與跨領域整合\n能力之專業素養。"],["2120011","逢甲大學","資訊工程學系",1,54,"","1.本校日間學士班學生在規定修業年限內，修足應修\n科目與學分數(含非本系至少13 學分)，並通過本校及\n該系、學位學程規定之各項考核(畢業條件) 成績合格\n者，始得畢業授予學位。\n2.本系學士班成立於 1969 年，為我國資訊教育界先\n驅之一，迄今已培育大學畢業學生餘萬人，在國內外\n表現極為優異，深獲肯定。學士班以培養學生在資訊\n工程領域的專業能力為主要目標。"],["2120053","靜宜大學","永續環境與智慧科技學士學位學程",1,54,"","＊國文、數學A 須達本類組均標。\n為更詳盡認識及選擇學系，請務必上網查詢課程與簡\n介(https://sest.pu.edu.tw/)。"],["2120079","靜宜大學","晶片設計學士學位學程",1,54,"","＊英文、數學A 須達本類組後標。\n1.本學程課程核心在於晶片設計與電路實作，需長時\n間進行電路圖比對、版圖設計與電路模擬等高度視覺\n化操作，需具備即時辨識細微圖樣與符號之能力。\n2.為更詳盡認識及選擇學系，請務必上網查詢課程與\n簡介(https://icd.pu.edu.tw/)。"],["2120007","大葉大學","環境與安全工程學系",2,54,"","＊國文須達本類組底標。\n1.選取具備管理及理工特長，對環境工程或安全工程\n事務具備高度熱忱，且個性積極進取之青年學子。\n2.大葉歡迎同學至本校就讀；未來課業學習若遇困\n難，資源教室輔導員將盡力協助媒合相關專長教師，\n進行課後補救教學或個別課業輔導。\n3.本系網址:http://ese.dyu.edu.tw/，聯絡電話04-\n8511888#2351。"],["2120003","大葉大學","機械與自動化工程學系",2,55,"","＊數學A 須達本類組底標。\n1.本系秉持「理論與實務並重」、「科技整合」與「師\n徒制」之教學理念。\n2.著重於『智慧車輛與能源科技』、『AI 機械與機器人\n科技』等教學與研究領域，進行實務訓練與技術傳\n承，包括應用自動化及機器人技術於智慧車輛、綠能\n科技、精密機械與半導體電子設備等相關產業。\n3.大葉歡迎同學至本校就讀；未來課業學習若遇困\n難，資源教室輔導員將盡力協助媒合相關專長教師，\n進行課後補救教學或個別課業輔導。\n4.本系網址:http://me.dyu.edu.tw，聯絡電話04-\n8511888#2101"],["2120006","大葉大學","電機工程學系",1,55,"","＊數學A 須達本類組底標。\n1.本系大學部專業課程區分為「半導體與光電組」、\n「智慧系統組」，學生依個人興趣修習相關課程，培養\n堅實的專業知能。本系設有「乙級室內配線」國家檢\n定場，輔導學生就地考照。\n2.大葉歡迎同學至本校就讀；未來課業學習若遇困\n難，資源教室輔導員將盡力協助媒合相關專長教師，\n進行課後補救教學或個別課業輔導。\n3.本系網址:http://ee.dyu.edu.tw/，聯絡電話:04-\n8511888#2161。"],["2120010","大葉大學","半導體學士學位學程",2,55,"","＊數學A 須達本類組底標。\n1.本學士學位學程致力培育具有實作及就業競爭力之\n半導體專業人才，以培養半導體設備與製程工程師為\n目標。所開設之半導體專業課程涵蓋半導體製程實\n務，半導體設備應用實務以及半導體材料分析領域，\n同時增加永續製造、循環經濟等議題教育，符合產業\n永續發展需求。\n2.大葉大學歡迎同學至本校就讀；未來課業學習若遇\n困難，資源教室輔導員將盡力協助媒合相關專長教\n師，進行課後補救教學或個別課業輔導。\n3.網址:http://semi.dyu.edu.tw/，聯絡電話:04-\n8511888 # 2171。"],["2120064","義守大學","電機工程學系",1,55,"","義守大學電機工程學系，開啟您通往創新科技的大門:\n1.前瞻課程:機器人、生醫感測、綠色能源、智慧電\n網、物聯網、光電、半導體、電波、通信及訊號處\n理，掌握改變世界的尖端科技。\n2.AI 整合:全面融入人工智慧，培養AI 專業複合人\n才。\n3.實戰導向:專題製作、業界實習，理論與實踐並重。\n4.國際視野:與國際姊妹校合作，培育具競爭力的AI\n菁英。\n5.就業優勢:畢業生備受科學園區及國內外高科技企業\n青睞。本學系致力培育全方位電機與智慧科技專才，\n為您打造無限可能的國際職涯藍圖。聯絡電話:07-\n6577711 轉6603，網址:ee.isu.edu.tw。"],["2120080","實踐大學","電腦動畫學士學位學程（高雄校區）",1,56,"","＊國文須達本類組底標。\n1.本學程課程包含美術設計及2D、3D 動畫軟體操作，\n教師教學重溝通理解及表達能力，需具備相當視覺、\n聽覺功能及口語表達能力。\n2.學生除須於修業年限內修畢所屬學程組應修學分外，\n畢業門檻必須達到學校規定。\n3.本學程特色:\n(1)各類型(2D、3D、多媒材)動畫企劃創作至製作完成\n輸出影片，完整的專業訓練。\n(2)導入動畫相關各項產學專案，讓學生在學期間實際\n接觸產業技術需求和訓練，引導媒合到業界實習或專\n案實習，達到畢業即就業的目標。\n(3)專業課程全由來自產業界具有實務經驗的專業師資\n授課。\n4.本學程網址:https://bpca.kh.usc.edu.tw/app/home.php。"],["2120081","大同大學","工業設計學系",1,56,"","＊英文須達本類組底標。\n本校位於台北市，緊鄰北美館與花博園區，擁有培養\n美學素養的最佳環境。以培育跨領域之產品設計人才\n為目標。教學特色在於：1.理論與實務並重、2.小組教\n學、3.國際交流機會多。畢業系友出路廣泛且深具競爭\n力，本校獲評為亞太區前10 名之設計學校。"],["2130018","國立清華大學","生命科學系",1,56,"","＊數學A、化學、生物須達本類組頂標。\n本系重視閱讀、聽講、溝通理解及表達能力，故需具\n備有效聽說及雙向溝通能力。"],["2130032","國立清華大學","醫學科學系",1,56,"","＊化學、生物須達本類組頂標。\n＊英文須達本類組前標。\n本系重視閱讀、聽講、溝通理解及表達能力，故需具\n備有效聽說及雙向溝通能力。"],["2130034","國立清華大學","生命科學暨醫學院學士班",1,56,"","＊生物須達本類組頂標。\n＊英文、數學A 須達本類組前標。\n本系重視閱讀、聽講、溝通理解及表達能力，故需具\n備有效聽說及雙向溝通能力。"],["2130017","國立臺灣大學","心理學系",1,56,"","＊英文、數學A 須達本類組前標。\n因本系部份課程需進行小組討論，故需具備有效聽說\n及雙向溝通能力。"],["2130019","國立臺灣大學","園藝暨景觀學系",1,56,"","＊英文、數學A、總成績須達本類組頂標。"],["2130020","國立臺灣大學","生命科學系",1,56,"","＊生物、總成績須達本類組頂標。"],["2130030","國立臺灣師範大學","體育與運動科學系",1,56,"","＊國文須達本類組均標。\n＊英文、生物須達本類組後標。"],["2130016","國立成功大學","心理學系",1,57,"","＊國文、英文、數學A 須達本類組均標。"],["2130043","國立成功大學","生命科學系",3,57,"","＊英文、化學、生物須達本類組頂標。\n操作實驗為本系學習之重點，學生均需透過親自操作\n儀器、野外田野調查奠定基礎專業知識與實驗技能，\n部分實驗須透過色彩判定實驗結果。實驗具有一定危\n險性，需有能力即時移動身軀遠離危險現場。"],["2130023","國立中興大學","土壤環境科學系",1,57,"","＊英文、化學、生物須達本類組均標。\n1.本系實驗課程，須親自進入田間進行農場作業操作，\n如手持鋤頭整地等，另實驗課必須親自操作危險化學\n藥品並判讀結果，學生須具備獨立操作及個人安全維\n護能力。\n2.本系網址:https://soil.nchu.edu.tw/，聯絡電話:04-\n22840373#3301。"],["2130024","國立中興大學","生物科技學士學位學程",1,57,"","＊英文、化學、生物須達本類組前標。\n1.因實驗課程必須親自操作危險化學藥品並判讀結果，\n故須可久站且能穩定操作實驗。\n2.本學程教育宗旨為培育能自我學習及能對農業、環\n境、醫藥、工業等領域進行科際整合的生物科技人\n才。課程涵蓋植物生技、動物生技、微生物生技、生\n物資訊暨生醫機電、智財暨行銷管理等跨領域課程。\n3.本學程網址:https://bpbiot.nchu.edu.tw/，聯絡電話:04-\n22840811#536。"],["2130025","國立中興大學","景觀與遊憩學士學位學程",1,57,"","＊英文、數學A 須達本類組前標。\n1.本學程設計類課程需要繪圖設計、製作模型，故須能\n運用肢體操作工具且有獨立操作及個人安全維護能\n力，並具備視覺設計與色彩判定能力。\n2.本學程網址:https://plr.nchu.edu.tw/，聯絡電話:04-\n22840513#102。"],["2130035","國立陽明交通大學","生物科技學系",1,57,"","＊英文、化學、生物須達本類組前標。\n本系課程含實驗操作，基於考量實驗操作危險性與結\n果判斷之需要，學生須具備獨立操作能力及個人安全\n維護能力。"],["2130036","國立陽明交通大學","生命科學系暨基因體科學研究所",1,57,"","＊英文、數學A、生物須達本類組前標。\n1.本系教師教學重溝通理解及表達能力。\n2.實驗課程極為重要，基於考量實驗操作危險性與結\n果判定之需要，學生須具備獨立操作能力及個人安全\n維護能力。"],["2130026","國立中山大學","生物科學系",1,58,"","＊生物須達本類組前標。\n＊數學A、化學須達本類組均標。\n1.本系學習內容包含普通生物學(含實驗)、生物化\n學、遺傳學、動植物生理學、分子生物學、生物技術\n實驗等核心相關課程，須具備辨色能力。\n2.本系課程含實驗操作，基於考量實驗操作危險性與\n結果判斷之需要，學生須具備獨立操作能力及個人安\n全維護能力。\n3.入學本校學士班學生畢業前，需依起始分級先修畢\n「語文素養:英語文」領域必修課程，再修習一門學術\n英文EAP 或專業英文ESP 跨院選修課程，並通過本校\n「英語文能力標準認證」，方得畢業。詳細資料請逕至\n西灣學院/更多資訊/規章表單/學生專區/學士班學生\n英語文能力標準認證。\n4.各項說明若有未盡事宜，悉依本校「學則」及必修\n科目表等相關規定辦理。"],["2130027","國立中山大學","海洋生物科技暨資源學系",1,58,"","＊英文、化學、生物須達本類組前標。\n1.本系必修科目以全英語授課，選修課程採中文或全\n英語授課，非全英語授課課程不得抵免本系必修課\n程。\n2.課程重溝通理解及表達能力，部份課程需進行小組\n討論、團隊合作及口頭報告。\n3.實驗為本系學習重點，學生均需雙手操作儀器、久\n站，及具相當之視覺功能以觀測辨識圖像。海上實習\n為必修，需搭乘研究船採集和觀察，具一定危險性，\n需有能力即時移動遠離危險現場及個人安全維護能\n力。\n4.須修畢大一上學期專業必修課程並取得合格成績，\n方可申請轉系。\n5.入學本校學士班學生畢業前，需依起始分級先修畢\n「語文素養:英語文」領域必修課程，再修習一門學術\n英文EAP 或專業英文ESP 跨院選修課程，並通過本校\n「英語文能力標準認證」，方得畢業。詳細資料請逕至\n西灣學院/更多資訊/規章表單/學生專區/學士班學生\n英語文能力標準認證。\n6.各項說明若有未盡事宜，悉依本校「學則」及必修\n科目表等相關規定辦理。"],["2130038","國立中正大學","心理學系",1,58,"","＊國文、英文、數學A 須達本類組均標。\n1.因本系有多門心理學實驗課程及部分課程以分組方\n式進行，故需具有實驗操作及溝通能力，且具備自我\n管理與情緒適應能力。\n2.入學本校學士班學生須於畢業前(建議在大三結束\n前)修習「社會實踐課程」(包含實踐6 至10 小時)。\n修習「社會實踐課程」及格者方得畢業。身心障礙學\n生之「社會實踐課程」內容，得由授課教師依實際情\n形適當調整，特殊狀況者，經通識教育中心同意後，\n得予免修「社會實踐課程」。本項規定若有異動，以學\n生入學時適用之規定為準。"],["2130014","國立高雄師範大學","生物科技系",1,59,"","＊英文、生物、總成績須達本類組前標。\n1.上課地點:燕巢校區。\n2.本系有多門需動手操作之實驗課程，考量實驗操作\n危險性與結果判定之需要，學生須具備獨立操作能\n力、個人安全維護能力和口語表達能力。\n3.本系採師培與非師培並行；入學後可依本校『師資\n培育生甄選及修習教育專業課程辦法』及各學系所訂\n相關辦法，或依本校『學生修習教育學程辦法』考試\n錄取後，修習教育學程。\n4.本校實施「英語能力檢定」之畢業門檻，學士班學\n生在規定修業年限內，除修滿該學系應修學分外，「英\n語能力檢測」必須達到學校規定，方得畢業。\n5.以上說明若有未盡事宜，悉依本校「學則」及相關\n法令規定辦理。"],["2130003","國立彰化師範大學","生物學系",2,59,"","＊英文、生物須達本類組均標。\n1.本系相當重視實驗課程學習，學生均需在實驗室親\n自操作儀器，或到野外實地觀察生物與採集，應具良\n好體能、移動能力，部分實驗須透過色彩判定實驗結\n果，應具相當之視覺辨色能力及口語表達和獨立完成\n實驗的能力。\n2.本校非所有學生皆可修習教育學程，相關規定請參\n閱本校師資培育中心網站。"],["2130042","國立嘉義大學","木質材料與設計學系",1,59,"","＊總成績須達本類組均標。\n本校提供大一新生一般宿舍(限戶籍地距離就學校區10\n公里以外之新生)。"],["2130006","國立東華大學","諮商與臨床心理學系",2,59,"",""],["2130037","國立宜蘭大學","生物技術與動物科學系",1,59,"","＊化學、生物、總成績須達本類組均標。\n本系有許多需動手操作之實驗課程或實習機會，需運\n用良好視覺、辨色力、行動能力及溝通能力。"],["2130040","國立體育大學","運動保健學系",2,59,"","＊國文、英文須達本類組後標。\n本系整合運動科學與保健醫學專業，以運動防護與功\n能訓練、健康體適能與運動指導等運動保健領域人才\n為教育目標。大一大二學習建構學生具備運動員及大\n眾之健康維護與運動安全相關運動保健學能，提供專\n業發展探索之課內外專業實踐活動；於大三起可依興\n趣選擇運動防護、健身運動指導、樂齡運動健康促進\n與指導、徒手保健與傳統推拿整復、肌力與體能訓練\n等專業課程模組，進行為期2 學年之實務場域實作學\n習與應用。\n課程架構兼顧運動健康產業發展趨勢之廣度與深度學\n習，課程執行兼具理論與實作應用，海外實習、國際\n交換等國際學習資源豐富，符合運動保健產業多元發\n展趨勢及全齡全民健康活力需求，歡迎有志投入運動\n健康促進與運動防護專業有興趣的同學加入本系行\n列。"],["2130044","國立臺灣體育運動大學","體育學系",1,60,"","＊國文、英文、總成績須達本類組後標。\n1.本系培養體育教學、運動健身指導人才，須具備口\n語表達、溝通能力。\n2.具人際互動溝通協調能力、具相當之抗壓能力。\n3.歡迎對運動有興趣、熱忱的同學加入本系的行列。"],["2130039","東海大學","高齡健康與運動科學學士學位學程",1,60,"","1.本學程發展主軸為培育運動預防醫學之人才。課程\n學習重視團隊合、協調溝通，並需參與業界實務實\n習。\n2.學系聯絡電話:04-23590121 分機37502。\n3.網址:http://swss.thu.edu.tw/\n4.聯絡E-mail:swss@thu.edu.tw"],["2130005","東吳大學","心理學系",1,60,"","＊數學A 須達本類組均標。\n1.本校有外雙溪及城中兩個校區，外雙溪校區位處山\n坡地，需具備移動能力。\n2.法律學系修業5 年，其餘學系均為4 年。\n3.除須於規定年限內修畢學系規定應修科目與學分\n外，尚須通過校系規定之外語能力、資訊能力及美育\n活動畢業標準，方得畢業；如未通過，本校訂有補救\n措施，協助提昇其能力與素質。\n4.為使學生得以充分運用教學與各項生活資源，法商\n學院一年級新生每週規劃部分課程至外雙溪校區上\n課。\n5.本校學雜費及獎助學金等資訊，請逕上本校德育中\n心網頁查詢。"],["2130028","中原大學","生物科技學系",1,60,"","＊英文、化學、生物須達本類組後標。\n1.操作實驗為本系學習之重點，學生均須透過親自操作\n儀器以了解實驗原理，使課程內容應用在實驗上，奠\n定生物醫學專業知識與實驗技能。實驗需透過色彩判\n定實驗結果，且相關實驗具有一定危險性，須有能力\n即時移動身軀遠離危險現場。\n2.學士班入學學生，必須通過本校認定之英文能力鑑定\n考試，始准予畢業，請詳見「中原大學學生英文畢業\n門檻作業細則」。\n3.本系網址:https://bioscience.cycu.edu.tw/"],["2130029","中原大學","地景建築學系",1,60,"","＊國文、英文、生物須達本類組後標。\n1.學士班入學學生，必須通過本校認定之英文能力鑑定\n考試，始准予畢業，請詳見「中原大學學生英文畢業\n門檻作業細則」。\n2.本系網址:https://cycula.cycu.edu.tw/"],["2130002","臺北醫學大學","口腔衛生學系",1,61,"","＊英文、生物須達本類組均標。\n本系以培育具口腔健康照護、疾病預防及跨領域合作\n知能之專業人才為宗旨。課程包含基礎醫學、牙科專\n業、臨床輔助、口腔衛生教育、器械與設備操作，以\n及校內外實習；學習過程涉及感染管制、口腔狀況與\n影像判讀、書面表達、以口語或適切輔助方式進行溝\n通、團隊合作，並需與不同年齡及需求之服務對象互\n動。本系 學","宗教學系",1,81,"","本校將英文與資訊等二項基本能力列入畢業條件，相\n關規定請於報名前詳閱學系網頁之「修業規則」及本\n校全人教育課程中心網頁「基本素養培育與檢測」專\n區，網址:\nhttp://www.hec.fju.edu.tw/article.jsp?articleID=93"],["3110010","東吳大學","中國文學系",1,81,"","＊國文須達本類組均標。\n1.本校有外雙溪及城中兩個校區，外雙溪校區位處山\n坡地，需具備移動能力。\n2.法律學系修業5 年，其餘學系均為4 年。\n3.除須於規定年限內修畢學系規定應修科目與學分\n外，尚須通過校系規定之外語能力、資訊能力及美育\n活動畢業標準，方得畢業；如未通過，本校訂有補救\n措施，協助提昇其能力與素質。\n4.為使學生得以充分運用教學與各項生活資源，法商\n學院一年級新生每週規劃部分課程至 外雙溪校區上\n課。\n5.本校學雜費及獎助學金等資訊，請逕上本校德育中\n心網頁查詢。"],["3110011","東吳大學","社會工作學系",2,81,"","1.本校有外雙溪及城中兩個校區，外雙溪校區位處山\n坡地，需具備移動能力。\n2.法律學系修業5 年，其餘學系均為4 年。\n3.除須於規定年限內修畢學系規定應修科目與學分\n外，尚須通過校系規定之外語能力、資訊能力及美育\n活動畢業標準，方得畢業；如未通過，本校訂有補救\n措施，協助提昇其能力與素質。\n4.為使學生得以充分運用教學與各項生活資源，法商\n學院一年級新生每週規劃部分課程至 外雙溪校區上\n課。\n5.本校學雜費及獎助學金等資訊，請逕上本校德育中\n心網頁查詢。"],["3110041","中原大學","工業與系統工程學系管理組",2,82,"","＊英文、數學B 須達本類組後標。\n1.學士班入學學生，必須通過本校認定之英文能力鑑\n定考試，始准予畢業，請詳見「中原大學學生英文畢\n業門檻作業細則」。\n2.本系網址:https://ise.cycu.edu.tw/"],["3110042","中原大學","會計學系",1,82,"","＊國文、英文、數學B 須達本類組後標。\n1.學士班入學學生，必須通過本校認定之英文能力鑑\n定考試，始准予畢業，請詳見「中原大學學生英文畢\n業門檻作業細則」。\n2.本系網址:https://ac.cycu.edu.tw/"],["3110012","淡江大學","公共行政暨法律學系",2,82,"",""],["3110054","淡江大學","英文學系",1,82,"","本系學生畢業前須通過全民英檢中高級(初試)相對等\n級(含)以上，未通過於大四修習「高級英文」二學分\n之替代課程且成績及格始得畢業。"],["3110022","中國文化大學","資訊管理學系",1,82,"","＊國文、英文須達本類組後標。\n本系相關資訊、修課規定及畢業條件等請參閱本系網\n頁:https://mis.pccu.edu.tw/。"],["3110013","逢甲大學","經濟學系",1,82,"","＊英文、數學B 須達本類組後標。\n本校日間學士班學生在規定修業年限內，修足應修科\n目與學分數(含非本系至少13 學分)，並通過本校及該\n系、學位學程規定之各項考核(畢業條件) 成績合格\n者，始得畢業授予學位。"],["3110014","逢甲大學","中國文學系",1,82,"","＊國文須達本類組後標。\n1.本校日間學士班學生在規定修業年限內，修足應修\n科目與學分數(含非本系至少13 學分)，並通過本校及\n該系、學位學程規定之各項考核(畢業條件) 成績合格\n者，始得畢業授予學位。\n2.本系學生可修讀「文學與文化創意」、「華語教師」、\n「文物管理與鑑識」學分學程，強化學生跨領域學習\n及實務運用能力。"],["3110061","長庚大學","數位金融科技學系",1,82,"","＊國文、英文、數學B 須達本類組均標。\n1.本系旨在為普惠金融，提供社會大眾平等、永續的\n金融服務為使命，培養兼具數位資訊與金融專長之跨\n領域專業人才。\n2.為落實理論與實務相結合，提供資訊科技、財務金\n融及數量方法的整合課程訓練，以迎合數位金融相關\n產業發展的新契機。\n3.本校設有資源教室，關懷與服務身心障礙學生，可\n提供學生課業及生活等方面諮詢服務。\n4.本校學士班學生需通過「英文畢業門檻」及「深耕\n學園」課程，始具畢業資格，相關規定請參考本校語\n文中心及學務處網頁公告。"],["3110059","義守大學","資訊管理學系",1,83,"","1.本系旨在培育人工智慧、行動商務、大數據與智慧\n物聯網產業亟需之 績須達本類組均標。\n1.本校學士班學生應符合本校學則第52 條規定始得畢業。\n2.本系提供多元化的模組課程(實用英外語專業組、文學專\n業組、英語教學專業組)，以及跨領域學分學程，培育國際\n專業人才和優秀的英語教師。\n3.本系學生畢業前須通過等同CEFR B2(含聽說讀寫)之英語\n能力檢定為畢業門檻。\n4.本系為師培與非師培並行學系，學生欲修習各類科師資培\n育課程須經甄選通過。\n5.本系學生須通過本校規定之華語文能力畢業標準方得畢\n業；如未通過者，可依補救措施，提升其能力以符標準。"],["4110138","國立臺中教育大學","音樂學系",1,91,"","＊須通過西樂類術科考試。\n＊國文、英文須達本類組均標。\n1.本校學士班學生應符合本校學則第52 條規定始得畢業。\n2.本系入學後主修限定類別:應用音樂創作、鋼琴、聲樂、\n弦樂(限提琴類)、銅管樂(限法國號、小號、長號、低音\n號、上低音號)、木管樂(限長笛、雙簧管、單簧管、薩克斯\n管、低音管、木笛)、擊樂、理論作曲。\n3.本學系課程設計是以培養專業演奏、創作人才以及音樂教\n育師資為主，課程學習著重於各類型獨/合奏(室內樂、樂\n團)及音樂教學等能力訓練，有大量讀譜、獨/合奏(唱)、室\n內樂等課程，需具良好之視覺、聽覺與基本團隊合作與人際\n互動溝通協調等能力。\n4.本系為師培與非師培並行學系，學生欲修習各類科師資培\n育課程須經甄選通過。\n5.本校學生須通過各學系規定之語文能力畢業標準方得畢\n業；如未通過者，可依補救措施，提升其能力以符標準。"],["4110087","國立金門大學","建築學系",1,92,"","＊總成績須達本類組均標。"],["4110088","國立金門大學","國際暨大陸事務學系",1,92,"","＊總成績須達本類組均標。"],["4110125","國立金門大學","工業工程與管理學系",1,92,"","＊總成績須達本類組均標。"],["4110050","國立臺灣體育運動大學","運動資訊與傳播學系",3,92,"","＊國文、英文、數學B 須達本類組後標。\n1.本系為培育運動資訊傳播專業人才，需具備口語表達、溝\n通能力，轉播工作需久站、運用肢體操作攝影機等設備。\n2.具人際互動溝通協調能力、能控管自身情緒、具相當之抗\n壓能力。\n3.體育術科:本校訂有校訂必修游泳課程，院訂必修田徑課\n程各1 學分課程，另訂系選修術科5 學分。"],["4110002","國立屏東大學","中國語文學系",2,92,"","＊總成績須達本類組均標。\n錄取者為非師資培育生，欲修讀教育學程者，可依規定提出\n申請參加遴選，通過者得修習教育學程(含國小、特教、幼\n教等類科)，相關資訊請參閱:https://cte.nptu.edu.tw。"],["4110030","國立屏東大學","應用英語學系",1,92,"",""],["4110012","輔仁大學","英國語文學系",1,92,"","＊英文須達本類組前標。\n＊國文須達本類組均標。\n1.本系全英語教學，所有課程以英語講授，上課方式多元，\n課堂除教師講授外，同學須參與及小組討論，進行口頭報告\n及論文撰寫。進階專業學分選修彈性大，學生可就「文學與\n文化」、「語言研究」、「專業訓練」三類進階課程範疇自由選\n課，接受紮實的博雅訓練，同時鼓勵學生發展第二專長。通\n過等同CEFR B2 級(高階級)之英語檢定考試及學習成果展現\n始得畢業。\n2.本校將英文與資訊等二項基本能力列入畢業條件，相關規\n定請於報名前詳閱學系網頁之「修業規則」及本校全人教育\n課程中心網頁「基本素養培育與檢測」專區，網\n址:http://www.hec.fju.edu.tw/article.jsp?articleID=93"],["4110116","輔仁大學","宗教學系",1,92,"","本校將英文與資訊等二項基本能力列入畢業條件，相關規定\n請於報名前詳閱學系網頁之「修業規則」及本校全人教育課\n程中心網頁「基本素養培育與檢測」專區，網\n址:http://www.hec.fju.edu.tw/article.jsp?articleID=93"],["4110018","淡江大學","公共行政暨法律學系",2,92,"",""],["4110020","淡江大學","統計與資料科學學系",2,92,"","＊數學B 須達本類組底標。"],["4110032","淡江大學","中國文學學系",2,92,"",""],["4110024","淡江大學","財務金融學系",1,92,"","＊英文、數學B 須達本類組後標。\n本系採行多元教學方式，培養學生獨立思考和解決問題之分\n析能力，並提供企業實習課程，提高理論實務應用能力。"],["4110103","淡江大學","運輸管理學系",3,92,"","＊總成績須達本類組均標。"],["4110102","淡江大學","英文學系",1,93,"","本系學生畢業前須通過全民英檢中高級(初試)相對等級(含)\n以上，未通過於大四修習「高級英文」二學分之替代課程且\n成績及格始得畢業。"],["4110139","淡江大學","經濟學系",1,93,"","＊英文、數學B 須達本類組後標。\n本系有系統的經濟邏輯訓練，培養分析問題的能力，奠定日\n後就業或深造的基礎。\n特色課程有1.「財經法律學分學程」，提升法律素養。2.海\n外專業知能服務學習課程，拓展國際視野。3.昆士蘭大學碩\n士雙聯學位，多元深造管道。4.企業實習課程，提供學生職\n場賦能。"],["4110042","中國文化大學","家庭科學系",1,93,"","＊國文、歷史、總成績須達本類組底標。\n本系相關資訊、修課規定及畢業條件等請參閱本系網\n頁:https://crfals.pccu.edu.tw/。"],["4110044","中國文化大學","會計學系",1,93,"","本系相關資訊、修課規定及畢業條件等請參閱本系網\n頁:https://crbbac.pccu.edu.tw。"],["4110045","中國文化大學","資訊管理學系",1,93,"","＊國文、英文須達本類組後標。\n本系相關資訊、修課規定及畢業條件等請參閱本系網\n頁:https://mis.pccu.edu.tw/。"],["4110115","中國文化大學","日本語文學系",1,93,"","＊國文須達本類組底標。\n本系相關資訊、修課規定及畢業條件等請參閱本系網\n頁:https://japanese.pccu.edu.tw/"],["4110133","中國文化大學","教育與學習科技學系",2,93,"","＊國文須達本類組後標。\n＊英文須達本類組底標。\n1. 本校座落於陽明山，景觀優美，可俯瞰臺北市景色。學\n校設有資源教室，提供身心障礙學生課業學習、校園生活、\n輔導與諮詢等全方位支持服務，協助學生適應大學的生活與\n學習。本系主要上課地點位於綜合體育館，教學空間寬敞，\n館內設有電梯等無障礙設施，提供舒適且便利的學習與移動\n環境。\n2. 本系為師培與非師培並行學系，兼具師資培育與教育科\n技跨域特色，學生可依規定參加師資生甄選，通過後修習教\n育專業課程擔任教師。除教師職涯外，亦可朝教育科技、數\n位學習、人力資源、教育訓練、補教產業(非正規師資)及教\n育行政等多元方向發展，培養兼具教育專業與科技應用能力\n的未來跨域人才。\n3. 本系重視「做中學」與實務創新，學生畢業前須完成科\n技輔具設計、教育科技應用及創新教學方案等成果之畢業專\n題。透過從需求發掘、問題分析到設計製作與成果展示的完\n整歷程，培養學生應用科技、跨域整合與問題解決能力，強\n化未來升學與職涯發展的競爭力。"],["4110017","逢甲大學","會計學系",1,93,"","本校日間學士班學生在規定修業年限內，修足應修科目與學\n分數(含非本系至少13 學分)，並通過本校及該系、學位學\n程規定之各項考核(畢業條件) 成績合格者，始得畢業授予\n學位。"],["4110019","逢甲大學","財稅學系",1,93,"",""],["4110023","逢甲大學","統計學系",2,93,"",""],["4110034","靜宜大學","財務工程學系",2,94,"","＊數學B 須達本類組後標。\n為更詳盡認識及選擇學系，請務必上網查詢課程與簡介\n(https://fe.pu.edu.tw/)。"],["4110035","靜宜大學","資訊管理學系",2,94,"","＊英文、數學B 須達本類組後標。\n為更詳盡認識及選擇學系，請務必上網查詢課程與簡介\n(https://csim.pu.edu.tw/)。"],["4110036","靜宜大學","資訊工程學系",1,94,"","＊英文、數學B 須達本類組後標。\n為更詳盡認識及選擇學系，請務必上網查詢課程與簡介\n(https://csie.pu.edu.tw/)。"],["4110037","靜宜大學","財務金融學系",1,94,"","＊英文、數學B 須達本類組均標。\n1.本系課程著重數理演算及邏輯思考能力，學習內容包含統\n計圖表、圖形，請具備圖表閱讀等相關能力。\n2.為更詳盡認識及選擇學系，請務必上網查詢課程與簡介\n(https://fin.pu.edu.tw/)。"],["4110043","靜宜大學","英文暨全球事務學系",1,94,"","＊英文須達本類組後標。\n為更詳盡認識及選擇學系，請務必上網查詢課程與簡介\n(https://english.pu.edu.tw/)。"],["4110068","靜宜大學","資料科學暨大數據分析與應用學系",1,94,"","＊數學B 須達本類組後標。\n1.本系發展主軸為人工智慧與資料科學(大數據)。\n2.為更詳盡認識及選擇學系，請務必上網查詢課程與簡介\n(https://ds.pu.edu.tw/)。"],["4110059","元智大學","資訊傳播學系(智慧科技應用組)",1,94,"","＊國文、英文、數學B 須達本類組後標。\n本系是全國第一個結合感知設計、傳播媒體、資訊科技三位\n一體的整合性學系，以專業必選修課程、專業實習及專題製\n作培養學生專業能力。\n資訊傳播學系智慧科技應用組的目標為培養互動媒體應用、\n人工智慧應用、電腦遊戲、數位學習輔助系統、數位科技藝\n術、虛實整合技術的專業人才。選才方向著重具備資訊科技\n相關基礎，或是對於互動科技有興趣的學生。歡迎對資訊科\n技與多媒體技術有興趣的同學申請。"],["4110060","元智大學","資訊傳播學系(數位媒體設計組)",1,94,"","＊國文、英文、數學B 須達本類組後標。\n本系是全國第一個結合感知設計、傳播媒體、資訊科技三位\n一體的整合性學系，以專業必選修課程、專業實習及專題製\n作培養學生專業能力。\n資訊傳播學系數位媒體設計組的目標為培養多媒體設計人\n才。選才方向著重具備藝術領域相關基礎，或是對於電腦繪\n圖、影視動畫、數位遊戲、互動設計、虛實整合內容等創作\n有興趣的學生。歡迎對繪畫創作與多媒體設計有興趣的同學\n申請。"],["4110067","元智大學","中國語文學系",1,94,"","＊國文須達本類組後標。\n本系在華文文學與文化的基礎上，融合古典與現代，提升口\n語表達、文字創作及AI 數位應用能力，因應產業趨勢，培\n育學生建立跨界視野和格局，歡迎同學踴躍報名。"],["4110140","華梵大學","智慧生活設計學系空間設計組",1,95,"","＊國文須達本類組底標。\n培養具設計創意及空間設計專業能力之跨領域人才。"],["4110141","華梵大學","智慧生活設計學系創意產品與汽車設計組",1,95,"","＊國文須達本類組底標。\n1.以創意設計為核心，培養工藝美術與工業產品設計之實務\n人才；設有木工、金工、陶藝、汽車工坊及3D 列印等完善\n設備。\n2.推動自主學習計畫，支持學生依個人志趣規劃主題式課\n程，深入進行跨領域專研，全面激發個人創作潛能與個人特\n色。\n3.提供豐富海外交流機會與獎學金，合作學校涵蓋美、英、\n日、西等國，積極鼓勵學生赴外學習以拓展宏觀的國際視\n野。\n4.畢業職涯發展多元，可進入設計公司、個人工作室，或從\n事文化產品開發、品牌設計與文化資產維護等跨領域專業領\n域。"],["4110142","華梵大學","攝影與 VR設計學系攝影與科技藝術組",1,95,"","＊國文須達本類組底標。\n1.以攝影與動態影像為核心，結合傳播、藝術與商業應用，\n涵蓋前後期製作及新媒體，培育影像、廣告與策展等專業人\n才。\n2.推動多元自主學習計畫，支持學生依個人志趣規劃學習藍\n圖，進行跨領域深度探索，全面精進個人獨特的創作實力。\n3.設有國際交流獎學金，並於每學期定期辦理海外遊學活\n動，積極協助學生跨國學習，拓展宏觀且前沿的國際視野。\n4.合作機構遍及全球名校，包含加拿大溫哥華電影學院、韓\n國建國大學、美國莫瑞州立大學及日本札幌市立大學等校。"],["4110143","華梵大學","攝影與 VR設計學系 VR與互動媒體組",1,95,"","＊國文須達本類組底標。\n1.以虛擬影像為核心，涵蓋AR、VR、XR、互動藝術、3D 建\n模與遊戲設計；掌握遊戲引擎與工具，養成跨域整合力。\n2.畢業可投入數位敘事、遊戲設計、動畫特效、AR/VR/XR 開\n發與體驗設計等領域；並提供多元自主學習計畫進行深度探\n索。\n3.設有國際交流獎學金，並於每學期定期辦理海外遊學活\n動，積極協助學生跨國學習，拓展宏觀且前沿的國際視野。\n4.合作機構遍及全球名校，包含加拿大溫哥華電影學院、韓\n國建國大學、美國莫瑞州立大學及日本札幌市立大學等校。"],["4110144","華梵大學","美術與文創學系文創設計組",1,95,"","＊國文須達本類組底標。\n本系期望培養設計專業能力，透過設計基礎、攝影、專業設\n計軟體、色彩學、藝術史、時尚發展分析，培養具有創意之\n設計人才。課程涵括藝術、設計、行銷三種跨域知能，同時\n透過造型、數位技術的學習，培育創意設計與企劃人才。參\n與展演計劃與執行，透過實習、策展、研究、產學合作，培\n養具有當代文化素養之文創人才。"],["4110145","華梵大學","美術與文創學系美術創作組",1,96,"","＊國文須達本類組底標。\n透過素描、油畫、彩墨、書法、版畫、雕塑及複合媒材等核\n心課程，強化美術表現力；並結合藝術理論、藝術史訓練與\n數位媒材，激發獨特創作語彙。藉由展演實務與專題評述，\n培養學生對當代藝術的觀察與思辨力，培育具備創作、策展\n與藝術行政能力的專業人才。"],["4110078","義守大學","企業管理學系",1,96,"","1.本系在培養有競爭力之專業經理人與創業家，並聚焦於創\n意廣告與行銷物流、組織領導與人力資源，以及企業診斷與\n創業管理，三個特色管理學程。\n2.課程採用多元教學模式，結合AI 科技、個案研討、專題\n競賽、實務實作與企業實習等，擺脫傳統聽講課程設計，並\n通過AACSB 國際商管認證，教學品質獲世界級肯定。\n3.系友遍及各行各業，如創業家、廣告行銷、人力資源、工\n業管理、公職、金融從業人員等。\n4.本系聯絡電話:07-6577711 轉5902，網\n址:ba.isu.edu.tw。"],["4110082","義守大學","資訊管理學系",1,96,"","1.本系旨在培育人工智慧、行動商務、大數據與智慧物聯網\n產業亟需之專業人才，課程中融入AI 輔助教學，輔導同學\n考取多張國際級專業證照，並與多家資訊公司合作，提供實\n習與就業機會，以期達成「畢業即就業」之目標。\n2.本系聯絡電話:07-6577711 轉6552，網址:\nmis.isu.edu.tw。"],["4110084","義守大學","會計學系",1,96,"","1.本系教育目標在於透過智慧科技、創新教學及跨域整合，\n培育學生具備管理涵養及國際視野之會計專業斜槓人才。\n2.本系2021 年再次通過全球商管教育AACSB 國際認證，與\n實務並重，除會計、稅務、財金與管理等相關專業知識傳授\n外，另設有主題式課群，包含創業實務、永續管理、數位金\n融、智能審計等前瞻知識，並積極輔導學生國家考試及取得\n專業證照，使學生具備全人素養與核心跨域專業。\n3.本系重視學用合一，為有效提升職涯發展能力，四年級下\n學期全學期與國際結盟大型會計師事務所等合作辦理實習，\n學生可獲留用之機會。\n4.本系聯絡電話:07-6577711 轉5402，網\n址:acc.isu.edu.tw。"],["4110085","義守大學","國際企業經營英語學士學位學程",1,96,"","全英語商業學程，開啟全球視野!本學程獲AACSB 國際認\n證，全英語授課，培養國際商管專業與AI 應用能力。最快4\n年取得國際雙學位(學士+碩士)，大三起可海外交換或國際\n實習，並享20 萬元獎學金。英語成績優異者最高可獲四年\n住宿費減免及海外學習基金，接軌全球職場。聯絡電話:07-\n6577711 轉8702，網址:iciba.isu.edu.tw。"],["4110124","世新大學","行政管理學系",1,96,"","本校學生除須於修業年限內修畢所屬學系(組)規定之應修學\n分外，尚須依規定通過「英語能力」、「中文能力」、「資訊能\n力」、「思辨表達能力」、「自我管理能力」等基本能力課程及\n學系畢業門檻，方可畢業。"],["4110113","銘傳大學","應用中文與華語文教學系（桃園校區）",1,97,"","＊國文須達本類組底標。\n1.本系在桃園校區上課。\n2.歡迎對國文教學、華語教學、語文創作、文教傳播有興趣\n的同學就讀。"],["4110052","銘傳大學","新媒體暨傳播管理學系（台北校區）",1,97,"","＊國文、英文須達本類組底標。\n1.本系培育新媒體暨傳播管理理論與實務兼備人才，甄選有\n志從事數位內容產製、網路媒體、自媒體社群行銷、新媒體\n管理、新聞、廣播、電視、廣告、公關等工作及傳播研究之\n學子。\n2.本系上課需操作電腦等儀器設備，如專業攝影機、收音設\n備。\n3.本系在台北校區上課。\n4.學生在校期間需通過「英語能力」、「資訊能力」、「中文能\n力」、「運動能力」及「專業基本能力」檢定，始得畢業。未\n通過各項能力檢定者，應參加由各教學單位提出之補救教學\n相關課程，修習合格後，始得畢業。"],["4110094","銘傳大學","應用英語學系（桃園校區）",1,97,"","＊英文須達本類組底標。\n1.本系培養具備商務、教育、口筆譯、觀光知能的英語文專\n業人才。\n2.課程設計著重英語文書寫、溝通及協商能力，系專業課程\n以英語授課。\n3.可申請海外交換生學程、雙學位學程，及至英、美、澳、\n日短期交流 (每年名額至少 40 名 )。\n4.本系設有碩士班及五年一貫的學士碩士學程。\n5.本系位於本校桃園校區。系網址https://dae.mcu.edu.tw/\n6.學生在校期間需通過英語能力、資訊能力、中文能力、運\n動能力及專業基本能力檢定，始得畢業。未通過各項能力檢\n定者，應參加由各教學單位提出之補救教學相關課程，修習\n合格後，始得畢業。"],["4110090","實踐大學","資訊科技與通訊學系（高雄校區）",2,97,"","＊國文須達本類組底標。\n1.專業學習重點有「App 設計」、「人工智慧應用設計」和\n「智慧機器人與無人機」。\n2.通過國際工程教育學會IEET 認證，畢業生受美加紐澳英\n等多國認可。\n3.提供國內外產業實習機會，大三暑假職場體驗，大四全年\n帶薪實習。\n4.在學成績前25%，推薦進入國立知名資訊相關研究所。\n5.校友就業調查，本系畢業生平均每月薪資40K 以上。"],["4110091","實踐大學","應用日文學系（高雄校區）",1,97,"","＊歷史須達本類組底標。\n1.本系課程首重加強日語聽說讀寫譯之應用能力，畢業門檻\n為日本語能力檢定N1。培養學生國際文化素養與國際溝通表\n達能力，強化日本工商業相關之專業知識。\n2.畢業後在日就業制度。\n3.帶薪赴日兩個月至一年的實習制度。\n4.互換學分的留學制度。\n5.本系具備引導學生考取日本語能力檢定N3-N1 輔助課程，\n也免費開設N1-N3 日語能力檢定課後加強班。\n6.系網:http://jp.kh.usc.edu.tw/。"],["4110092","實踐大學","電腦動畫學士學位學程（高雄校區）",1,98,"","＊國文須達本類組底標。\n1.學生除須於修業年限內修畢所屬學程組應修學分外，畢業\n門檻必須達到學校規定。\n2.本學程特色:\n(1)各類型(2D、3D、多媒材)動畫企劃創作至製作完成輸出\n影片，完整的專業訓練。\n(2)導入動畫相關各項產學專案，讓學生在學期間實際接觸\n產業技術需求和訓練，引導媒合到業界實習或專案實習，達\n到畢業即就業的目標。\n(3)專業課程全由來自產業界具有實務經驗的專業師資授\n課。\n3.本學程網址:https://bpca.kh.usc.edu.tw/app/home.php。"],["4110097","實踐大學","應用外語學系（臺北校區）",2,98,"","＊英文須達本類組後標。\n1.本校諮商中心設有資源教室及輔導老師，提供課業及生活\n諮詢輔導之協助。\n2.本學系課程多為分組討論及上台報告等方式，學生宜具備\n自我管理及情緒調適能力。"],["4110098","實踐大學","資訊科技與管理學系（臺北校區）",2,98,"","＊英文、數學B 須達本類組後標。\n1.本校諮商中心設有資源教室及輔導老師，提供課業及生活\n諮詢輔導之協助。\n2.本學系課程多需使用電腦撰寫程式，請自行評估操作設備\n之可行性。"],["4110123","真理大學","音樂應用學系",5,98,"","音樂應用學系提供四個模組給熱愛音樂的你加入，包含演奏\n演唱、流行音樂、藝術行政與音樂療育。組別靈活應用，可\n依興趣申請轉組，增加同學對音樂的更多理解。詳細介紹請\n參考本系網站:https://music.au.edu.tw 或洽(02)26212121\n轉1788 或5366。"],["4110126","真理大學","宗教文化與資訊管理學系",6,98,"","＊國文、歷史須達本類組底標。\n1.本系歡迎對宗教文化、資訊管理、生命關懷、文創藝術、\n組織經營及社會實務有興趣的學生就讀。\n2.學生可於入學前洽詢本系或資源教室，了解課程、學習場\n域、課業輔導與評量調整等支持措施，以共同規劃適切的學\n習方式。\n3.本系系網https://religion.au.edu.tw/、本系電話\n(02)26292355\n4.本校資源教室電話 (02)2622-2038"],["4110127","真理大學","應用日語學系",9,98,"","＊國文、英文須達本類組底標。\n1.聽、說、讀、寫、譯是學習外語的基本能力，也是本系培\n養學生的核心。透過扎實的語言能力訓練，進一步結合日本\n經貿、觀光、教育等跨域專業知識，培養學生多元能力，提\n升畢業後的就業競爭力。\n2.本系相關資訊請參照本系系網，本系網址:\nhttps://japanese.au.edu.tw/"],["4110128","真理大學","企業管理學系",5,99,"","＊國文須達本類組底標。\n1.本系相關資訊請參閱系網頁 ( https://ba.au.edu.tw/ )\n2.本系之教育目標在於培育企業經營管理之實務專業人才；\n要求學生要能有人際溝通與團隊合作技能，可以獨立思考與\n創新能力，課程內容涵蓋課堂討論、報告撰寫與實作。"],["4110129","真理大學","資訊工程學系",5,99,"","本系重視學生的學習需求，提供適切的學習支持與專業輔\n導，陪伴學生發揮專長、建立自信!老師具有濃厚教學熱\n忱，透過適切的教材教法與悉心引導，培養學生程式設計、\n人工智慧及資訊系統實作能力。學生可在實驗室教師指導\n下，參與實務研發與專題研究，培養專業能力，並參加定期\n舉辦的「偕睿理杯」程式設計與專題競賽，累積實作與研究\n經驗。同時結合本系提供的職涯規劃與實習輔導，參與企業\n實習，將所學應用於職場，找到適合自己的發展方向，銜接\n未來升學與就業，發揮資訊科技專長，創造屬於自己的精彩\n未來!"],["4110130","真理大學","法律學系",10,99,"","＊國文須達本類組底標。\n1.對於法律有興趣，並具有維護公平正義、扶助社會上受害\n人與弱勢者之心志者。\n2.本系系網:https://law.au.edu.tw/。\n3.連絡電話:02-26212121 轉1797、4322。\n4.系主任信箱:au4322@mail.au.edu.tw。"],["4110131","真理大學","財務金融學系",12,99,"","1.本系定位在培育基層金融人才，使學生畢業時能具備金融\n倫理道德素養及金融知識。\n2.相關資訊請參閱財務金融學系網頁:fb.au.edu.tw"],["4110132","真理大學","國際經營與貿易學系",6,99,"","1.本系以培育具有健全人格特質、人文關懷素養、宏遠國際\n觀、英日外語溝通能力、國際經營與經貿等專業人才。\n2.相關資訊請參閱學系網頁: https://itrade.au.edu.tw/"],["4110114","慈濟大學","兒童發展與家庭教育學系",1,99,"",""],["4110136","長榮大學","會計資訊學系",1,99,"","1.本校設有資源教室，提供諮詢服務與輔導關懷，使學生在\n大學求學階段皆可獲得完善的個別化支持服務。\n2.本系培育學用合一、術德兼備之會計專業人才，並著重證\n照考試相關課程，增進就業能力。畢業生可參加會計師、記\n帳士或公職考試、進入會計師事務所、記帳士事務所、一般\n企業、政府機關或非營利組織機構服務。\n3.本系畢業生在各行各業均深受肯定，並有多位傑出會計師\n系友與記帳士系友。歡迎對會計及電腦有興趣的同學報考。\n4.本系聯絡電話:06-2785123 轉2201 (週一至週五8:10 至\n17:10)。"],["4110135","長榮大學","國際企業學系",1,99,"","本校設有資源教室，關懷並提供學生課業及生活諮詢服務。"],["4110137","長榮大學","大眾傳播學系",3,100,"","1.本校設有資源教室，關懷並提供學生課業及生活諮詢服\n務。\n2.學系特色:本系是南台灣第一所大眾傳播學系，致力培養\n多元傳播技能與AI 應用的專業人才。課程涵括影音、廣\n告、行銷、社群、新聞、播客、AI 創作等傳播領域。\n3.學系介紹:(1).本系豐富多元的領域，鼓舞每一位學生展\n現自我特長，贏得最佳化發展。(2).本系師資榮獲國際56\n座大獎，指導學生鼎級的拍片技能，應用在職場無往不\n利!(3). 培育學生具備AI 實力創造優勢。(4). 本系著重\n「學用合一」關懷學生實務學習，提供媒體實習機會。期待\n每一位學生都能創造屬於自己精彩的學習成果!連絡電\n話:06-2785123 轉4101，網\n址:https://dweb.cjcu.edu.tw/gimc。"],["4110007","玄奘大學","應用心理學系",3,100,"","＊國文須達本類組底標。\n1.本系學習內容包含基礎心理學、助人心理學、工商心理學\n與犯罪心理學。凡是對人感興趣者，適合報考本系。同時，\n鼓勵同學跨域學習，培養多元技能。\n2.本校學務處學生輔導暨職涯發展中心設有資源教室，提供\n學生校園生活關懷、課業輔導及生職涯諮詢等服務。特殊教\n育學生應主動提出該障礙類別輔具及特殊教育需求。"],["4110008","玄奘大學","藝術與創意設計學系",2,100,"","＊須通過美術類術科考試。\n＊國文須達本類組底標。\n1.本系為藝術創作與文創設計學生分為平面組及立體組的課\n程教授與運用，課程著重於術科的培養，均須具備良好的色\n彩辨識能力。\n2.必須具備基本的語言表達及書寫能力。\n3.本校學務處學生輔導暨職涯發展中心設有資源教室，提供\n學生校園生活關懷、課業輔導及生職涯諮詢等服務。特殊教\n育學生應主動提出該障礙類別輔具及特殊教育需求。"],["4110062","亞洲大學","人工智慧學系",2,100,"","＊總成績須達本類組均標。\n1.本校設有資源教室，關懷並提供學生課業及生活諮詢服\n務。\n2.本系教師教學重溝通理解及表達能力、分組討論，課程著\n重實務及實習教學，並有專題製作、報告作業。\n3.具備電腦操作能力者。"],["4110021","開南大學","應用日語學系",1,100,"","＊國文須達本類組底標。\n聽、說、讀、寫各項技能為學習外語之必要之基本能力，為\n本系培養重點。"],["4110049","開南大學","休閒與運動管理學系",2,100,"","＊歷史、地理須達本類組底標。\n本系培養休閒服務管理人才，課程重點包括培養現場\n休閒活動指導人員，可能會有接觸人群機會，需具人際互動\n溝通能力，能控管自身情緒。"],["4110022","開南大學","應用英語學系",1,100,"","＊英文須達本類組底標。\n聽、說及口語表達為學習外語之基本能力。"],["4110146","開南大學","資訊管理學系",2,100,"","＊國文須達本類組底標。\n本系教師教學重溝通理解，學生須具備表達能力及電腦操作\n能力。"],["4110006","佛光大學","語文學系",1,101,"","1.本校位處山坡地，建議選填志願前可至校園了解環境。\n2.本系有規劃聽力、閱讀、寫作以及口語表達能力之課程，\n可提升學生自主學習能力。"],["4110009","佛光大學","運動與健康促進管理學士學位學程",2,101,"","1.本校位處山坡地，建議選填志願前可至校園了解環境。\n2.本系須取得專業證照兩張以上。\n3.需至業界實習滿250 小時。"],["4110010","佛光大學","健康與創意蔬食產業學系",1,101,"","1.本校位處山坡地，建議選填志願前可至校園了解環境。\n2.本系各專業課程重視學生之廚藝實作能力、專業活用人際\n溝通，部分課程在課堂上須上台報告，並有校內外實習課\n程。\n3.本系在學期間須取得兩張丙級或一張乙級餐飲相關證照。"],["4110095","佛光大學","歷史學系",5,101,"","1.本校位於山丘之巔，俯瞰蘭陽平原，風景美、氣氛佳，是\n學習及思考人生哲學不可多得的好環境!\n2.本系重視閱讀、溝通理解及表達能力，課程著重討論及報\n告。"],["4110099","佛光大學","資訊應用學系",1,101,"","1.本校位處山坡地，建議選填志願前可至校園了解環境。\n2.本系需完成「專題實作」課程，始得畢業。"],["4110104","佛光大學","人工智慧技術與應用學士學位學程",1,101,"",""],["4110100","佛光大學","建築環境設計學士學位學程",1,101,"","本校位處山坡地，建議選填志願前可至校園了解環境。"],["4110101","佛光大學","公共行政與國際事務學系",1,101,"","本校位處山坡地，建議選填志願前可至校園了解環境。"],["4110121","佛光大學","傳播學系",3,101,"","1.本校校區位於山坡地，建議選填志願前可至校園了解環\n境。\n2.本系課程重視思考、溝通及表達，並著重分組討論、口頭\n與書面報告，另實作課程需製作影片、廣播、音樂等，且多\n為小組作業，需有良好之人際互動。\n3.大四時必須完成「畢業製作」課程之畢業門檻，始得畢\n業。"],["4110119","中信金融管理學院","企業管理學系",2,101,"","＊國文須達本類組均標。"],["4120026","國立政治大學","應用數學系",1,101,"","＊英文、數學A 須達本類組頂標。\n為培養學生發展對嚴謹的分析及寫作能力，本系課程\n內容涵蓋數學基礎理論與證明。"],["4120047","國立政治大學","統計學系",1,101,"","＊總成績須達本類組頂標。"],["4120040","國立清華大學","科技管理學院學士班",1,102,"","＊國文、英文、數學A 須達本類組頂標。"],["4120041","國立清華大學","動力機械工程學系",1,102,"","＊英文、數學A、物理須達本類組頂標。"],["4120042","國立清華大學","理學院學士班",1,102,"","＊英文、數學A、物理須達本類組頂標。\n操作實驗為本系學習重點，學生均透過親自操作儀器\n奠定化學基礎專業知識與實驗技能，部分實驗需透 學","資訊工程學系",2,108,"","1.本系以培養符合產業需求的資訊專業人才，課程設\n計分為四個主要方向:(一)人工智慧與多媒體系統，\n(二)網路通訊與物聯網系統，(三)嵌入式系統，(四)\n資訊安全。提供完整軟硬體課程，使學生具備跨領域\n及自學的專業能力。學生畢業後可進入人工智慧、大\n數據、物聯網、邊緣運算、雲端服務、區塊鏈、資訊\n安全、擴增/虛擬/混合實境、手機App 程式設計、嵌\n入式系統、資訊電子、智慧醫療、智慧製造、智慧金\n融、半導體產業與其他智慧科技相關技術與應用產業\n就業並發展。\n2.本系聯絡電話:07-6577711 轉6502，網\n址:csie.isu.edu.tw。"],["4120070","實踐大學","電腦動畫學士學位學程（高雄校區）",1,108,"","＊國文須達本類組底標。\n1.學生除須於修業年限內修畢所屬學程組應修學分\n外，畢業門檻必須達到學校規定。\n2.本學程特色:\n(1)各類型(2D、3D、多媒材)動畫企劃創作至製作完成\n輸出影片，完整的專業訓練。\n(2)導入動畫相關各項產學專案，讓學生在學期間實際\n接觸產業技術需求和訓練，引導媒合到業界實習或專\n案實習，達到畢業即就業的目標。\n(3)專業課程全由來自產業界具有實務經驗的專業師資\n授課。\n3.本學程網址:\nhttps://bpca.kh.usc.edu.tw/app/home.php。"],["4120071","實踐大學","數位多媒體遊戲設計學系（高雄校區）",2,109,"","＊國文須達本類組底標。\n1.培養學生成為多媒體遊戲設計人才。\n2.培養學生成為高階次世代遊戲設計人才。\n3.辦理就業學程，聘請知名業師與產業接軌。\n4.聘請國際名師開設工作坊，開拓國際移動力。\n5.畢業生深受企業歡迎，從事遊戲設計、3D 建模等次\n世代遊戲美術產業。\n6.本系與多家遊戲大廠簽定實習合約，提供暑期實習\n及全學年實習，畢業後優先錄用。"],["4120003","高雄醫學大學","醫務管理暨醫療資訊學系",1,109,"","＊國文、英文、數學A 須達本類組底標。\n1.本學系為醫藥衛生相關學系，課程或實習具實務操\n作及與人直接互動的特性，學生必備相當之視覺、聽\n覺、辨色力、行動、口語溝通及情緒管理能力，以因\n應日後職場醫療服務或實驗研究所需。\n2.本校宿舍設有無障礙及低床位寢室，對於入住相關\n無障礙需求，建議先來電洽詢本校生活輔導組(電\n話:07-3121101#2823)或資源教室(電話:07-\n3121101#2121)進行評估與討論。\n3.本校設有無障礙設施，實際使用需求建議選填志願\n前可至校園了解環境。"],["4120076","真理大學","資訊工程學系",5,109,"","本系重視學生的學習需求，提供適切的學習支持與專\n業輔導，陪伴學生發揮專長、建立自信!老師具有濃厚\n教學熱忱，透過適切的教材教法與悉心引導，培養學\n生程式設計、人工智慧及資訊系統實作能力。學生可\n在實驗室教師指導下，參與實務研發與專題研究，培\n養專業能力，並參加定期舉辦的「偕睿理杯」程式設\n計與專題競賽，累積實作與研究經驗。同時結合本系\n提供的職涯規劃與實習輔導，參與企業實習，將所學\n應用於職場，找到適合自己的發展方向，銜接未來升\n學與就業，發揮資訊科技專長，創造屬於自己的精彩\n未來!"],["4120077","真理大學","財務金融學系",6,109,"","1.本系定位在培育基層金融人才，使學生畢業時能具\n備金融倫理道德素養及金融知識。\n2.相關資訊請參閱財務金融學系網頁:fb.au.edu.tw"],["4120078","真理大學","國際經營與貿易學系",6,109,"","1.本系以培育具有健全人格特質、人文關懷素養、宏\n遠國際觀、英日外語溝通能力、國際經營與經貿等專\n業人才。\n2.相關資訊請參閱學系網頁:\nhttps://itrade.au.edu.tw/"],["4120001","臺北市立大學","資訊工程學系",1,110,"","＊國文、英文、數學A 須達本類組均標。\n1.學生除須於修業年限內修畢應修學分外，畢業前須\n符合本學系檢定及證照規定、「資訊專題」業師輔導/\n成果展，並繳交1 份「資訊專題報告」等畢業門檻。\n2.本學系課程多需使用電腦撰寫程式、實機操作、邏\n輯推理。\n3.本學系重視學生資訊專業能力與多元發展，課程包\n括目前最熱門的AI(人工智慧)相關課程，提升學生專\n業技能。合於規定，可提早一學年或一學期畢業。培\n養多元專長，承認外系或外校自由選修15 學分，鼓勵\n學生跨領域學習。同時有許多國際交流、移地教學、\n雙聯學制、企業實習等機會。提供學生不同選擇，為\n未來奠下良好基礎。"],["4130006","國立臺灣大學","園藝暨景觀學系",1,110,"","＊英文、數學A、總成績須達本類組頂標。"],["4130011","國立臺灣師範大學","健康促進與衛生教育學系",1,110,"","1.畢業後欲從事教學工作者，應依本校相關規定申請\n修習教育專業課程，並請考量任教因素 :能在教室內\n自由移動、獨立操作教具或評量工具能力及具備有效\n聽、說雙向溝通能力。\n2.有關教師資格之取得及服務之權利與義務，悉依師\n資培育法其相關法令之規定。"],["4130008","國立中興大學","昆蟲學系",1,110,"","＊生物須達本類組前標。\n＊英文須達本類組均標。\n1.本系實驗性質課程含有各式儀器操作(如:普通昆蟲\n學實習、昆蟲生理學實習等)，須具備儀器操作之能\n力。\n2.本系以昆蟲學、生命科學、農業科學及生態學為基\n礎，培育具昆蟲學、生命科學、農學、植物防疫及檢\n疫、病媒與環境衛生昆蟲以及生物多樣性、生態保育\n等學識之科學研究與實務能力之專業高階人才。\n3.本系網址:https://www.entomol.nchu.edu.tw/，聯\n絡電話:04-22840361#524。"],["4130009","國立中山大學","生物科學系",1,111,"","＊生物須達本類組前標。\n＊數學A、化學須達本類組均標。\n1.本系學習內容包含普通生物學(含實驗)、生物化\n學、遺傳學、動植物生理學、分子生物學、生物技術\n實驗等核心相關課程，須具備辨色能力。\n2.本系課程含實驗操作，基於考量實驗操作危險性與\n結果判斷之需要，學生須具備獨立操作能力及個人安\n全維護能力。\n3.入學本校學士班學生畢業前，需依起始分級先修畢\n「語文素養:英語文」領域必修課程，再修習一門學術\n英文EAP 或專業英文ESP 跨院選修課程，並通過本校\n「英語文能力標準認證」，方得畢業。詳細資料請逕至\n西灣學院/更多資訊/規章表單/學生專區/學士班學生\n英語文能力標準認證。\n4.各項說明若有未盡事宜，悉依本校「學則」及必修\n科目表等相關規定辦理。"],["4130010","國立中山大學","海洋生物科技暨資源學系",1,111,"","＊英文、化學、生物須達本類組前標。\n1.本系必修科目以全英語授課，選修課程採中文或全\n英語授課，非全英語授課課程不得抵免本系必修課\n程。\n2.課程重溝通理解及表達能力，部份課程需進行小組\n討論、團隊合作及口頭報告。\n3.實驗為本系學習重點，學生均需雙手操作儀器、久\n站，及具相當之視覺功能以觀測辨識圖像。海上實習\n為必修，需搭乘研究船採集和觀察，具一定危險性，\n需有能力即時移動遠離危險現場及個人安全維護能\n力。\n4.須修畢大一上學期專業必修課程並取得合格成績，\n方可申請轉系。\n5.入學本校學士班學生畢業前，需依起始分級先修畢\n「語文素養:英語文」領域必修課程，再修習一門學術\n英文EAP 或專業英文ESP 跨院選修課程，並通過本校\n「英語文能力標準認證」，方得畢業。詳細資料請逕至\n西灣學院/更多資訊/規章表單/學生專區/學士班學生\n英語文能力標準認證。\n6.各項說明若有未盡事宜，悉依本校「學則」及必修\n科目表等相關規定辦理。"],["4130003","國立彰化師範大學","生物學系",1,111,"","＊英文、生物須達本類組均標。\n1.本系相當重視實驗課程學習，學生均需在實驗室親\n自操作儀器，或到野外實地觀察生物與採集，應具良\n好體能、移動能力，部分實驗須透過色彩判定實驗結\n果，應具相當之視覺辨色能力及口語表達和獨立完成\n實驗的能力。\n2.本校非所有學生皆可修習教育學程，相關規定請參\n閱本校師資培育中心網站。"],["4130004","中國文化大學","森林暨自然保育學系",2,111,"","本系相關資訊、修課規定及畢業條件等請參閱本系網\n頁:https://crffnc.pccu.edu.tw。"],["4130012","長庚大學","生物醫學系",1,112,"","＊英文、化學、生物須達本類組均標。\n1.本系著重生物醫學重要新興領域，強調訓練同學獨\n立進行研究工作的能力，並且開設多項跨領域課程，\n提供許多海外大學研修及生技產業實習機會。\n2.學生在畢業前可自由選擇『生醫研究專業學程』、\n『生技產業專業學程』、『臨床試驗專業學程』、『全英\n生物資訊專業學程』任一學程修習，使同學同時具備\n基礎研究與產業應用兩方面的優勢。\n3.本校設有資源教室，關懷與服務身心障礙學生，可\n提供學生課業及生活等方面諮詢服務。\n4.本校學士班學生需通過「英文畢業門檻」及「深耕\n學園」課程，始具畢業資格，相關規定請參考本校語\n文中心及學務處網頁公告。"],["4130005","銘傳大學","生物醫學工程學系（桃園校區）",1,112,"","1.課程含實驗操作，基於考量實驗操作危險性與結果\n判定之需要，學生須具備獨立操作能力及個人安全維\n護能力。\n2.本系在桃園校區上課。\n3.學生在校期間需通過「英語能力」、「資訊能力」、\n「中文能力」、「運動能力」及「專業基本能力」檢\n定，始得畢業。未通過各項能力檢定者，應參加由各\n教學單位提出之補救教學相關課程，修習合格後，始\n得畢業。"],["4130002","高雄醫學大學","醫務管理暨醫療資訊學系",1,112,"","＊國文、英文、數學A 須達本類組底標。\n1.本學系為醫藥衛生相關學系，課程或實習具實務操\n作及與人直接互動的特性，學生必備相當之視覺、聽\n覺、辨色力、行動、口語溝通及情緒管理能力，以因\n應日後職場醫療服務或實驗研究所需。\n2.本校宿舍設有無障礙及低床位寢室，對於入住相關\n無障礙需求，建議先來電洽詢本校生活輔導組(電\n話:07-3121101#2823)或資源教室(電話:07-\n3121101#2121)進行評估與討論。\n3.本校設有無障礙設施，實際使用需求建議選填志願\n前可至校園了解環境。"],["4130013","高雄醫學大學","公共衛生學系",1,112,"","＊英文、數學A、生物須達本類組均標。\n1.本學系核心專業課程及實習涉及統計數據資料處理\n與圖表判讀、實驗操作、環境化學實驗及環境衛生實\n務、社區衛生教育與職場現場採樣活動、團隊合作及\n溝通表達等多元核心課程。申請公衛系學生皆應具備\n完成上述核心課程與實習之基本學習及操作能力。身\n心障礙學生如有特殊學習需求，申請前需要評估個別\n狀況是否能完成本學習課程核心能力及實習安全需\n求。\n2.本校宿舍設有無障礙及低床位寢室，對於入住相關\n無障礙需求，建議先來電洽詢本校生活輔導組(電\n話:07-3121101#2823)或資源教室(電話:07-\n3121101#2121)進行評估與討論。\n3.本校設有無障礙設施，實際使用需求建議選填志願\n前可至校園了解環境。"],["4140002","國立宜蘭大學","園藝學系",1,113,"","＊化學、生物、總成績須達本類組均標。\n1.本系課程需要田間實務辨識與操作能力，並有專題\n製作。\n2.本系需有閱讀、聽講、溝通理解及表達能力，課程\n會有分組討論及報告。\n3.本系課程重視團隊合作、協調溝通，並需參與業界\n實務實習。"],["4140003","中國文化大學","生命科學系",3,113,"","1.本系必修課程操作實驗為本系學習之重點，學生均\n需透過親自操作儀器奠定基礎專業知識與實驗技能，\n包含生物學實驗及生物化學實驗等，部分實驗需具備\n視覺功能，透過色彩判定實驗觀察結果。\n2.本系相關資訊、修課規定及畢業條件等請參閲本系\n網頁:https://ls.pccu.edu.tw/。"],["4140004","中國文化大學","森林暨自然保育學系",2,113,"","本系相關資訊、修課規定及畢業條件等請參閱本系網\n頁:https://crffnc.pccu.edu.tw。"],["4140005","中國文化大學","土地資源學系",2,113,"","＊國文須達本類組底標。\n本系相關資訊、修課規定及畢業條件等請參閱本系網\n頁:https://lr.pccu.edu.tw/。"],["4140006","高雄醫學大學","公共衛生學系",1,113,"","＊英文、數學A、生物須達本類組均標。\n1.本學系核心專業課程及實習涉及統計數據資料處理\n與圖表判讀、實驗操作、環境化學實驗及環境衛生實\n務、社區衛生教育與職場現場採樣活動、團隊合作及\n溝通表達等多元核心課程。申請公衛系學生皆應具備\n完成上述核心課程與實習之基本學習及操作能力。身\n心障礙學生如有特殊學習需求，申請前需要評估個別\n狀況是否能完成本學習課程核心能力及實習安全需\n求。\n2.本校宿舍設有無障礙及低床位寢室，對於入住相關\n無障礙需求，建議先來電洽詢本校生活輔導組(電\n話:07-3121101#2823)或資源教室(電話:07-\n3121101#2121)進行評估與討論。\n三、本校設有無障礙設施，實際使用需求建議選填志\n願前可至校園了解環境。"],["4201001","國立臺北護理健康大學","醫護教育暨數位學習系",1,113,"共同類","＊國文、英文須達本類組均標。\n1.本系相關資訊請參閱本系網址，\nhttps://ahedl.ntunhs.edu.tw/。\n2.本系課程包含電腦操作能力，並有實務操作\n及專題製作課程。"],["4201002","國立臺北商業大學","應用外語系",1,113,"共同類","＊英文須達本類組前標。\n＊總成績須達本類組均標。"],["4303032","國立屏東科技大學","社會工作系",1,114,"電機與電子群電機類","1.本校訂有學生英文能力畢業門檻，於三年\n級上學期開學前須參加一次具公信力之語言\n測驗機構舉辦之外語能力測驗，仍無法通過\n第二點所列測驗之一者，得於三年級上學期\n起修習本校開設之「外語實務訓練」系列課\n程，或繼續參加外語能力檢定測驗。\n2.各項說明若有未盡事宜，悉依本校「學\n則」 及各系相關規定辦理。"],["4310082","國立屏東科技大學","社會工作系",1,114,"商業與管理群",""],["4311013","國立屏東科技大學","社會工作系",1,114,"衛生與護理類",""],["4315004","國立屏東科技大學","社會工作系",1,114,"家政群幼保類",""],["4302019","國立虎尾科技大學","車輛工程系",2,114,"動力機械群","1.本校設有資源教室，提供身心障礙學生在\n學期間特殊教育輔導與服務措施，協助身心\n障礙學生克服學習問題與困難，並提供學習\n及生活相關諮詢。\n2.於暑假期間開設新生暑期先修班課程(為期\n六週，免學費)，安排入住學校宿舍，讓新生\n提早到校適應新的學習與生活環境。\n3.本校重視學生英語能力的培養，各系組依\n其發展領域均訂有相關規定藉以強化學生將\n來之升學與就業優勢。"],["4303034","國立虎尾科技大學","資訊工程系",1,114,"電機與電子群電機類",""],["4304047","國立虎尾科技大學","資訊工程系",1,114,"電機與電子群資電類",""],["4304054","國立澎湖科技大學","電信工程系",1,114,"電機與電子群資電類","＊國文、專業科目(一)、總成績須達本類組\n均標。"],["4319022","國立澎湖科技大學","應用外語系",8,114,"外語群英語類","＊國文、英文、專業科目(一)須達本類組底\n標。\n聽、說、讀、寫、譯等五項技能為學習外語\n之基本能力，亦為本系培養學生之重點。"],["4310077","國立勤益科技大學","應用英語系",1,114,"商業與管理群","＊英文須達本類組前標。\n＊專業科目(一)、專業科目(二)須達本類組\n均標。\n1.聽、說、讀、寫、譯等五項技能為學習外\n語之基本能力，亦為本系培養學生之重點。\n2.本校設有英文、自主學習及系專業證照之\n畢業門檻，未通過者須加修補救課程。\n3.凡本管道入學新生，本校優先提供工讀機\n會。"],["4308051","國立臺北商業大學","創意科技與產品設計系(桃園校區)",1,114,"設計群","＊專業科目(一)須達本類組前標。\n＊國文、英文須達本類組均標。\n1.需依規定於畢業前通過本系「學生英語能\n力」及「專業能力」畢業門檻，方得畢業。\n2.本系位於桃園校區，可從中壢火車站轉搭\n公車等大眾交通工具方可抵達。\n3.各項說明若有未盡事宜，悉依本校「學\n則」及相關規定辦理。"],["4310052","國立臺北商業大學","國際商務系",1,114,"商業與管理群","＊英文須達本類組前標。\n＊國文須達本類組均標。"],["4319021","國立臺北商業大學","應用外語系",1,115,"外語群英語類","＊英文須達本類組頂標。\n＊專業科目(一)、專業科目(二)須達本類組\n前標。"],["4310062","國立高雄科技大學","國際企業系",1,115,"商業與管理群","＊專業科目(一)、專業科目(二)須達本類組\n前標。\n＊國文須達本類組均標。\n1.本校實施畢業門檻，學生需通過校共同必\n修及通識課程與本系所訂定條件，成績及格\n後方准畢業。相關規定請參閱本校共同教育\n課程實施辦法、語言教學實施要點、共同教\n育課程結構規劃表及本系網站\n(https://itrade.nkust.edu.tw/)查詢。\n2.聽、說、讀、寫等技能為學習之基本能\n力，亦為本系培養學生之重點。\n3.本系教師教學重溝通理解及表達能力。\n4.上課地點為燕巢校區。\n5.建工校區與燕巢校區相距車程約30 分鐘，\n有交通車接駁(依相關規定申辦)，學生可同\n時使用兩校區。\n6.本校五校區皆設有資源教室，關懷與協助\n身心障礙學生，提供課業及生活等方面的諮\n詢協助。"],["4303 理系",1,131,"商業與管理群","＊英文、專業科目(二)須達本類組均標。\n1.學生除應修畢本系應修之科目與學分數，\n且學業及操行成績均及格外，均需通過本校\n或本系訂定之語言能力檢定標準，始得畢\n業。\n2.課程內容涵蓋課堂討論、口語表達、專題\n製作，並有實習課程，需具人際互動溝通協\n調能力、能控制自身情緒。\n3.培養匠心獨妙的數位媒體創作與國際行銷\n達人。"],["4319006","文藻外語大學","外語教學系",1,132,"外語群英語類","＊英文、專業科目(二)須達本類組均標。\n1.學生除應修畢本系應修之科目與學分數，\n且學業及操行成績均及格外，均需通過本校\n或本系訂定之語言能力檢定標準，始得畢\n業。\n2.課程內容涵蓋課堂討論、口語表達、專題\n製作，並有實習課程，需具人際互動溝通協\n調能力、能控制自身情緒。\n3.以培訓2030 雙語政策下能以全英文授課之\n外語教學與外語課程及多媒體教材設計之人\n才，特色包含外語教學理論與實踐、跨文化\n溝通能力、電腦輔助語言教 學、科技與媒體\n之應用、兒童及青少年文學教學、外語測驗\n與評量及教學研究方法、外語教學實習與觀\n摩等課程。"],["4304004","致理科技大學","資訊管理系",2,132,"電機與電子群資電類","＊專業科目(一)、專業科目(二)須達本類組\n均標。\n本系成立宗旨在於培養資訊管理與人工智慧\n相關技術與應用能力之資訊管理專業人才，\n以因應企業組織與社會推展資訊化之需求 ；\n除培育學生科技與管理的專業知識外，並訓\n練學生主動服務、群體合作的胸襟與精神，\n如此方能在科技瞬息萬變的環境中，充分整\n合科技、組織、流程、人力等經營要素，達\n成領導組織創新，提升組織效益與競爭力的\n目標。課程聚焦在網路行銷、程式撰寫、資\n訊安全三大方向，教授也將根據學生的性\n格、興趣、專長，推薦適合學生修讀的學分\n學程、跨系選課、第二外語，幫助學生對自\n己志願有更深層的認識。本系不以理論研究\n為教育方向，而是強調專業技術與實務的結\n合，包含業師授課、專題製作、校外競賽、\n證照考取、職場實習，藉由大量的操作機會\n與產學合作，讓學生畢業就具有善於解決問\n題的職場即戰力，畢業前須符合本系修業條\n件及畢業規範。"],["4308011","致理科技大學","多媒體設計系",2,133,"設計群","＊國文須達本類組均標。\n本系獲台灣評鑑協會教學品保服務計畫5 年\n認證佳績，教學資源豐富，師資陣容堅強，\n課程受國際承認，注重學生實務操作及實\n習，畢業前須符合修業條件及本系畢業規\n範。特色:1.優質多元學習規劃，強化數位影\n音及互動媒體發展主軸，扎根專業訓練，規\n劃多元課程，打造優質環境，培育具創新設\n計與資訊科技整合能力人才。2.教學績效亮\n眼，競賽屢獲國內外大獎:2022~2025 德國紅\n點品牌與傳達設計獎10 件、2021~2024 年iF\n設計獎15 件、2022、2021 美國One Show\nInteractive 廣告創意國際學生獎銀牌2 件、\n2025 日本東京創新天才國際發明展金牌獎、\n2025 年全國技專校院學生實務專題製作競賽\n動漫互動多媒體群第一名、2026 年全國技專\n校院學生實務專題製作競賽榮獲1 冠軍、1 亞\n軍榮耀，連續8 年全國技專校院電腦動畫競\n賽入選、2023 金點新秀設計獎2 件、金點概\n念獎、連續多年入圍20 餘項影展、最佳動畫\n獎等。"],["4310012","致理科技大學","商務科技應用系",2,133,"商業與管理群","＊專業科目(一)、專業科目(二)須達本類組\n均標。\n本系先後獲得中華工程教育學會(IEET)的6\n年國際教育認證與台灣評鑑協會「大專院校\n教學品保服務計畫」5 年認證，本系教學注重\n跨領域學習，特別培養學生的執行力、協商\n力、創新力與整合力。此外，本系強調實務\n操作與實習機會，確保每位學生在畢業前都\n能具備實戰經驗和專業技能。本系課程設計\n靈活且實用，分為兩大模組:服務創新模組專\n注於培養數據分析與數位行銷人才，而資訊\n科技應用模組則致力於培育網站設計與資訊\n系統開發高手。本系還提供最熱門的跨系微\n學程「全方位整合性行銷」，結合生成式AI\n工具，讓畢業生在不同領域都能有專精發\n展，畢業前須符合修業條件及本系畢業規\n範。如果你對資訊科技與商務創新充滿熱\n情，並且喜歡多元學習、挑戰自我，那本系\n就是最理想的選擇!"],["4320006","致理科技大學","應用日語系",1,134,"外語群日語類","＊國文、專業科目(二)須達本類組均標。\n本系獲台灣評鑑協會「大專院 7,"","＊英文、數學B 須達本類組頂標。\n＊國文須達本類組前標。\n1.本系爲非師資培育學系。\n2.同學須通過本系所規定之外語能力檢定標準，方能\n畢業。"],["5110084","國立臺灣師範大學","公民教育與活動領導學系",1,137,"","＊國文須達本類組前標。\n＊英文須達本類組均標。\n1.本系為師培與非師培並行學系，課程分為師資培\n育、法政財經、戶外領導三種專業。\n畢業後欲從事教學工作者，應依本校相關規定申請修\n習教育專業課程。\n2.本系具有戶外領導相關課程，著重操作能力、溝通\n能力及專業學習能力。\n3.有關教師資格之取得及服務之權利與義務，悉依師\n資培育法及其相關法令之規定。"],["5110074","國立中興大學","行銷學系",1,137,"","＊國文、英文、數學B 須達本類組頂標。\n1.本系學科修讀期間需使用電腦，與同儕間進行團隊\n合作，進行口語報告及溝通，需具人際溝通協調能\n力。\n2.本系網址:https://marketing.nchu.edu.tw/，聯絡\n電話:04-22840392#792。"],["5110021","國立臺灣海洋大學","航運管理學系",1,137,"","＊英文、數學B 須達本類組前標。\n1.本校學士班學生需修習至少一學期游泳課程，但具\n備免修游泳條件者得申請免修。\n2.本校設有英文能力檢定考試之畢業門檻，未通過\n者，須加修「英文精進」課程，且成績及格者，始可\n畢業。\n3.住宿需求:身心障礙生(不限設籍地區)，於住宿申請\n時間內將身心障礙手冊影本寄送至住輔組，可辦理床\n位保留作業。"],["5110100","國立中正大學","哲學系",1,138,"","＊英文須達本類組前標。\n＊國文、數學B 須達本類組均標。\n入學本校學士班學生須於畢業前(建議在大三結束前)\n修習「社會實踐課程」(包含實踐6 至10 小時)。修習\n「社會實踐課程」及格者方得畢業。身心障礙學生之\n「社會實踐課程」內容，得由授課教師依實際情形適\n當調整，特殊狀況者，經通識教育中心同意後，得予\n免修「社會實踐課程」。本項規定若有異動，以學生入\n學時適用之規定為準。"],["5110103","國立中正大學","政治學系",1,138,"","＊國文、英文須達本類組前標。\n＊數學B 須達本類組均標。\n1.本系之招生期望係為具備人文關懷、公共參與以及\n服務社會，對於公共議題能有理解能力以及省思能\n力，且對國際關係、比較政治、公行與政策、科技與\n政治有興趣及具發展潛力之人才。\n2.課程學習著重於獨立思辨並培養學生溝通能力，核\n心課程包含閱讀大量資訊並判斷分析、基礎數理邏輯\n運算以及製作報告和口語能力之表達。\n3.入學本校學士班學生須於畢業前(建議在大三結束\n前)修習「社會實踐課程」(包含實踐6 至10 小時)。\n修習「社會實踐課程」及格者方得畢業。身心障礙學\n生之「社會實踐課程」內容，得由授課教師依實際情\n形適當調整，特殊狀況者，經通識教育中心同意後，\n得予免修「社會實踐課程」。本項規定若有異動，以學\n生入學時適用之規定為準。"],["5110079","國立高雄師範大學","體育學系",1,138,"","＊國文、英文須達本類組均標。\n1.本系採師資培育生與非師資培育生並行，有意從事\n教職者，入學後可依本校『學生修習教育學程辦法』\n考試錄取後，修習教育學程。另，本系有各項體育技\n能訓練課程，並有大量劇烈體能活動。\n2.本校實施「英語能力檢定」之畢業門檻，學士班學\n生在規定修業年限內，除修滿該學系應修學分外，「英\n語能力檢測」必須達到學校規定，方得畢業。\n3.以上說明若有未盡事宜，悉依本校「學則」及相關\n法令規定辦理。"],["5110064","國立高雄大學","財經法律學系",1,138,"","＊國文、英文須達本類組均標。"],["5110028","國立東華大學","觀光暨休閒遊憩學系",2,138,"","＊國文、英文、數學B 須達本類組均標。"],["5110029","國立東華大學","教育行政與管理學系",1,138,"","＊國文、歷史須達本類組均標。"],["5110057","國立東華大學","臺灣文化學系",1,138,"","＊歷史、地理須達本類組均標。\n本系課程重溝通理解與表達，其中包含如參與觀察、\n深度訪談等校外田野調查課程，須具相當溝通協調與\n移動能力。"],["5110132","國立東華大學","華文文學與創作學系",1,138,"","＊國文須達本類組均標。"],["5110137","國立東華大學","民族發展與社會工作學系民族發展組",1,139,"","1.本系(組)相關資訊請參閱本系網\n址:https://dds.ndhu.edu.tw/。\n2.本系(組)旨在培養公私立部門所需之民族公共事務\n及管理人才，教師教學重視文本閱讀與田野工作等實\n作技巧，有大量接觸人群的機會。須具備人際互動溝\n通協調、情緒控管、抗壓等能力。"],["5110043","國立暨南國際大學","東南亞學系",1,139,"","＊歷史、地理須達本類組均標。\n1.本系為全國唯一國立東南亞學系，學制完整，學、\n碩、博士課程俱全，能給學子開拓性視野及創新性思\n維。\n2.本系網址:https://dseas.ncnu.edu.tw/"],["5110129","國立臺北藝術大學","美術學系",1,139,"","＊須通過美術類術科考試。\n＊國文、英文須達本類組前標。\n＊總成績須達本類組均標。\n1.本校設有資源教室，協助學生處理生活、學習與生\n涯發展等方面之適應。\n2.未盡事宜，悉依本校「學則」及本系學分科目表等\n相關規定辦理。\n3.其他相關資訊請參閱本系網\n址:https://finearts.tnua.edu.tw/"],["5110156","國立臺灣藝術大學","書畫藝術學系",1,139,"","＊須通過美術類術科考試。\n＊國文、歷史須達本類組後標。\n＊英文須達本類組底標。"],["5110006","國立臺東大學","特殊教育學系",2,139,"","1.本系為全師培學系，但經本入學管道錄取者為外加\n名額，須經教育部核准後，方能取得師資生資格。\n2.本系教師教學重視溝通理解及表達能力。"],["5110007","國立臺東大學","音樂學系",2,139,"",""],["5110010","國立臺東大學","身心整合與運動休閒產業學系",1,139,"","1.21 世紀在「運動」與「健康」主軸因素驅動下，建\n構優質運動休閒環境及提高全民健康意識。本系為順\n應全球產業趨勢，是全國唯一整合身心學與運動休閒\n管理專業師資，培養理論與實務兼備運動休閒管理人\n才。\n2.本系課程包括各類術科與肢體操作，游泳為必修課\n程，並有大量體適能相關課程，且須參與業界實務實\n習。"],["5110162","國立臺東大學","公共與文化事務學系",1,139,"","＊國文、歷史、地理須達本類組後標。"],["5110022","國立宜蘭大學","休閒產業與健康促進學系",2,139,"","＊國文須達本類組均標。\n本系課程包含休閒運動管理等操作器材之需求，因此\n需具有相當之視覺功能及移動能力。"],["5110107","國立宜蘭大學","應用經濟與管理學系",2,139,"","＊總成績須達本類組均標。\n本系課程重視團隊合作、協調溝通，並需參與業界實\n務實習，學生需具備人際相處及情緒管理能力。"],["5110122","國立宜蘭大學","外國語文學系",2,139,"","＊英文須達本類組均標。\n本系課程中需閱讀大量書面資料，並以口語進行表達\n及演練，課程大多著重分組討論及報告。"],["5110077","國立聯合大學","文化觀光產業學系",1,140,"","＊國文、英文須達本類組均標。\n1.畢業條件學分、說明，依本校「學則」及相關規定\n辦理。\n2.本系需戶外田野實察與課程實作，需具有良好體\n能、移動能力。\n3.本系8 大基本能力，重視文化力、創意力、企劃\n力、溝通力、整合力、管理力、品牌力、觀光力。五\n大課程規劃，分別是文化觀光、觀光管理、智慧觀\n光、客家文化產業、一般產業管理。需具有良好的口\n語、閱讀、撰寫能力。在課程學習，有安排校外實\n習、分組討論等團隊合作，適合細心沉穩、個性活\n潑、具人際互動溝通協調能力、能控管自身情緒、具\n相當之抗壓能力。"],["5110138","國立臺中教育大學","特殊教育學系",1,140,"","＊國文、英文、總成績須達本類組均標。\n1.本校學士班學生應符合本校學則第52 條規定始得畢\n業。\n2.本系為全師培學系，但經本入學管道錄取者為外加\n名額，須經教育部核准後，方能取得師資生資格。學\n生修習或採認各類科師資培育課程及教師資格之取\n得，悉依教育部及本校相關規定辦理。\n3.本系師資生可取得國小資優、國小身障及學前特教\n三張教師證。\n4.本系可申請加註情緒與行為需求、認知與學習需求\n與輔助科技三種次專長。\n5.本校學生須通過各學系規定之語文能力畢業標準方\n得畢業；如未通過者，可依補救措施，提升其能力以\n符標準。"],["5110065","國立金門大學","運動與休閒學系",1,140,"","＊總成績須達本類組均標。"],["5110096","國立金門大學","企業管理學系",1,140,"","＊總成績須達本類組均標。"],["5110097","國立金門大學","觀光管理學系",1,140,"","＊總成績須達本類組均標。"],["5110099","國立金門大學","社會工作學系",1,140,"","＊總成績須達本類組均標。"],["5110108","國立金門大學","海洋與邊境管理學系",1,140,"","＊總成績須達本類組均標。"],["5110109","國立金門大學","長期照護學系",1,140,"","＊總成績須達本類組均標。"],["5110146","國立金門大學","應用英語學系",1,140,"","＊總成績須達本類組均標。"],["5110148","國立金門大學","華語文學系",1,140,"","＊總成績須達本類組均標。"],["5110149","國立金門大學","都市計畫與景觀學系",1,140,"","＊總成績須達本類組均標。"],["5110040","國立臺灣體育運動大學","休閒運動學系",1,141,"","＊國文須達本類組底標。\n本系課程包含上課討論、電腦操作、課程實作，並且\n休閒運動術科課程亦為本系課程之重心，例如水上活\n動、登山、攀岩等，需要進行不同肢體的活動與運\n作，並亦需要一定程度之團隊合作及抗壓能力。"],["5110063","國立臺灣體育運動大學","運動資訊與傳播學系",3,141,"","＊國文、英文、數學B 須達本類組後標。\n1.本系為培育運動資訊傳播專業人才，需具備口語表\n達、溝通能力，轉播工作需久站、運用肢體操作攝影\n機等設備。\n2.具人際互動溝通協調能力、能控管自身情緒、具相\n當之抗壓能力。\n3.體育術科:本校訂有校訂必修游泳課程，院訂必修田\n徑課程各1 學分課程，另訂系選修術科5 學分。"],["5110003","國立屏東大學","應用日語學系",2,141,"","＊總成績須達本類組均標。\n錄取者為非師資培育生，欲修讀教育學程者，可依規\n定提出申請參加遴選，通過者得修習教育學程(含國\n小、特教、幼教等類科)，相關資訊請參\n閱:https://cte.nptu.edu.tw。"],["5110004","國立屏東大學","企業管理學系",2,141,"",""],["5110005","國立屏東大學","商業大數據學系",1,141,"",""],["5110020","輔仁大學","宗教學系",3,141,"","本校將英文與資訊等二項基本能力列入畢業條件，相\n關規定請於報名前詳閱學系網頁之「修業規則」及本\n校全人教育課程中心網頁「基本素養培育與檢測」專\n區，網址:\nhttp://www.hec.fju.edu.tw/article.jsp?articleID=93"],["5110025","東吳大學","英文學系",1,141,"","＊英文須達本類組前標。\n＊國文須達本類組均標。\n1.本校有外雙溪及城中兩個校區，外雙溪校區位處山\n坡地，需具備移動能力。\n2.法律學系修業5 年，其餘學系均為4 年。\n3.除須於規定年限內修畢學系規定應修科目與學分\n外，尚須通過校系規定之外語能力、資訊能力及美育\n活動畢業標準，方得畢業；如未通過，本校訂有補救\n措施，協助提昇其能力與素質。\n4.為使學生得以充分運用教學與各項生活資源，法商\n學院一年級新生每週規劃部分課程至 外雙溪校區上\n課。\n5.本校學雜費及獎助學金等資訊，請逕上本校德育中\n心網頁查詢。\n6.本系課程著重溝通理解與表達能力，須具備相當視\n覺、聽覺、口語表達能力以及人際互動合作協調能\n力。"],["5110078","中原大學","應用華語文學系",1,141,"","＊國文須達本類組後標。\n1.本系學生需於畢業前在本校修習英語以外之同一第\n二外語至少 8 學分。\n2.學士班入學學生，必須通過本校認定之英文能力鑑\n定考試，始准予畢業，請詳見「中原大學學生英文畢\n業門檻作業細則」。\n3.本系網址:https://deptweb.cycu.edu.tw/tcsl/"],["5110037","淡江大學","財務金融學系",2,142,"","＊英文、數學B 須達本類組後標。\n本系採行多元教學方式，培養學生獨立思考和解決問\n題之分析能力，並提供企業實習課程，提高理論實務\n應用能力。"],["5110045","淡江大學","中國文學學系",1,142,"",""],["5110123","淡江大學","歷史學系",1,142,"",""],["5110051","中國文化大學","地理學系",2,142,"","＊國文須達本類組底標。\n本系相關 內外公司上班，許多人\n服務於外商或科技公司。大一大二必修課程英日語各\n半，英語方面增進職場實際應用說寫能力，日語方面\n打好基礎。模組課程為專業職場必修模組、選修模組\n二選一:數位跨語或跨文化能力模組。畢業至少英文中\n高級、日文N3 程度或英文中高級、初試日文N2。"],["5110019","大葉大學","觀光休閒學系",2,143,"","＊國文須達本類組底標。\n1.本系培育具備觀光休閒遊憩專業知識、獨立思考、\n跨域執行能力及團隊合作之專業人才，課程創新以國\n際化、專業化為導向，融入理論與實務之實踐，因應\n多元化、多變之觀光休閒產業特性與就業需求。\n2.大葉歡迎同學至本校就讀，未來課業學習若遇困\n難，資源教室輔導員將盡力協助媒合相關專長教師，\n進行課後補救教學或個別課業輔導。\n3.電話:04-8511888#3311，網\n址:https://tlr.dyu.edu.tw"],["5110023","大葉大學","設計學系",1,144,"","＊國文須達本類組底標。\n1.本系提供多元且具彈性的設計課程，學生可依個人\n興趣、能力與學習需求，選擇適合的專業方向。\n2.專業領域涵蓋視覺傳達、數位媒體、AI 設計應用、\n產品設計、交通與無人載具設計、文創設計及地方創\n生等，並重視跨域學習與產業實務連結。\n3.課程重視創意思考、設計實作、數位工具應用及團\n隊合作，並結合大葉大學德國師徒制教學特色及業師\n協同教學，強化學生專業實作能力與產業接軌經驗。\n4.畢業後可依個人興趣與專長，投入相關設計產業，\n亦可選擇繼續升學，具備多元職涯發展方向。\n5.大葉歡迎同學至本校就讀；未來課業學習若遇困\n難，資源教室輔導員將盡力協助媒合相關專長教師，\n進行課後補救教學或個別課業輔導。\n6.本系網址:https://ds.dyu.edu.tw/；聯絡電話:04-\n8511888 分機5011。"],["5110024","大葉大學","多媒體數位內容學士學位學程",3,144,"","＊國文須達本類組底標。\n1.由跨領域之數位媒體設計師資組成，課程以動畫設\n計、影視特效設計、遊戲設計、互動設計、動漫美\n術、模型製作及AI 輔助設計等產業所需人才進行一條\n龍的專業能力養成，提供學生將來進入這個兆元產業\n最佳的課程與專業訓練。\n2.大葉歡迎同學至本校就讀；未來課業學習若遇困\n難，資源教室輔導員將盡力協助媒合相關專長教師，\n進行課後補救教學或個別課業輔導。\n3.網址: http://mdc.dyu.edu.tw/，聯絡電話04-\n8511888#2421。"],["5110034","大葉大學","空間設計學系建築組",2,144,"","＊國文須達本類組底標。\n1.本系課程教授採分組討論及發表報告，部分課程需\n親自操作具危險性機器設備，以奠定基礎專業技能。\n2.大葉歡迎同學至本校就讀；未來課業學習若遇困\n難，資源教室輔導員將盡力協助媒合相關專長教師，\n進行課後補救教學或個別課業輔導。\n3.本系網址:http://sp.dyu.edu.tw，臉書搜尋「大葉\n大學空間設計學系/建築研究所」，聯絡電話:04-\n8511888 轉5195。"],["5110035","大葉大學","空間設計學系室內設計組",2,144,"",""],["5110044","大葉大學","會計與資訊管理學系",1,145,"","＊國文須達本類組底標。\n1.本系結合會計與AI 兩領域專長，會計是商業的語\n言、管理的基礎，故設立「會計暨投資理財組」。培養\n學生具備資訊化能力的會計師、記帳士及理財專員\n等，協助企業快速並有效地進行會計稽核以及具智慧\n化的投資理財能力。課程包含時下最夯人工智慧、大\n數據分析、電腦稽核、智慧理財投資等。\n2.教育目標為:\n(1)培育能夠應用人工智慧(AI)技術的資訊管理、數位\n會計、智慧稽核、投資理財及永續管理等領域的創新\n專業人才。\n(2)透過跨領域整合與AI 技術的實務應用，致力於將\n學生打造成未來數位化社會中的領導者、激發潛能，\n以提升學生在數位轉型及智慧化管理中的競爭力。\n3.大葉歡迎同學至本校就讀；未來課業學習若遇困\n難，資源教室輔導員將盡力協助媒合相關專長教師，\n進行課後補救教學或個別課業輔導。\n4.電話:04-8511888 轉3131；網址:\nhttps://ai.dyu.edu.tw。"],["5110130","大葉大學","烘焙暨飲料調製學士學位學程",2,145,"","＊國文須達本類組均標。\n1.本學程實作課程需親自操作具危險性機器設備，以\n奠定基礎專業技能。\n2.大葉歡迎同學至本校就讀；未來課業學習若遇困\n難，資源教室輔導員將盡力協助媒合相關專長教師，\n進行課後補救教學或個別課業輔導。\n3.網址:http://bbp.dyu.edu.tw，聯絡電話:04-\n8511888 分機7055。"],["5110085","義守大學","視覺藝術與設計學系",2,145,"","1.本系以視覺藝術結合AI 技術為核心，涵蓋生成藝\n術、AR/VR/XR、沉浸式影像與互動設計。\n2.強化專業指導與創新力，就業以數位設計、UI/UX、\n創意商品及科技藝術為主。\n3.提供海外實習、產學合作與國際交換，培養國際視\n野與創新能量。\n4.本系網址: dvad.isu.edu.tw，連絡電話: 07-\n6577711 轉8352。"],["5110086","義守大學","企業管理學系",2,145,"","1.本系在培養有競爭力之專業經理人與創業家，並聚\n焦於創意廣告與行銷物流、組織領導與人力資源，以\n及企業診斷與創業管理，三個特色管理學程。\n2.課程採用多元教學模式，結合AI 科技、個案研討、\n專題競賽、實務實作與企業實習等，擺脫傳統聽講課\n程設計，並通過AACSB 國際商管認證，教學品質獲世\n界級肯定。\n3.系友遍及各行各業，如創業家、廣告行銷、人力資\n源、工業管理、公職、金融從業人員等。\n4.本系聯絡電話:07-6577711 轉5902，網\n址:ba.isu.edu.tw。"],["5110087","義守大學","資訊管理學系",2,146,"","1.本系旨在培育人工智慧、行動商務、大數據與智慧\n物聯網產業亟需之專業人才，課程中融入AI 輔助教\n學，輔導同學考取多張國際級專業證照，並與多家資\n訊公司合作，提供實習與就業機會，以期達成「畢業\n即就業」之目標。\n2.本系聯絡電話:07-6577711 轉6552，網址:\nmis.isu.edu.tw。"],["5110141","世新大學","財務金融學系",1,146,"","本校學生除須於修業年限內修畢所屬學系(組)規定之\n應修學分外，尚須依規定通過「英語能力」、「中文能\n力」、「資訊能力」、「思辨表達能力」、「自我管理能\n力」等基本能力課程及學系畢業門檻，方可畢業。"],["5110142","世新大學","觀光學系餐旅經營管理組",1,146,"",""],["5110143","世新大學","觀光學系旅遊暨休閒事業管理組",1,146,"",""],["5110160","世新大學","社會心理學系",1,146,"",""],["5110082","銘傳大學","影音新聞暨社群傳播學系（台北校區）",1,146,"","＊國文、英文須達本類組底標。\n1.本系結合理論與實務課程，培養具有責任感、新聞\n編採能力、數位匯流及國際視野的整合傳播、專業新\n聞人才。\n2.本系上課需操作電腦等儀器設備，如專業攝影機、\n收音設備、使用剪輯及排版軟體。\n3.本系在台北校區上課。\n4.修業期間需通過校定與系定畢業門檻始得畢業。未\n通過各項能力檢定者，應參加由各教學單位提出之補\n救教學相關課程，修習合格後，始得畢業。"],["5110104","實踐大學","休閒產業管理學系（高雄校區）",2,146,"","＊國文須達本類組底標。\n1.本系以豐富的遊憩、運動與健身設施器材、校內外\n營運體驗場地與業師，培養專業的遊憩運動企劃人\n才。\n2.學生更可跨領域修習精品咖啡烘焙經營、休閒文創\n規劃和文化設計策展等特色課程，所學呼應全球綠色\n產業(重視環境生態)、橘色經濟(關注人本人文與健\n康)趨勢。\n3.學生享有豐富實用課程、國家證照保障學程、薪資\n優渥實習，保證學生畢業即就業，更是當代渴望的跨\n領域職能人才。"],["5110105","實踐大學","國際企業管理學系（高雄校區）",2,146,"","＊英文須達本類組底標。\n1.透過招生管道之多元化招考具有積極進取，勇於創\n新等特質，適合從事經營管理工作之優秀學生。\n2.本系有海外移地教學，海外實習等體驗國際視野之\n課程。\n3.本系承接本校與德國福茲堡科技大學EMBA 學生交換\n授課之活動，故本系學生有許多與德國學生互動之機\n會。\n4.學系網址:https://ibm.kh.usc.edu.tw/。\n5.FB 社團請搜尋:實踐大學高雄校區國際企業管理學\n系。"],["5110106","實踐大學","數位多媒體遊戲設計學系（高雄校區）",1,147,"","＊國文須達本類組底標。\n1.培養學生成為多媒體遊戲設計人才。\n2.培養學生成為高階次世代遊戲美術設計人才。\n3.辦理就業學程，聘請知名業師與產業接軌。\n4.聘請國際名師開設工作坊，開拓國際移動力。\n5.畢業生深受企業歡迎，從事遊戲設計、3D 建模等次\n世代遊戲美術產業。\n6.本系與多家遊戲大廠簽定實習合約，提供暑期實習\n及全學年實習，畢業後優先錄用。"],["5110139","實踐大學","國際經營與貿易學系（臺北校區）",2,147,"","＊英文、總成績須達本類組底標。\n1.本校諮商中心設有資源教室及輔導老師，提供課業\n及生活諮詢輔導之協助。\n2.透過招生管道之多元化，招收積極進取且具國際貿\n易與國際企業專業潛力之人才。\n3.學生須於修業年限內修畢本學系組應修學分，並通\n過本系規定之專業能力畢業門檻。"],["5110140","真理大學","音樂應用學系",5,147,"","音樂應用學系提供四個模組給熱愛音樂的你加入，包\n含演奏演唱、流行音樂、藝術行政與音樂療育。組別\n靈活應用，可依興趣申請轉組，增加同學對音樂的更\n多理解。詳細介紹請參考本系網\n站:https://music.au.edu.tw 或洽(02)26212121 轉\n1788 或5366。"],["5110144","真理大學","應用日語學系",5,147,"","＊國文、英文須達本類組底標。\n1.聽、說、讀、寫、譯是學習外語的基本能力，也是\n本系培養學生的核心。透過扎實的語言能力訓練，進\n一步結合日本經貿、觀光、教育等跨域專業知識，培\n養學生多元能力，提升畢業後的就業競爭力。\n2.本系相關資訊請參照本系系網，本系網址:\nhttps://japanese.au.edu.tw/"],["5110145","真理大學","企業管理學系",5,147,"","＊國文須達本類組底標。\n1.本系相關資訊請參閱系網頁\n( https://ba.au.edu.tw/ )\n2.本系之教育目標在於培育企業經營管理之實務專業\n人才；要求學生要能有人際溝通與團隊合作技能，可\n以獨立思考與創新能力，課程內容涵蓋課堂討論、報\n告撰寫與實作。"],["5110147","真理大學","資訊工程學系",2,147,"","本系重視學生的學習需求，提供適切的學習支持與專\n業輔導，陪伴學生發揮專長、建立自信!老師具有濃厚\n教學熱忱，透過適切的教材教法與悉心引導，培養學\n生程式設計、人工智慧及資訊系統實作能力。學生可\n在實驗室教師指導下，參與實務研發與專題研究，培\n養專業能力，並參加定期舉辦的「偕睿理杯」程式設\n計與專題競賽，累積實作與研究經驗。同時結合本系\n提供的職涯規劃與實習輔導，參與企業實習，將所學\n應用於職場，找到適合自己的發展方向，銜接未來升\n學與就業，發揮資訊科技專長，創造屬於自己的精彩\n未來!"],["5110150","真理大學","法律學系",10,148,"","＊國文須達本類組底標。\n1.對於法律有興趣，並具有維護公平正義、扶助社會\n上受害人與弱勢者之心志者。\n2.本系系網:https://law.au.edu.tw/。\n3.連絡電話:02-26212121 轉1797、4322。\n4.系主任信箱:au4322@mail.au.edu.tw。"],["5110151","真理大學","財務金融學系",6,148,"","1.本系定位在培育基層金融人才，使學生畢業時能具\n備金融倫理道德素養及金融知識。\n2.相關資訊請參閱財務金融學系網頁:fb.au.edu.tw"],["5110152","真理大學","國際經營與貿易學系",6,148,"","1.本系以培育具有健全人格特質、人文關懷素養、宏\n遠國際觀、英日外語溝通能力、國際經營與經貿等專\n業人才。\n2.相關資訊請參閱學系網頁:\nhttps://itrade.au.edu.tw/"],["5110153","真理大學","運動管理學系",10,148,"","＊國文須達本類組底標。"],["5110154","真理大學","觀光事業學系",5,148,"","＊總成績須達本類組底標。\n本系課程涵蓋觀光旅遊與餐旅管理，重視實務操作、\n團隊合作、溝通表達及校外參訪與實習。部分課程可\n能包含導覽解說、活動企劃、分組報告、餐旅實作、\n戶外移動或長時間站立等學習活動。歡迎對觀光、旅\n遊、文化、旅館及餐飲服務有興趣，並願意主動學\n習、與人互動及參與實務活動的學生選讀。學生可依\n個別需求，於入學前洽詢學系及資源教室，了解課\n程、實習場域、校園動線、輔具、課業輔導與評量調\n整等支持措施，以共同規劃適切的學習方式。選系時\n建議綜合考量個人興趣、能力、健康狀況及所需支\n持。"],["5110161","真理大學","宗教文化與資訊管理學系",6,148,"","＊國文、歷史須達本類組底標。 2,152,"","1.本校位於山丘之巔，俯瞰蘭陽平原，風景美、氣氛\n佳，是學習及思考人生哲學不可多得的好環境!\n2.本系重視閱讀、溝通理解及表達能力，課程著重討\n論及報告。"],["5110112","佛光大學","社會工作學系",1,152,"","1.本校位處山坡地，建議選填志願前可至校園了解環\n境。\n2.本系重視思考、溝通及表達，課程著重於分組討\n論、口頭及書面報告，實習課程需赴校外機構，可能\n有大量接觸人群的機會，需具人際互動溝通協調能\n力、能控管自身情緒、具相當之抗壓能力。"],["5110119","佛光大學","應用經濟學系",1,152,"","本校位處山坡地，建議選填志願前可至校園了解環\n境。"],["5110136","康寧大學","嬰幼兒保育學系",1,152,"","＊國文、英文、總成績須達本類組底標。\n1.本系成立宗旨在培育具有教保托嬰雙專業人才，須\n學習具備觀察並照顧幼兒之能力。\n2.本系課程涵蓋幼兒發展、教材教法與實務操作，並\n進行教保機構實習，需進行閱讀理解、文字書寫、觀\n察紀錄及大量溝通互動。適合具備細心耐心、良好溝\n通與協調能力、人際互動能力，並能持續自我學習與\n調整者。\n3.畢業前須符合本校修業規定(包含學科及實習)及本\n系畢業門檻。"],["5110134","中信金融管理學院","企業管理學系",2,152,"","＊國文須達本類組均標。"],["5120007","國立成功大學","光電科學與工程學系",1,152,"","＊英文、數學A、物理須達本類組前標。"],["5120011","國立中興大學","土木工程學系",1,153,"","＊數學A、物理須達本類組前標。\n＊英文須達本類組均標。\n1.本系學科經常要操作儀器設備、電腦繪圖及資料搜\n索、野外實習，需上山下海勘查，攀爬鷹架架設儀器\n等。\n2.本系主要培養土木工程通才為主，理論與實務並\n重，學以致用為目的，並著重基礎學科的培育及工程\n應用學科(結構工程、水利工程、大地工程、測量資\n訊、營建管理等)的訓練。本系部分課程為英語授課，\n以強化學生國際競爭力。\n3.本系網址:https://www.ce.nchu.edu.tw/，聯絡電\n話:04-22840437#221。"],["5120012","國立中山大學","電機工程學系",1,153,"","＊數學A、物理、化學須達本類組頂標。\n1.本系部分實驗課程須親自實際操作\n2.入學本校學士班學生畢業前，需依起始分級先修畢\n「語文素養:英語文」領域必修課程，再修習一門學術\n英文EAP 或專業英文ESP 跨院選修課程，並通過本校\n「英語文能力標準認證」，方得畢業。詳細資料請逕至\n西灣學院/更多資訊/規章表單/學生專區/學士班學生\n英語文能力標準認證。\n3.各項說明若有未盡事宜，悉依本校「學則」及必修\n科目表等相關規定辦理。"],["5120013","國立中山大學","材料與光電科學學系",1,153,"","＊數學A、物理、化學須達本類組頂標。\n1.部分實驗課程須親自操作精密儀器，具備辨別顏色\n能力。\n2.入學本校學士班學生畢業前，需依起始分級先修畢\n「語文素養:英語文」領域必修課程，再修習一門學術\n英文EAP 或專業英文ESP 跨院選修課程，並通過本校\n「英語文能力標準認證」，方得畢業。詳細資料請逕至\n西灣學院/更多資訊/規章表單/學生專區/學士班學生\n英語文能力標準認證。\n3.各項說明若有未盡事宜，悉依本校「學則」及必修\n科目表等相關規定辦理。"],["5120022","國立暨南國際大學","電機工程學系",1,153,"","＊英文、數學A、物理須達本類組均標。\n本系網址:https://ee.ncnu.edu.tw/"],["5120001","國立宜蘭大學","機械與機電工程學系",1,153,"","＊英文、數學A、物理須達本類組均標。\n本系實驗及工廠實習相關課程，均須具備操作儀器及\n機具設備之能力；實驗課程極為重要，基於考量實驗\n操作危險性與結果判定之需要，學生須具備獨立操作\n能力及個人安全維護能力；其他課程包含電腦操作、\n解說能力，並有實務操作及專題製作課程。"],["5120010","國立宜蘭大學","環境工程學系",1,153,"","＊數學A、化學、總成績須達本類組均標。\n因實驗課程涉及相關實驗設備、耗材之操作使用，需\n運用良好視覺、辨色力、行動能力及溝通能力，及個\n人安全維護能力。"],["5120014","國立聯合大學","材料科學工程學系",2,153,"","＊物理、化學須達本類組前標。"],["5120015","國立聯合大學","環境與安全衛生工程學系",1,154,"","＊數學A、化學須達本類組後標。\n本系課程重視操作實驗及專題實作，操作實驗需親自\n操作儀器設備，部分實驗須透過色彩判定結果。操作\n實驗具有一定危險性需有即時移動能力。專題實作為\n必修課程，重視閱讀、溝通理解及表達能力。"],["5120018","國立聯合大學","機械工程學系",2,154,"","＊數學A、物理須達本類組均標。"],["5120025","國立金門大學","土木與工程管理學系",1,154,"","＊總成績須達本類組均標。"],["5120019","東海大學","永續科學與管理學士學位學程",1,154,"","＊英文須達本類組後標。"],["5120005","淡江大學","物理學系量子材料組",1,154,"","＊數學A、物理須達本類組後標。\n本校訂有學生英語能力檢定之畢業門檻，符合下列任\n一英語能力檢定畢業門檻條件，始得畢業:\n1.參加各種英語能力檢定考試，通過相當於歐洲語言\n共同參考架構(CEFR)等級B1 以上者。\n2.修習本校英文(一)及英文(二)課程，且英文能力測\n驗(二)成績七十分以上者。\n3.依本校「新生免修英文(一)、英文(二)課程實施要\n點」申請通過者。"],["5120006","淡江大學","物理學系天文與基礎物理組",1,154,"",""],["5120023","淡江大學","土木工程學系",1,154,"","＊數學A 須達本類組後標。"],["5120008","中國文化大學","地理學系",2,154,"","＊國文須達本類組底標。\n本系相關資訊、修課規定及畢業條件等請參閱本系網\n頁:https://geography.pccu.edu.tw/。"],["5120009","中國文化大學","紡織科技創新與應用工程學系",1,154,"","本系相關資訊、修課規定及畢業條件等請參閱本系網\n頁:https://textile.pccu.edu.tw/"],["5120029","中國文化大學","化學工程與材料工程學系",1,154,"","本系課程含實驗操作，基於考量實驗操作危險性與結\n果判斷之需要，學生須具備獨立操作能力及個人安全\n維護能力。\n本系相關資訊、修課規定及畢業條件等請參閱本系網\n頁https://crencm.pccu.edu.tw。"],["5120003","逢甲大學","航太與系統工程學系",2,154,"","＊物理須達本類組後標。\n本校日間學士班學生在規定修業年限內，修足應修科\n目與學分數(含非本系至少13 學分)，並通過本校及該\n系、學位學程規定之各項考核(畢業條件) 成績合格\n者，始得畢業授予學位。"],["5120002","逢甲大學","電子工程學系",1,154,"","本校日間學士班學生在規定修業年限內，修足應修科\n目與學分數(含非本系至少13 學分)，並通過本校及該\n系、學位學程規定之各項考核(畢業條件) 成績合格\n者，始得畢業授予學位。"],["5120004","逢甲大學","材料科學與工程學系",2,154,"",""],["5120021","逢甲大學","機械與電腦輔助工程學系",5,154,"",""],["5120028","靜宜大學","晶片設計學士學位學程",1,155,"","＊英文、數學A 須達本類組後標。\n1.本學程課程核心在於晶片設計與電路實作，需長時\n間進行電路圖比對、版圖設計與電路模擬等高度視覺\n化操作，需具備即時辨識細微圖樣與符號之能力。\n2.為更詳盡認識及選擇學系，請務必上網查詢課程與\n簡介(https://icd.pu.edu.tw/)。"],["5120016","元智大學","資訊工程學系",1,155,"","＊總成績須達本類組均標。\n本系秉持務實、負責任的態度辦學，特色有(1)以雙語\n教學與海外學習來培養國際移動能力(2)以跨域教學激\n發創新與發明潛力，並注重軟體與硬體、電腦與網\n路、資訊與財務金融、資訊與美藝、資訊與電子整合\n能力之養成(3)提升重要領域之研究質量及(4)為期一\n年之校外專業實習，讓學生體驗職涯生活並將實務經\n驗反饋於學習上，深化專業素養。資訊工程造就了智\n慧生活，創新發明機會多，職涯發展前途寬廣無限。\n只要能依本系訂定課程標準踏實地完成學業，畢業即\n是就業。"],["5120020","實踐大學","資訊管理學系（高雄校區）",2,155,"","＊數學A 須達本類組底標。\n1.學生除須於修業年限內修畢所屬學系組應修學分\n外，「英語文畢業能力指標」等畢業門檻必須達到學校\n規定。\n2.培養物聯網應用、人工智慧、雲端應用、資訊安全\n人才，課程內容以實用生活導向。大四時可至國內企\n業實習並有廠商優先錄用機會；透過專題和參加全國\n性比賽訓練實務與表達能力；安排專任教師針對證照\n及課程輔導，畢業前取得1 門以上專業證照。\n3.欲從事資訊工作，宜具備自我管理及情緒調適能\n力。"],["5120026","真理大學","資訊工程學系",1,155,"","本系重視學生的學習需求，提供適切的學習支持與專\n業輔導，陪伴學生發揮專長、建立自信!老師具有濃厚\n教學熱忱，透過適切的教材教法與悉心引導，培養學\n生程式設計、人工智慧及資訊系統實作能力。學生可\n在實驗室教師指導下，參與實務研發與專題研究，培\n養專業能力，並參加定期舉辦的「偕睿理杯」程式設\n計與專題競賽，累積實作與研究經驗。同時結合本系\n提供的職涯規劃與實習輔導，參與企業實習，將所學\n應用於職場，找到適合自己的發展方向，銜接未來升\n學與就業，發揮資訊科技專長，創造屬於自己的精彩\n未來!"],["5120027","真理大學","財務金融學系",6,155,"","1.本系定位在培育基層金融人才，使學生畢業時能具\n備金融倫理道德素養及金融知識。\n2.相關資訊請參閱財務金融學系網頁:fb.au.edu.tw"],["5120024","亞洲大學","生物資訊與醫學工程學系",2,156,"","＊總成績須達本類組均標。\n1.本校設有資源教室，可依學生個別需求提供課業、\n生活適應及相關支持與諮詢。\n2.本系採分組討論及實作教學，課程包含電腦操作、\n實驗、專題製作及口頭報告，學生須參與團隊合作。\n3.課程需使用電腦進行資料查詢、軟體操作、數據分\n析及報告製作。專題分為生物資訊及醫學工程方向；\n前者以電腦資料處理及分析為主，後者涉及物理、化\n學、生物實驗及儀器操作。\n4.實驗課程為本系重要學習內容，部分課程涉及化學\n品、儀器及實驗材料操作，具有一定風險。學生須遵\n守個人防護及實驗室安全規範，並配合緊急應變程\n序。\n5.如有輔具、操作協助、課程或環境調整需求，將由\n學生、本系、授課教師及資源教室依個別需求共同研\n議合理調整，兼顧課程核心目標與實驗安全。"],["5130008","國立中興大學","昆蟲學系",1,156,"","＊生物須達本類組前標。\n＊英文須達本類組均標。\n1.本系實驗性質課程含有各式儀器操作(如:普通昆蟲\n學實習、昆蟲生理學實習等)，須具備儀器操作之能\n力。\n2.本系以昆蟲學、生命科學、農業科學及生態學為基\n礎，培育具昆蟲學、生命科學、農學、植物防疫及檢\n疫、病媒與環境衛生昆蟲以及生物多樣性、生態保育\n等學識之科學研究與實務能力之專業高階人才。\n3.本系網址:https://www.entomol.nchu.edu.tw/，聯\n絡電話:04-22840361#524。"],["5130002","國立臺灣海洋大學","生命科學暨生物科技學系",1,156,"","＊英文、化學、生物須達本類組前標。\n1.本校學士班學生需修習至少一學期游泳課程，但具\n備免修游泳條件者得申請免修。\n2.本校設有英文能力檢定考試之畢業門檻，未通過\n者，須加修「英文精進」課程，且成績及格者，始可\n畢業。\n3.住宿需求:身心障礙生(不限設籍地區)，於住宿申請\n時間內將身心障礙手冊影本寄送至住輔組，可辦理床\n位保留作業。"],["5130004","國立東華大學","體育與運動科學系",2,156,"","＊國文、數學A 須達本類組後標。\n1.本系為培育體育師資學系，有各項體育技能訓練課\n程，並有大量劇烈體能活動。\n2.錄取者為非師資培育生，欲修讀教育學程者，可依\n規定向本校師資培育中心提出申請參加甄選，通過者\n得修習教育學程。"],["5130006","國立宜蘭大學","森林暨自然資源學系",1,157,"","＊國文、數學A、生物須達本類組均標。\n本系有必修之野外實習課程，如:步入野地、山谷、斷\n崖、碎石坡等障礙地形，並會接觸毒蛇、毒蜂或其他\n各種有安全風險的野生動物，除需具備良好體能、移\n動能力外，亦須有獨立自主、危險判斷、緊急應變等\n能力；另本系有木工機械相關課程，常需操作具有高\n度危險之各類木工機器，需有穩定的情緒及專注力。"],["5130011","國立宜蘭大學","生物技術與動物科學系",1,157,"","＊化學、生物、總成績須達本類組均標。\n本系有許多需動手操作之實驗課程或實習機會，需運\n用良好視覺、辨色力、行動能力及溝通能力。"],["5130013","國立宜蘭大學","食品科學系",2,157,"","＊英文、化學、生物須達本類組後標。\n操作實驗為本系學習之重點，學生均需透過親自操作\n儀器奠定化學基礎專業知識與實驗技能，部分實驗須\n透過色彩判定實驗結果。化學實驗具有一定危險性，\n需有能力即時移動身軀遠離危險現場。"],["5130014","國立臺灣體育運動大學","體育學系",2,157,"","＊國文、英文、總成績須達本類組後標。\n1.本系培養體育教學、運動健身指導人才，須具備口\n語表達、溝通能力。\n2.具人際互動溝通協調能力、具相當之抗壓能力。\n3.歡迎對運動有興趣、熱忱的同學加入本系的行列。"],["5130012","東海大學","高齡健康與運動科學學士學位學程",3,157,"","1.本學程發展主軸為培育運動預防醫學之人才。課程\n學習重視團隊合、協調溝通，並需參與業界實務實\n習。\n2.學系聯絡電話:04-23590121 分機37502。\n3.網址:http://swss.thu.edu.tw/\n4.聯絡E-mail:swss@thu.edu.tw"],["5130005","中國文化大學","森林暨自然保育學系",2,157,"","本系相關資訊、修課規定及畢業條件等請參閱本系網\n頁:https://crffnc.pccu.edu.tw。"],["5130016","中國文化大學","動物科學保健暨園藝科技學系",6,157,"","本系相關資訊、修課規定及畢業條件等請參閱本系網\n頁:https://crvahb.pccu.edu.tw/。"],["5130003","大葉大學","藥用植物與食品保健學系",2,157,"","＊英文須達本類組底標。\n1.學系課程結合「食藥生技」與「藥粧保健」專業跨\n科知識整合及應用生技產業實務特色。學程重視專題\n研究、跨域學習、實務證照及產業實習。\n2.食藥生技組教學研究包括微生物發酵、製程開發、\n保健原料應用與配方設計。藥粧保健組教學研究包括\n藥用植物暨藥粧資源開發、中藥暨藥粧產品配方設\n計、芳療與美容實務應用。\n3.學程跨域培養中藥保健、食品生技與美粧產業科技\n研發與經營管理技能之專業人才。\n4.大葉歡迎同學至本校就讀,未來課業學習若遇困難,\n資源教室輔導員將盡力協助媒合相關專長教師,進行課\n後補救教學或個別課業輔導。\n5.網址https://mfh.dyu.edu.tw/, 電話:04-\n8511888#2281。"],["5130001","高雄醫學大學","公共衛生學系",2,158,"","＊英文、數學A、生物須達本類組均標。\n1.本學系核心專業課程及實習涉及統計數據資料處理\n與圖表判讀、實驗操作、環境化學實驗及環境衛生實\n務、社區衛生教育與職場現場採樣活動、團隊合作及\n溝通表達等多元核心課程。申請公衛系學生皆應具備\n完成上述核心課程與實習之基本學習及操作能力。身\n心障礙學生如有特殊學習需求，申請前需要評估個別\n狀況是否能完成本學習課程核心能力及實習安全需\n求。\n2.本校宿舍設有無障礙及低床位寢室，對於入住相關\n無障礙需求，建議先來電洽詢本校生活輔導組(電\n話:07-3121101#2823)或資源教室(電話:07-\n3121101#2121)進行評估與討論。\n3.本校設有無障礙設施，實際使用需求建議選填志願\n前可至校園了解環境。"],["5130015","真理大學","運動管理學系",10,158,"","＊國文須達本類組底標。"],["5140002","中國文化大學","森林暨自然保育學系",2,158,"","本系相關資訊、修課規定及畢業條件等請參閱本系網\n頁:https://crffnc.pccu.edu.tw。"],["5140001","高雄醫學大學","公共衛生學系",2,158,"","＊英文、數學A、生物須達本類組均標。\n1.本學系核心專業課程及實習涉及統計數據資料處理\n與圖表判讀、實驗操作、環境化學實驗及環境衛生實\n務、社區衛生教育與職場現場採樣活動、團隊合作及\n溝通表達等多元核心課程。申請公衛系學生皆應具備\n完成上述核心課程與實習之基本學習及操作能力。身\n心障礙學生如有特殊學習需求，申請前需要評估個別\n狀況是否能完成本學習課程核心能力及實習安全需\n求。\n2.本校宿舍設有無障礙及低床位寢室，對於入住相關\n無障礙需求，建議先來電洽詢本校生活輔導組(電\n話:07-3121101#2823)或資源教室(電話:07-\n3121101#2121)進行評估與討論。\n3.本校設有無障礙設施，實際使用需求建議選填志願\n前可至校園了解環境。"],["5201001","國立臺北護理健康大學","醫護教育暨數位學習系",1,158,"共同類","＊國文、英文須達本類組均標。\n1.本系相關資訊請參閱本系網址，\nhttps: 5324020","醒吾科技大學","新媒體傳播系",3,206,"藝術群影視類",""],["5324021","醒吾科技大學","表演藝術系",10,206,"藝術群影視類",""],["5324022","醒吾科技大學","流行音樂創作系",1,206,"藝術群影視類",""],["5319027","文藻外語大學","應用華語文系",1,206,"外語群英語類","＊英文、專業科目(二)須達本類組均標。\n1.學生除應修畢本系應修之科目與學分數，\n且學業及操行成績均及格外，均需通過本校\n或本系訂定之語言能力檢定標準，始得畢\n業。\n2.課程內容涵蓋課堂討論、口語表達、專題\n製作，並有實習課程，需具人際互動溝通協\n調能力、能控制自身情緒。\n3.全臺灣所有科技大學之中唯一結合系、碩\n士班、華語中心與華語學院四合一的應用華\n語文系，擁有赴美國、日本、法國與東南亞\n等眾多國家的實習機會，提供學生更完整的\n學習系統。本系結合AI 數位等現代科技之運\n用，培育具國際視野以及移動力之人才。"],["5304009","致理科技大學","資訊管理系",1,207,"電機與電子群資電類","＊專業科目(一)、專業科目(二)須達本類組\n均標。\n本系成立宗旨在於培養資訊管理與人工智慧\n相關技術與應用能力之資訊管理專業人才，\n以因應企業組織與社會推展資訊化之需求 ；\n除培育學生科技與管理的專業知識外，並訓\n練學生主動服務、群體合作的胸襟與精神，\n如此方能在科技瞬息萬變的環境中，充分整\n合科技、組織、流程、人力等經營要素，達\n成領導組織創新，提升組織效益與競爭力的\n目標。課程聚焦在網路行銷、程式撰寫、資\n訊安全三大方向，教授也將根據學生的性\n格、興趣、專長，推薦適合學生修讀的學分\n學程、跨系選課、第二外語，幫助學生對自\n己志願有更深層的認識。本系不以理論研究\n為教育方向，而是強調專業技術與實務的結\n合，包含業師授課、專題製作、校外競賽、\n證照考取、職場實習，藉由大量的操作機會\n與產學合作，讓學生畢業就具有善於解決問\n題的職場即戰力，畢業前須符合本系修業條\n件及畢業規範。"],["5310024","致理科技大學","企業管理系",2,207,"商業與管理群","＊國文、英文須達本類組均標。\n本系獲台灣評鑑協會「大專院校教學品保服\n務計畫」5 年又3 個月之認證佳績，另設有碩\n士班(含碩士在職專班)。課程方面以智慧創\n新企劃與專案管理模組、永續經營與人資管\n理模組為本系聚焦專業能力發展之二大主\n軸，跨越傳統企業管理以企業機能為導向的\n課程分流方式。除企業管理專業課程外，亦\n強化外語、專業及資訊能力的證照輔導以及\n實務專題製作、廣告展專業實作訓練，再輔\n以學分學程或微學程選修，培育學生跨領域\n第二專長。本系注重學生實務操作與實習，\n以「畢業即能就業」為目標，打造學生成為\n企業最愛的人才。學生畢業前須符合本系修\n業條件及畢業規範。"],["5310025","致理科技大學","財務金融系",2,208,"商業與管理群","＊英文、專業科目(一)、專業科目(二)須達\n本類組均標。\n本系獲台灣評鑑協會「大專院校教學品保服\n務計畫」5 年又3 個月之認證通過。教學方向\n切合金融產業需求，開設理財規劃與風險管\n理、投資實務、企業財務管理三大模組課\n程，並配合金融科技之最新發展，培育具科\n技應用能力之企業財務或金融人才，且注重\n學生實務操作及實習，畢業前須符合修業條\n件及本系畢業規範。本系學生具有就業率\n高、證照張數高、雇主滿意度高「三高」的\n學習成就，注重學生的全人發展。目前與近\n百家企業簽訂實習合作合約，畢業前須至企\n業進行校外實習，以協助學生適應環境之轉\n變與累積職場實務經驗，能在畢業後擁有就\n業競爭力。"],["5310026","致理科技大學","會計資訊系",2,208,"商業與管理群","＊國文、英文、專業科目(二)須達本類組均\n標。\n本系獲台灣評鑑協會「大專院校教學品保服\n務計畫」5 年又3 個月之認證通過。教育目標\n以品德教育為基礎，以會計與稅務專業實務\n及會計數位應用之人才培育為重心。強調會\n計與稅務專業及數位應用知識之傳授，輔以\n永續及外語能力等專業之培養與訓練，使學\n生不僅具備會計實務所需的專業知識與技\n能，並有能力處理企業之稅務與數位應用等\n問題，協助企業永續管理，成為現代化會\n計、科技與永續專業人才。課程內容規劃除\n加強原有商學系之會計、管理課程外，並配\n合資訊系統導入AI 及數位稽核課程，透過微\n學程導入碳盤查之永續管理課程，以期擴展\n學生的學習領域，提升學生將來就業之競爭\n性。本系著重學生的證照、實務操作及實\n習，畢業前須符合修業條件及本系畢業規\n範。"],["5310027","致理科技大學","行銷與流通管理系",3,208,"商業與管理群","＊國文須達本類組均標。\n本系獲台灣評鑑協會「大專院校教學品保服\n務計畫」5 年又3 個月之認證通過。教育目標\n為培養創新商務應用之優秀行銷與流通管理\n人才，且注重學生實務操作及實習，畢業前\n須符合修業條件及本系畢業規範。課程設計\n重視「理論基礎」與「職場實務應用」，以兩\n模組及跨域微學程為主，包括「行銷企劃與\n科技應用」模組、「智慧流通」模組及跨域微\n學程，結合英語能力、科技應用、校外實習\n等課程，培育學生軟、硬實力兼備。"],["5310028","致理科技大學","休閒遊憩管理系",2,209,"商業與管理群","＊國文、英文須達本類組均標。\n本系獲台灣評鑑協會「大專院校教學品保服\n務計畫」5 年又3 個月之認證。根據產業環境\n分析及市場需求，並結合位於新北市中心的\n優越地理位置，著重培育「永續旅遊」管理\n及「樂活渡假」管理專業人才，據此規劃本\n系專業課程模組及微學程。本系注重學生實\n務操作及實習，畢業前須符合修業條件及本\n系畢業規範。此外，本系合作之實習廠商有\n雄獅旅行社、文華東方酒店、遠東香格里拉\n飯店、晶華酒店、鼎泰豐、吉比鮮釀、典華\n婚宴會館及運動中心等多家國內外知名企\n業，讓學生享有全方位的學習及實習環境。"],["5319004","致理科技大學","應用英語系",2,209,"外語群英語類","＊國文、英文、專業科目(二)須達本類組均\n標。\n本系獲台灣評鑑協會「大專院校教學品保服\n務計畫」5 年又3 個月認證佳績，且注重學生\n實務操作及實習，畢業前須符合修業條件及\n本系畢業規範。依據教學目標訂定課程，為\n提升畢業生就業競爭力，主要課程涵蓋:\n1.強化學生英文聽、說、讀、寫、譯之應用\n能力。\n2.本系開設「國際商務」及「國際服務」模\n組課程，培育學生之專業知能，學生亦可選\n擇國際航空服務學分學程、區域商貿學分學\n程、全英語全球商務與行銷微學程等多種選\n修課程，提供學生進行跨域學習。\n3.實施第二外語訓練，拓廣學生跨文化溝通\n能力。\n4.注重職業道德，結合學術倫理及職場倫理\n教育，提升就業競爭力。"],["5319019","致理科技大學","國際貿易系",1,209,"外語群英語類","＊國文、英文須達本類組均標。\n本系獲台灣評鑑協會「大專院校教學品保服\n務計畫」5 年又3 個月認證佳績，另設有碩士\n班，績效普獲社會各界肯定。我們希望同學\n進入職場都能順利就業，因此本系課程規劃\n依據業界需求，分為「AI MarTech 國際商\n務」與「GB 全球貿易營運」二大模組課程；\n另可按同學興趣，選擇修讀深具特色之永續\n商貿與綠色金融微學程、全英語全球商務微\n學程、東南亞商貿微學程等跨領域特色學程\n與課程，並可協助有意願同學前往企業實\n習、累積實務經驗，訓練學生「畢業即就\n業、上班即上手」，成為數位貿易與電子商務\n所需之專業人才。畢業前須符合修業條件及\n本系畢業規範。"],["5320003","致理科技大學","應用日語系",2,210,"外語群日語類","＊國文、專業科目(二)須達本類組均標。\n本系獲台灣評鑑協會「大專院校教學品保服\n務計畫」5 年又3 個月認證，以培育具備日語\n專業、跨域應用及國際實務能力之人才為目\n標。課程以日語聽、說、讀、寫、譯為核\n心，結合「日語+商貿」、「日語+服務」跨域\n學習，並融入AI 與數位工具應用，培養學生\n多元專業能力。\n本系積極推動國際交流與海外學習，透過日\n本姊妹校交流、短期研修、交換學習及海外\n實習等多元管道，拓展學生國際視野與跨文\n化溝通能力；並結合證照輔導及企業實習，\n強化學生職場實務能力與就業競爭力。學生\n畢業前須符合本系修業條件及畢業規範。"],["5321023","致理科技大學","休閒遊憩管理系",1,210,"餐旅群","＊國文、英文須達本類組均標。\n本系獲台灣評鑑協會「大專院校教學品保服\n務計畫」5 年又3 個月之認證。根據產業環境\n分析及市場需求，並結合位於新北市中心的\n優越地理位置，著重培育「永續旅遊」管理\n及「樂活渡假」管理專業人才，據此規劃本\n系專業課程模組及微學程。本系注重學生實\n務操作及實習，畢業前須符合修業條件及本\n系畢業規範。此外，本系合作之實習廠商有\n雄獅旅行社、文華東方酒店、遠東香格里拉\n飯店、晶華酒店、鼎泰豐、吉比鮮釀、典華\n婚宴會館及運動中心等多家國內外知名企\n業，讓學生享有全方位的學習及實習環境。"],[ 本類組前標。\n需具備自由移動能力。"],["6110082","國立臺灣師範大學","英語學系",1,216,"","＊英文須達本類組頂標。\n1.聽講練習及寫作為本系必修課程，課程內容亦須大\n量英文閱讀、分析圖像資料及使用影音媒體等。\n2.畢業後欲從事教學工作者，應依本校相關規定申請\n修習教育專長課程，並請考量任教因素:\n能在教室內自由移動、獨立操作教具或評量工具能力\n及具備有效聽、說雙向溝通能力。\n3.有關教師資格之取得及服務之權利及義務，悉依師\n資培育法及其相關法令之規定。"],["6110084","國立臺灣師範大學","企業管理學系",1,216,"","＊英文、數學B 須達本類組頂標。\n＊國文須達本類組前標。\n1.本系爲非師資培育學系。\n2.同學須通過本系所規定之外語能力檢定標準，方能\n畢業。"],["6110088","國立臺灣師範大學","教育心理與輔導學系",1,216,"","＊國文、英文須達本類組前標。\n＊數學B 須達本類組均標。"],["6110044","國立成功大學","歷史學系",1,216,"","＊歷史須達本類組前標。\n＊國文須達本類組均標。"],["6110068","國立中興大學","中國文學系",2,216,"","＊國文須達本類組前標。\n＊英文、歷史須達本類組均標。\n本系旨在培養文學創作、教學、研究等項之人才，俾\n能會通古典與現代之學術，具備文學閱讀、詮釋與鑑\n賞之專業知能。網\n址:https://chinese.nchu.edu.tw/，聯絡電話:04-\n22840317#886。"],["6110069","國立中興大學","外國語文學系",1,217,"","＊英文須達本類組頂標。\n＊國文、歷史須達本類組前標。\n1.本系以培養具國際觀的優秀外文(尤其英文)人才為\n教育目標，課程內容多元化，涵蓋英美文學、語言\n學、英語教學及口筆譯等領域。基礎語文課程實施小\n班教學，並提供四種第二外語(日德西法)，歡迎上網\n查詢。\n2.本系網址: https://dfll.nchu.edu.tw/，聯絡電\n話:04-22840322#777。"],["6110070","國立中興大學","企業管理學系",1,217,"","＊英文、數學B 須達本類組前標。\n＊國文須達本類組均標。\n本系網址:https://ba.nchu.edu.tw/，聯絡電話:04-\n22840571#681。"],["6110060","國立中央大學","財務金融學系",1,217,"","＊英文、數學B 須達本類組頂標。\n本系部分必、選修課程採英語授課。"],["6110072","國立中山大學","政治經濟學系",1,217,"","＊國文、英文、數學B 須達本類組均標。\n1.本系課程內容涵蓋討論及報告，聽、說、讀、寫及\n溝通為本系基本能力。\n2.入學本校學士班學生畢業前，需依起始分級先修畢\n「語文素養:英語文」領域必修課程，再修習一門學術\n英文EAP 或專業英文ESP 跨院選修課程，並通過本校\n「英語文能力標準認證」，方得畢業。詳細資料請逕至\n西灣學院/更多資訊/規章表單/學生專區/學士班學生\n英語文能力標準認證。\n3.各項說明若有未盡事宜，悉依本校「學則」及必修\n科目表等相關規定辦理。"],["6110057","國立臺灣海洋大學","海洋法政學士學位學程",2,217,"","＊英文、數學B 須達本類組均標。\n1.本校學士班學生需修習至少1 學期游泳課程，但具\n備免修游泳條件者得申請免修。\n2.本校設有英文能力檢定考試之畢業門檻，未通過\n者，須加修「進階英文(中高級)」課程，且成績及格\n者，始可畢業。\n3.住宿需求:身心障礙生(不限設籍地區)，於住宿申請\n時間內將身心障礙證明影本寄送至住輔組，可辦理床\n位保留作業。"],["6110092","國立中正大學","財務金融學系",2,217,"","＊英文、數學B 須達本類組前標。\n＊國文須達本類組均標。\n1.隨著資訊、金融市場環境的快速變遷及相關法規、\n制度的建立，優秀的財金決策人才必須具備多方面的\n專業知識。本系課程規劃共有10 大學程(含財金英語\n學程)，授課內容理論與實務並重為原則，提供學生就\n業、深造之訓練或報考國內外各項財金證照之知識。\n2.入學本校學士班學生須於畢業前(建議在大三結束\n前)修習「社會實踐課程」(包含實踐6 至10 小時)。\n修習「社會實踐課程」及格者方得畢業。 身心障礙學\n生之「社會實踐課程」內容，得由授課教師依實際情\n形適當調整，特殊狀況者，經通識教育中心同意後，\n得予免修「社會實踐課程」。本項規定若有異動，以學\n生入學時適用之規定為準。"],["6110022","國立高雄師範大學","國文學系",2,218,"","＊國文須達本類組前標。\n＊歷史須達本類組均標。\n1.上課地點:和平校區。\n2.本系為師資與非師資並行學系，入學後可依照本校\n「師資培育甄選及修習教育專業課程辦法」及學系所\n訂相關辦法成為師資生(可至本系網頁查詢)；或依\n「學生修習教育學程辦法」考試錄取後，修習教育學\n程。\n3.本校實施「英語能力檢定」之畢業門檻，學士班學\n生在規定修業年限內，除修滿系所應修學分外，「英語\n能力檢測」必須達到學校規定，方能畢業。\n4.以上說明若有未盡事宜，悉依本校「學則」與相關\n規定辦理。"],["6110043","國立高雄師範大學","特殊教育學系",1,218,"","＊國文、英文、總成績須達本類組均標。\n1.上課地點:和平校區\n2.本系為師資培育學系；入學後可依本校「師資培育\n甄選及修習教育專業課程辦法」及各學系所定相關辦\n法，或依本校「學生修習教育學程辦法」考試錄取\n後，修習教育學程。\n3.本校實施「英語能力檢定」之畢業門檻，學士班學\n生在規定修業年限內，除修滿學系應修學分外，「英語\n能力檢測」必須達到學校規定，方得畢業。\n4.以上說明若有未盡事宜，悉依本校「學則」及相關\n法令規定辦理。"],["6110112","國立高雄師範大學","教育學系",1,218,"","＊國文、英文、數學B 須達本類組均標。\n1.上課地點:和平校區。\n2.本系為師資培育學系；入學後可依本校「師資培育\n生甄選及修習教育專業課程辦法」及各學系所訂相關\n辦法，或依本校「學生修習教育學程辦法」考試錄取\n後，修習教育學程。\n3.本校實施「英語能力檢定」之畢業門檻，學士班學\n生在規定修業年限內，除修滿該學系應修學分外，「英\n語能力檢測」必須達到學校規定，方得畢業。。\n4.以上說明若有未盡事宜，悉依本校「學則」及相關\n法令規定辦理。"],["6110094","國立彰化師範大學","國文學系",2,218,"","＊國文須達本類組前標。\n＊英文、歷史須達本類組均標。\n1.本系學習內容包含文字字形、書法等課程，需具備\n字形閱讀之相關能力。\n2.本校學生可經甄選後修習教育學程，甄選之相關規\n定請參閱本校師資培育中心網站。"],["6110058","國立嘉義大學","應用經濟學系",1,218,"","＊數學B 須達本類組均標。\n＊國文、英文須達本類組後標。\n本校提供大一新生一般宿舍(限戶籍地距離就學校區10\n公里以外之新生)。"],["6110115","國立嘉義大學","景觀學系",1,219,"","＊總成績須達本類組後標。\n1.本系教師教學重視溝通理解及表達能力，學系課程\n須具備相當聽覺功能及口語表達能力，另學生須分組\n討論、書面簡報及戶外實作等。\n2.本校提供大一新生一般宿舍(限戶籍地距離就學校區\n10 公里以外之新生)。"],["6110029","國立高雄大學","財務金融學系",1,219,"","＊國文、英文、數學B 須達本類組均標。\n本系之教育目標在於訓練與培養國際商管專業人才，\n未來多從事金融證券與財務管理相關行業。因此，與\n人之間的互動頻繁，故除了專業的金融知識外，情緒\n管理能力與英文能力亦為本系著重之素養。"],["6110062","國立東華大學","音樂學系",1,219,"","＊須通過西樂類術科考試。\n＊國文須達本類組底標。\n1.主修項目限:鋼琴、聲樂、弦樂(限小提琴、中提\n琴、大提琴、低音提琴)、銅管樂(限法國號、小號、\n長號、低音號)、木管樂(限長笛、雙簧管、單簧管、\n薩克斯管、低音管)、擊樂等樂器別，以上不包含爵士\n組(爵士組為單獨招生)。\n2.本系必修視唱聽寫相關課程，需具備相當聽覺功能"],["6110114","國立東華大學","華文文學與創作學系",1,219,"","＊國文須達本類組均標。"],["6110124","國立東華大學","歷史學系",1,219,"",""],["6110119","國立暨南國際大學","東南亞學系",1,219,"","＊歷史、地理須達本類組均標。\n1.本系為全國唯一國立東南亞學系，學制完整，學、\n碩、博士課程俱全，能給學子開拓性視野及創新性思\n維。\n2.本系網址:https://dseas.ncnu.edu.tw/"],["6110013","國立臺東大學","音樂學系",1,219,"",""],["6110014","國立臺東大學","公共與文化事務學系",1,219,"","＊國文、歷史、地理須達本類組後標。"],["6110015","國立臺東大學","華語
