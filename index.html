平等」、「西歐社會理論與思\n想」等四大領域的特色課程，亦提供種類多樣的獎助\n學金， 據以支持本系學生求學、升學與就業。本系鼓\n勵學生雙主修、參與國際姐妹學校交換計畫，同時也\n推動學生參與國家科學及技術委員會大專生研究計\n畫，及輔導學生參與實習，奠定未來畢業生在行政、\n業務、企劃行銷、人力資源、文化藝文、市場調查、\n教育部門、政府公共事務部門、社會服務部門等工作\n基礎。本系聯絡電話04-23590121 轉36302。其他資訊\n請見http://soc.thu.edu.tw"],["6110021","輔仁大學","法國語文學系",1,221,"","＊英文須達本類組均標。\n1.全球法語人口超過3 億；法國在文學文化藝術、精品\n時尚觀光、外交哲學、新創科技工程等領域享譽國\n際。\n2.課程多元化、學生來源國際化、重視學用合一、鼓勵\n跨領域學習。\n3.法籍教師教授說寫課程，選修課語言結合專業，培育\n學生學以致用。\n4.提供多所姊妹校交換機會，大二以上即可提出申請。\n5.各類工商藝文領域實習機會多，職場競爭力強。\n6.系友於外交、商務、藝文、法/華語教學、新創科\n技、精品時尚等各領域表現傑出。\n7.通過法語鑑定文憑(DELF) B1(含)以上始得畢業。\n8.本校將英文與資訊等二項基本能力列入畢業條件，相\n關規定請於報名前詳閱學系網頁之「修業規則」及本\n校全人教育課程中心網頁「基本素養培育與檢測」專\n區，網\n址:http://www.hec.fju.edu.tw/article.jsp?articleID=93"],["6110055","輔仁大學","教育領導與科技發展學士學位學程",1,221,"","＊國文、英文須達本類組均標。\n本校將英文與資訊等二項基本能力列入畢業條件，相\n關規定請於報名前詳閱學系網頁之「修業規則」及本\n校全人教育課程中心網頁「基本素養培育與檢測」專\n區，網\n址:http://www.hec.fju.edu.tw/article.jsp?articleID=93"],["6110024","東吳大學","中國文學系",1,222,"","＊國文須達本類組均標。\n1.本校有外雙溪及城中兩個校區，外雙溪校區位處山\n坡地，需具備移動能力。\n2.法律學系修業5 年，其餘學系均為4 年。\n3.除須於規定年限內修畢學系規定應修科目與學分\n外，尚須通過校系規定之外語能力、資訊能力及美育\n活動畢業標準，方得畢業；如未通過，本校訂有補救\n措施，協助提昇其能力與素質。\n4.為使學生得以充分運用教學與各項生活資源，法商\n學院一年級新生每週規劃部分課程至 外雙溪校區上\n課。\n5.本校學雜費及獎助學金等資訊，請逕上本校德育中\n心網頁查詢。"],["6110077","中原大學","財經法律學系財貿法組",1,222,"","＊國文、英文、歷史須達本類組後標。\n1.學士班入學學生，必須通過本校認定之英文能力鑑\n定考試，始准予畢業，請詳見「中原大學學生英文畢\n業門檻作業細則」。\n2.本系網址:https://fel.cycu.edu.tw/"],["6110078","中原大學","財經法律學系科技法組",1,222,"",""],["6110030","淡江大學","歐洲語文學系德文組",1,222,"","須通過德語能力檢定測驗(Zertifikat Deutsch B1)，\n始授予學士學位。"],["6110039","淡江大學","歐洲語文學系西文組",2,222,"","通過西語檢定B1 等級，始得畢業；畢業前凡通過西檢\nB2/C1 等級，頒發獎學金。"],["6110040","淡江大學","歐洲語文學系法文組",1,222,"","須通過法語檢定測驗 DELF B1 等級，始授予學士學\n位。"],["6110041","淡江大學","歐洲語文學系俄文組",1,222,"",""],["6110133","淡江大學","歷史學系",1,222,"",""],["6110046","中國文化大學","中國文學系",1,222,"","本系相關資訊、修課規定及畢業條件等請參閱本系網\n頁:https://classic.pccu.edu.tw/。"],["6110047","中國文化大學","日本語文學系",2,222,"","＊國文須達本類組底標。\n本系相關資訊、修課規定及畢業條件等請參閱本系網\n頁:https://japanese.pccu.edu.tw/"],["6110048","中國文化大學","歐美語文學系",1,222,"","本系相關資訊、修課規定及畢業條件等請參閱本系網\n頁https://uidea.pccu.edu.tw/。"],["6110049","中國文化大學","社會福利學系",1,222,"","本系重點在培訓第一線社會工作人員，有大量接觸人\n群的機會，並且學習過程必須至機構進行實務實習，\n因此須具相當的行動力、人際互動、口語表達溝通、\n控管自身情緒及有相當的抗壓能力。\n本系相關資訊、修課規定及畢業條件等請參閱本系網\n頁:https://crydsw.pccu.edu.tw/。"],["6110050","中國文化大學","行政管理學系",2,222,"","＊國文須達本類組底標。\n本系相關資訊、修課規定及畢業條件等請參閱本系網\n頁:https://crylcm.pccu.edu.tw。"],["6110051","中國文化大學","國際企業管理學系",2,222,"","本系相關資訊、修課規定及畢業條件等請參閱本系網\n頁:https://crbbba.pccu.edu.tw/"],["6110053","中國文化大學","會計學系",1,223,"","本系相關資訊、修課規定及畢業條件等請參閱本系網\n頁:https://crbbac.pccu.edu.tw。"],["6110054","中國文化大學","資訊管理學系",1,223,"","＊國文、英文須達本類組後標。\n本系相關資訊、修課規定及畢業條件等請參閱本系網\n頁:https://mis.pccu.edu.tw/。"],["6110131","中國文化大學","教育與學習科技學系",1,223,"","＊國文須達本類組後標。\n＊英文須達本類組底標。\n1.本校座落於陽明山，景觀優美，可俯瞰臺北市景\n色。學校設有資源教室，提供身心障礙學生課業學\n習、校園生活、輔導與諮詢等全方位支持服務，協助\n學生適應大學的生活與學習。本系主要上課地點位於\n綜合體育館，教學空間寬敞，館內設有電梯等無障礙\n設施，提供舒適且便利的學習與移動環境。\n2.本系為師培與非師培並行學系，兼具師資培育與教\n育科技跨域特色，學生可依規定參加師資生甄選，通\n過後修習教育專業課程擔任教師。除教師職涯外，亦\n可朝教育科技、數位學習、人力資源、教育訓練、補\n教產業(非正規師資)及教育行政等多元方向發展，培\n養兼具教育專業與科技應用能力的未來跨域人才。\n3.本系重視「做中學」與實務創新，學生畢業前須完\n成科技輔具設計、教育科技應用及創新教學方案等成\n果之畢業專題。透過從需求發掘、問題分析到設計製\n作與成果展示的完整歷程，培養學生應用科技、跨域\n整合與問題解決能力，強化未來升學與職涯發展的競\n爭力。"],["6110025","逢甲大學","會計學系",1,223,"","本校日間學士班學生在規定修業年限內，修足應修科\n目與學分數(含非本系至少13 學分)，並通過本校及該\n系、學位學程規定之各項考核(畢業條件) 成績合格\n者，始得畢業授予學位。"],["6110027","逢甲大學","合作經濟暨社會事業經營學系",1,223,"",""],["6110028","逢甲大學","經濟學系",1,223,"","＊英文、數學B 須達本類組後標。\n本校日間學士班學生在規定修業年限內，修足應修科\n目與學分數(含非本系至少13 學分)，並通過本校及該\n系、學位學程規定之各項考核(畢業條件) 成績合格\n者，始得畢業授予學位。"],["6110031","逢甲大學","中國文學系",1,223,"","＊國文須達本類組後標。\n1.本校日間學士班學生在規定修業年限內，修足應修\n科目與學分數(含非本系至少13 學分)，並通過本校及\n該系、學位學程規定之各項考核(畢業條件) 成績合格\n者，始得畢業授予學位。\n2.本系學生可修讀「文學與文化創意」、「華語教師」、\n「文物管理與鑑識」學分學程，強化學生跨領域學習\n及實務運用能力。"],["6110033","逢甲大學","都市計畫與空間資訊學系",2,223,"","1.本校日間學士班學生在規定修業年限內，修足應修\n科目與學分數(含非本系至少13 學分)，並通過本校及\n該系、學位學程規定之各項考核(畢業條件) 成績合格\n者，始得畢業授予學位。\n2.本系測量課、實習課程皆採分組制、期中、期末會\n有校外查勘調查之需求。"],["6110032","逢甲大學","外國語文學系",1,224,"","＊英文須達本類組均標。\n1.本校日間學士班學生在規定修業年限內，修足應修\n科目與學分數(含非本系至少13 學分)，並通過本校及\n該系、學位學程規定之各項考核(畢業條件) 成績合格\n者，始得畢業授予學位。\n2.本系課程奠基學生英外語語言與文化能力，並結合\nAI 數位工具，來強化學生人文敘事力；提供國外大學\n雙聯與交換機會；提供國內外專業實習；提供校內跨\n領域選修課程，提升就業競爭力；提供日文、西文等\n第二外語供學生修習；提供外文系學生專屬獎學金。"],["6110034","逢甲大學","運輸與物流學系",2,224,"","＊英文、數學B 須達本類組後標。\n本校日間學士班學生在規定修業年限內，修足應修科\n目與學分數(含非本系至少13 學分)，並通過本校及該\n系、學位學程規定之各項考核(畢業條件) 成績合格\n者，始得畢業授予學位。"],["6110045","靜宜大學","人工智慧應用學系",1,224,"","＊英文、數學B 須達本類組後標。\n本系課程需長時間大量使用電腦輸入程式碼及操作繪\n圖軟體，為更詳盡認識及選擇學系，請務必上網查詢\n課程與簡介(https://aai.pu.edu.tw)。"],["6110052","靜宜大學","英文暨全球事務學系",2,224,"","＊英文須達本類組後標。\n為更詳盡認識及選擇學系，請務必上網查詢課程與簡\n介(https://english.pu.edu.tw/)。"],["6110073","靜宜大學","日本語文學系",1,224,"","＊國文須達本類組後標。\n為更詳盡認識及選擇學系，請務必上網查詢課程與簡\n介(https://japanese.pu.edu.tw/)。"],["6110074","靜宜大學","法律學系",1,224,"","＊國文須達本類組均標。\n1.本系課程主要為講授式，需閱讀大量法學資料。\n2.為更詳盡認識及選擇學系，請務必上網查詢課程與\n簡介(https://law.pu.edu.tw/)。"],["6110075","靜宜大學","人文跨域與應用學系",1,224,"","＊國文須達本類組底標。\n1.本系學習內容除文學、文化課程外，尚有數位與文\n創實作等跨域課程。\n2.為更詳盡認識及選擇學系，請務必上網查詢課程與\n簡介 (https://diha.pu.edu.tw/)。"],["6110102","長庚大學","工商管理學系",1,224,"","＊英文、數學B 須達本類組均標。\n1.本系課程強調人工智慧(AI)應用於企業管理實務，\n涵蓋行銷、財務、生管、人資等核心技能，著重三領\n域1.數智商務2.工商創業3.工業管理。必修課採中、\n英文雙班開課。\n2.本校設有資源教室，關懷與服務身心障礙學生，可\n提供學生課業及生活等方面諮詢服務。\n3.本校學士班學生需通過「英文畢業門檻」及「深耕\n學園」課程，始具畢業資格，相關規定請參考本校語\n文中心及學務處網頁公告。"],["6110080","元智大學","中國語文學系",1,225,"","＊國文須達本類組後標。\n本系在華文文學與文化的基礎上，融合古典與現代，\n提升口語表達、文字創作及AI 數位應用能力，因應產\n業趨勢，培育學生建立跨界視野和格局，歡迎同學踴\n躍報名。"],["6110081","元智大學","應用外語學系",1,225,"","＊英文須達本類組均標。\n本系為台灣第一個英日雙修科系，學生畢業具備英日\n語溝通能力，多數畢業生在國內外公司上班，許多人\n服務於外商或科技公司。大一大二必修課程英日語各\n半，英語方面增進職場實際應用說寫能力，日語方面\n打好基礎。模組課程為專業職場必修模組、選修模組\n二選一:數位跨語或跨文化能力模組。畢業至少英文中\n高級、日文N3 程度或英文中高級、初試日文N2。"],["6110085","義守大學","企業管理學系",1,225,"","1.本系在培養有競爭力之專業經理人與創業家，並聚\n焦於創意廣告與行銷物流、組織領導與人力資源，以\n及企業診斷與創業管理，三個特色管理學程。\n2.課程採用多元教學模式，結合AI 科技、個案研討、\n專題競賽、實務實作與企業實習等，擺脫傳統聽講課\n程設計，並通過AACSB 國際商管認證，教學品質獲世\n界級肯定。\n3.系友遍及各行各業，如創業家、廣告行銷、人力資\n源、工業管理、公職、金融從業人員等。\n4.本系聯絡電話:07-6577711 轉5902，網\n址:ba.isu.edu.tw。"],["6110086","義守大學","會計學系",1,225,"","1.本系教育目標在於透過智慧科技、創新教學及跨域\n整合，培育學生具備管理涵養及國際視野之會計專業\n斜槓人才。\n2.本系2021 年再次通過全球商管教育AACSB 國際認\n證，與實務並重，除會計、稅務、財金與管理等相關\n專業知識傳授外，另設有主題式課群，包含創業實\n務、永續管理、數位金融、智能審計等前瞻知識，並\n積極輔導學生國家考試及取得專業證照，使學生具備\n全人素養與核心跨域專業。\n3.本系重視學用合一，為有效提升職涯發展能力，四\n年級下學期全學期與國際結盟大型會計師事務所等合\n作辦理實習，學生可獲留用之機會。\n4.本系聯絡電話:07-6577711 轉5402，網\n址:acc.isu.edu.tw。"],["6110087","義守大學","醫務管理學系",1,225,"","你是否對醫療健康產業感到興趣?本系希望培養擁有團\n隊合作、創新思維、人文關懷態度的人才，且具備實\n務操作和跨領域整合能力。\n1.本系規劃「醫療機構管理」、「高齡產業管理」、「智\n慧醫療與巨量資料管理」三個特色領域相關課程，融\n入AI 並結合義大醫療體系資源，強化學生就業力。\n2.畢業系友多任職醫療院所、政府衛生行政機構或長\n照機構。可報考醫務管理師、醫療資訊管理師、醫療\n品質管理師、疾病分類員、病歷資訊管理師等證照與\n衛生行政類高普考和公共衛生師國家考試。更多詳情\n請上網healthcare.isu.edu.tw 或電洽07-6151100 轉\n7602。"],["6110116","義守大學","大眾傳播學系",1,226,"","在「全媒體」時代，AI 不僅是工具，更是「跨平台的\n敘事串接者」。作為高屏唯一的傳播科系，本系致力於\n培養數位傳播高手。以AI 為核心，整合舞台、社群、\n短影音與網站，讓學生運用AI 技術產製多元內容。這\n些內容不僅能應用於廣告公關和影視節目，更透過數\n位人文與智慧媒體製播，融入人文視角，創造具備深\n度的創新作品。我們重視傳統傳播知識與文化社會的\n理解，讓學生畢業後能投身數位廣告、AI 內容生成、\n智慧城市資訊傳播或數位策展等領域，成為兼具創意\n與技術的產業人才。本系聯絡電話:07-6577711 轉\n5952，網址:dmc.isu.edu.tw。"],["6110117","義守大學","財務金融管理學系",1,226,"","本系通過AACSB 國際商管認證。\n1.百分百實習就業，本系實習機構達20 家，包括銀行\n業、證券業帶薪實習，並可於畢業前轉為正職。\n2.主題式財務金融課程，輔導取得銀行及證券專業證\n照。\n3.執行金融產學計畫，就業資源豐沛，提供實習外的\n第二層就業保障。本系聯絡電話:07-6577711 轉\n5702，網址:finance.isu.edu.tw。"],["6110118","義守大學","資訊管理學系",2,226,"","1.本系旨在培育人工智慧、行動商務、大數據與智慧\n物聯網產業亟需之專業人才，課程中融入AI 輔助教\n學，輔導同學考取多張國際級專業證照，並與多家資\n訊公司合作，提供實習與就業機會，以期達成「畢業\n即就業」之目標。\n2.本系聯絡電話:07-6577711 轉6552，網址:\nmis.isu.edu.tw。"],["6110121","義守大學","應用日語學系",2,226,"","1.本系設有日本語言文化、日本商業貿易領域，培養\n跨領域且運用AI 之專業日語人才。\n2.有機會赴日交換留學一年，另有機會取得雙聯學\n位。甄選多名赴日本企業實習，另有暑期實習、研修\n機會。\n3.產學合作資源豐富有利就業。對外語以及人文跨域\n學習有興趣者。取得「高級中學學生預修大學第二外\n語課程專班」日語學分或預修大學日語專班學分者，\n依本校規定抵免學分。\n4.學系聯絡電話:07-6577711 轉5562，網址: aj.\nisu.edu.tw。"],["6110126","世新大學","行政管理學系",1,226,"","本校學生除須於修業年限內修畢所屬學系(組)規定之\n應修學分外，尚須依規定通過「英語能力」、「中文能\n力」、「資訊能力」、「思辨表達能力」、「自我管理能\n力」等基本能力課程及學系畢業門檻，方可畢業。"],["6110127","世新大學","經濟學系",1,226,"",""],["6110128","世新大學","企業管理學系",2,226,"",""],["6110129","世新大學","日本語文學系",1,226,"",""],["6110130","世新大學","法律學系",1,226,"",""],["6110056","銘傳大學","應用中文與華語文教學系（桃園校區）",1,227,"","＊國文須達本類組底標。\n1.本系在桃園校區上課。\n2.歡迎對國文教學、華語教學、語文創作、文教傳播\n有興趣的同學就讀。"],["6110093","銘傳大學","應用英語學系（桃園校區）",3,227,"","＊英文須達本類組底標。\n1.本系培養具備商務、教育、口筆譯、觀光知能的英\n語文專業人才。\n2.課程設計著重英語文書寫、溝通及協商能力，系專\n業課程以英語授課。\n3.可申請海外交換生學程、雙學位學程，及至英、\n美、澳、日短期交流 (每年名額至少 40 名 )。\n4.本系設有碩士班及五年一貫的學士碩士學程。\n5.本系位於本校桃園校區。系網址\nhttps://dae.mcu.edu.tw/\n6.學生在校期間需通過英語能力、資訊能力、中文能\n力、運動能力及專業基本能力檢定，始得畢業。未通\n過各項能力檢定者，應參加由各教學單位提出之補救\n教學相關課程，修習合格後，始得畢業。"],["6110113","銘傳大學","金融學系（桃園校區）",2,227,"","＊國文須達本類組底標。\n1.本系在桃園校區上課。\n2.學生在校期間需通過「英語能力」、「資訊能力」、\n「中文能力」、「運動能力」及「專業基本能力」檢\n定，始得畢業。未通過各項能力檢定者，應參加由各\n教學單位提出之補救教學相關課程，修習合格後，始\n得畢業。"],["6110095","實踐大學","企業管理學系（臺北校區）",1,227,"","1.本校諮商中心設有資源教室及輔導老師，提供課業\n及生活諮詢輔導之協助。\n2.本學系培養敬業樂群、兼備理論實務、國際化的服\n務管理人才，須修滿規定學分及通過各項畢業門檻始\n具畢業資格。\n3.因本學系需修習管理學程以及畢業專題等課程，學\n生應具備自我壓力管理能力。"],["6110096","實踐大學","國際企業英語學士學位學程（臺北校區）",1,227,"","＊英文須達本類組底標。\n1.本校諮商中心設有資源教室及輔導老師，提供課業\n及生活諮詢輔導之協助。\n2.學生須於修業年限內修畢本學系組應修學分，並通\n過學校及本學程相關畢業門檻。"],["6110101","高雄醫學大學","醫學社會學與社會工作學系",1,228,"","＊國文、英文須達本類組底標。\n1.本系成立宗旨在培育具有健康照顧跨領域知能之專\n業人才，除基礎社會工作理論與實務技能培養外，亦\n重社會學批判與反思訓練。課程重點包含培訓社會工\n作第一線服務人員，可能有大量接觸人群的機會，需\n具人際互通協調能力、能控管自身情緒、具相當抗壓\n能力。\n2.本校宿舍設有無障礙及低床位寢室，對於入住相關\n無障礙需求，建議先來電洽詢本校生活輔導組(電\n話:07-3121101#2823)或資源教室(電話:07-\n3121101#2121)進行評估與討論。\n3.本校設有無障礙設施，實際使用需求建議選填志願\n前可至校園了解環境。"],["6110089","南華大學","企業管理學系",2,228,"","1.本系以「培養學生就業力」為核心目標，課程聚焦\n經營管理、行銷企劃、創新創業及AI 商業應用，結合\n商管基礎、管理專業與實務應用，透過專題實作、產\n學合作及多元學習，培養學生管理決策、溝通協作與\n問題解決能力，提升未來升學及就業競爭力。\n2.本系重視教育機會平等與多元共融，提供友善且具\n支持性的學習環境，並依學生個別學習需求，結合校\n內相關資源提供適切協助與合理調整，協助學生參與\n課程學習、實務活動及專業發展，順利完成學業並銜\n接未來職涯。\n3.系網:https://bmanagement3.nhu.edu.tw/ 聯絡電\n話:05-2721001 分機 2080~2083。"],["6110090","南華大學","公共管理與法律學系",2,228,"","1.本系以治理與法制為雙主軸，大一不分組大二依興\n趣選擇行政與司法、營利事業與管理兩組，招收對行\n政管理與法律制度有興趣的學生，培養具處理公共與\n法律實務能力的跨域專才。\n2.跨域課程模組帶你掌握政府運作、法律制度、國營\n管理，培養兼具政策分析、法規應用、組織管理及風\n險治理能力之公共服務及法務人才。\n3.資源教室專責輔導學生生活學習(提供課輔與伴讀協\n助)。\n4.備無障礙學生宿舍。\n5.洽詢電話:05-2721001 轉2351，網址\nhttps://iab3.nhu.edu.tw/"],["6110137","真理大學","宗教文化與資訊管理學系",6,228,"","＊國文、歷史須達本類組底標。\n1.本系歡迎對宗教文化、資訊管理、生命關懷、文創\n藝術、組織經營及社會實務有興趣的學生就讀。\n2.本系有課程需要戶外教學或田野調查，學生須具備\n獨自移動能力。\n3.學生可於入學前洽詢本系或資源教室，了解課程、\n學習場域、校園動線、輔具、課業輔導與評量調整等\n支持措施，以共同規劃適切的學習方式。\n4.本系系網https://religion.au.edu.tw/、本系電話\n(02)26292355\n5.本校資源教室電話 (02)2622-2038"],["6110138","大同大學","應用外語學系",1,229,"","＊國文須達本類組均標。\n本校位於臺北市交通便利的精華地段，鄰近臺北車站\n及捷運站，交通便捷。本系以培養具備跨領域能力之\n外語專業人才為教育目標，培養學生成為「1+1+2」，\n即英語及日語雙語能力+2 個專業學程，強化學生之外\n語溝通能力外，亦鼓勵學生跨領域學習，培養多元專\n業能力與就業競爭力。本系上課方式多元，除教師講\n授外，課程亦安排課堂參與、小組討論及口頭報告等\n學習活動，學生需透過與教師及同學互動，培養溝通\n表達、團隊合作及獨立思考能力。學生於修業年限\n內，除須修畢所屬學系規定之應修學分外，亦須完成\n本系所規定之相關畢業門檻，始得畢業。詳細修課及\n畢業相關規定，請依本系最新課程及相關規定辦理。"],["6110107","慈濟大學","國際數位傳播學系",1,229,"","＊國文須達本類組底標。"],["6110108","慈濟大學","兒童發展與家庭教育學系",1,229,"",""],["6110109","慈濟大學","外語暨新興科技應用學系",1,229,"",""],["6110110","慈濟大學","社會工作學系",2,229,"","＊國文須達本類組底標。"],["6110111","慈濟大學","醫務暨健康管理學系",1,229,"",""],["6110100","中山醫學大學","醫學社會暨社會工作學系",3,229,"","＊國文、英文須達本類組底標。\n1.本系教師教學重溝通理解及表達能力，課程著重分\n組討論、口頭與書面報告。\n2.本系有校外實習課程，學生須具備獨立操作能力以\n及個人安全維護能力。\n3.醫社系服務電話:04‐36098741 。"],["6110135","長榮大學","數位媒體設計學系",1,229,"","1.本校設有資源教室，關懷並提供學生課業及生活諮\n詢服務。\n2.本系課程內容包含理論及實作(編排設計、電腦繪\n圖、電腦輔助設計、電腦動畫、數位遊戲設計…等)須\n具備電腦軟體操作及辨別顏色能力。\n3.本系以藝術美學為基礎，結合美藝理論與數位媒體\n之專業實務；應用於廣告商展企劃、視覺設計、包裝\n設計、遊戲設計、數位媒體、網頁設計、2D 與3D 動畫\n等文創與數位媒體產業，培育兼具人文思考、藝術創\n意、美學素養、科技創新，並符合數位科技脈動，契\n合現代社會潮流的數位媒體專業人才。"],["6110136","長榮大學","企業管理學系",1,229,"","本校設有資源教室，關懷並提供學生課業及生活諮詢\n服務。"],["6110017","玄奘大學","應用心理學系",3,230,"","＊國文須達本類組底標。\n1.本系學習內容包含基礎心理學、助人心理學、工商\n心理學與犯罪心理學。凡是對人感興趣者，適合報考\n本系。同時，鼓勵同學跨域學習，培養多元技能。\n2.本校學務處學生輔導暨職涯發展中心設有資源教\n室，提供學生校園生活關懷、課業輔導及生職涯諮詢\n等服務。特殊教育學生應主動提出該障礙類別輔具及\n特殊教育需求。"],["6110018","玄奘大學","應用日語學系",1,230,"","＊國文、總成績須達本類組底標。\n1.本校學務處學生輔導暨職涯發展中心設有資源教\n室，提供學生校園生活關懷、課業輔導及生職涯諮詢\n等服務。特殊教育學生應主動提出該障礙類別輔具及\n特殊教育需求。\n2.本系畢業門檻JLPT(日語檢定考)N2。畢業學分128\n以上，同時過N2 才可。"],["6110023","玄奘大學","法律學系",1,230,"","＊國文須達本類組均標。\n本系提供職涯發展適性輔導，協助同學考取公職或專\n業證照；亦辦理國際交流或移地教學活動，可赴友好\n學校交換或留學，歡迎有志鑽研法律研究或從事實務\n工作者就讀。"],["6110042","玄奘大學","宗教與文化學系",1,230,"","1.師資課程與學術特色:擁有跨文化而多元視角的師資\n與課程，依「宗教」與「文化」兩大核心要素，規畫\n學術與實務分流課程，可提供豐富的實習課程與多元\n的就業機會。\n2.證照輔導:設有(1)全國第一個「宗教文化旅遊學分\n學程」，培養高文化素養，帶領薪酬較高的高端旅遊團\n之導遊、領隊。(2)「禮儀文化」模組課程，培養優質\n禮儀師。\n3.本校設有資源教室，關懷並提供學生課業及生活諮\n詢服務。"],["6110071","亞洲大學","社會工作學系",1,230,"","＊國文須達本類組均標。\n1.本系重視表達與思辯，學習歷程中強調小組討論與\n報告，需具人際互動溝通協調能力、能控管自身情\n緒、具相當之抗壓能力。\n2.本系著重實務，課程包含兩階段校外機構實習課程\n(實習共兩次至少400 小時以上，實習時數依機構規\n定)，需具備好體能、移動能力。\n3.本畢業後除繼續深造外，可於非營利組織或政府部\n門中，從事福利政策規劃、社會工作與社會行政等相\n關工作。"],["6110026","開南大學","資訊管理學系",1,230,"","＊國文須達本類組底標。\n本系教師教學重溝通理解，學生須具備表達能力及電\n腦操作能力。"],["6110106","開南大學","AI 科技與創新設計學士學位學程",1,230,"","＊國文須達本類組底標。\n本系教師教學重溝通理解，學生須具備表達能力及電\n腦操作能力。"],["6110120","佛光大學","傳播學系",1,231,"","1.本校校區位於山坡地，建議選填志願前可至校園了\n解環境。\n2.本系課程重視思考、溝通及表達，並著重分組討\n論、口頭與書面報告，另實作課程需製作影片、廣\n播、音樂等，且多為小組作業，需有良好之人際互\n動。\n3.大四時必須完成「畢業製作」課程之畢業門檻，始\n得畢業。"],["6120024","國立臺灣大學","資訊管理學系",1,231,"","＊英文、數學A、總成績須達本類組頂標。\n本系專業學習重點包含:程式設計與撰寫、電腦操作、\n使用者需求訪談、團隊合作開發資訊系統等，需具相\n當之視覺、聽覺功能及口語表達能力，並具人際互動\n溝通及協調能力。"],["6120025","國立臺灣大學","電機工程學系",1,231,"","＊英文、數學A、物理須達本類組頂標。\n本系實驗課程均須親自操作，基於考量實驗操作危險\n性與結果判定之需要，學生須具備獨立操作能力及個\n人安全維護能力。"],["6120028","國立臺灣師範大學","數學系",1,231,"","＊數學A 須達本類組頂標。\n＊英文、物理須達本類組前標。"],["6120021","國立成功大學","生物醫學工程學系",1,231,"","＊英文、數學A、物理須達本類組前標。"],["6120034","國立成功大學","統計與資料科學學系",1,231,"","＊數學A 須達本類組前標。\n＊國文、英文須達本類組均標。"],["6120019","國立高雄師範大學","數學系數學組",1,231,"","＊數學A 須達本類組頂標。\n＊英文須達本類組均標。\n1.上課地點:燕巢校區。\n2.數學組為師資培育學系(教育課程為必修課程)。\n3.本校實施「英語能力檢定」之畢業門檻，學士班學\n生「英語文能力檢測」必須達到學校規定，方得畢\n業。\n4.以上說明若有未盡事宜，悉依本校「學則」及相關\n法令規定辦理。\""],["6120002","國立彰化師範大學","物理學系物理組",1,231,"","＊數學A、物理須達本類組均標。\n1.本系相當重視實驗課程學習，學生均需在實驗室親\n自操作儀器，應具良好體能，具口語表達溝通能力，\n獨立完成實驗的能力。\n2.本校學生可經甄選後修習教育學程，甄選之相關規\n定請參閱本校師資培育中心網站。"],["6120003","國立彰化師範大學","機電工程學系",1,232,"","＊數學A 須達本類組前標。\n＊物理、總成績須達本類組均標。\n1.本系提供「智慧機電控制」與「智慧光電應用」二\n大領域優質課程，教育學生具備機械、控制、電子、\n光電、奈米與系統整合科技產業之知識，以培育學生\n成為相關產業之優秀人才。\n2.本系提供碩士學位課程先修機制。\n3.本系訂定有逕讀博士學位機制。\n4.本校非所有學生皆可修習教育學程，相關規定請參\n閱本校師資培育中心網站。\n5.本系將與資源教室共同協助學生進行課業及身心等\n相關輔導措施。"],["6120020","國立嘉義大學","資訊管理學系",1,232,"","＊總成績須達本類組均標。\n本校提供大一新生一般宿舍(限戶籍地距離就學校區10\n公里以外之新生)。"],["6120010","國立高雄大學","電機工程學系",1,232,"","＊數學A 須達本類組均標。"],["6120014","國立暨南國際大學","土木工程學系",1,232,"","＊英文、數學A、物理須達本類組均標。\n1.本校校區廣大，宿舍至教學區約1 公里。\n2.本系網址:https://www.ce.ncnu.edu.tw/"],["6120005","國立宜蘭大學","土木工程學系",1,232,"","＊數學A、物理須達本類組均標。\n操作實驗為本系學習之重點，實驗性質課程含有各式\n儀器操作(如:經緯儀、力學儀器、桁架橋模型製作、\n混凝土試驗等)，需配合操作儀器奠定專業知識與實驗\n技能，部分實驗須具備辨別顏色能力，請做為選填時\n之參考。"],["6120023","國立宜蘭大學","資訊工程學系",3,232,"","＊數學A、物理、總成績須達本類組均標。\n本系注重專題研究競賽，本課程重視團隊合作、協調\n溝通，人際相處及情緒管理能力。實驗課程須具備獨\n立計算、獨立實務操作、及個人安全維護能力。"],["6120029","國立宜蘭大學","電子工程學系",1,232,"","＊數學A、物理、總成績須達本類組均標。\n本系發展以「智慧物聯網」、「半導體與積體電路設\n計」及「通訊與信號處理」三個領域為主。培育有志\n於從事電子、資通訊相關高科技產品研發與設計之人\n才。"],["6120026","國立聯合大學","光電工程學系",1,232,"","＊數學A、物理須達本類組均標。"],["6120032","國立聯合大學","能源工程學系",1,232,"","＊數學A、物理須達本類組後標。\n本系課程重視操作實驗及專題實作，操作實驗需親自\n操作儀器設備，學生須依課程要求及實驗室安全規範\n完成相關學習活動。"],["6120013","國立臺南大學","應用數學系",2,232,"","＊數學A 須達本類組均標。\n本系網址 : https://math.nutn.edu.tw/"],["6120033","國立屏東大學","應用數學系",1,232,"","＊總成績須達本類組均標。\n錄取者為非師資培育生，欲修讀教育學程者，可依規\n定提出申請參加遴選，通過者得修習教育學程(含國\n小、特教、幼教等類科)，相關資訊請參\n閱:https://cte.nptu.edu.tw。"],["6120027","中原大學","生物醫學工程學系",1,233,"","＊英文、數學A 須達本類組後標。\n1.本系課程含實驗操作，基於考量實驗操作危險性與\n結果判斷之需要，學生須具備獨立操作能力及個人安\n全維護能力。\n2.本系專題課程，採分組討論。\n3.學士班入學學生，必須通過本校認定之英文能力鑑\n定考試，始准予畢業，請詳見「中原大學學生英文畢\n業門檻作業細則」。\n4.本系網址:https://be.cycu.edu.tw/"],["6120036","中原大學","物理學系光電與材料科學組",1,233,"","＊數學A、物理須達本類組後標。\n1.學士班入學學生，必須通過本校認定之英文能力鑑\n定考試，始准予畢業，請詳見「中原大學學生英文畢\n業門檻作業細則」。\n2.本系網址:https://phys.cycu.edu.tw/"],["6120015","中國文化大學","應用數學系",1,233,"","＊數學A 須達本類組底標。\n本系歡迎對數學有興趣的同學申請。\n本系相關資訊、修課規定及畢業條件等請參閱本系網\n頁:http://crssam.pccu.edu.tw/"],["6120017","中國文化大學","資訊管理學系",1,233,"","＊國文、英文須達本類組後標。\n本系相關資訊、修課規定及畢業條件等請參閱本系網\n頁:https://mis.pccu.edu.tw/。"],["6120018","中國文化大學","資訊傳播學系",1,233,"","＊國文、英文須達本類組底標。\n因應數位匯流與新媒體之發展趨勢，強調科技與人文\n整合，以應用資訊傳播科技進行創意加值之教學研究\n為目標。歡迎有志於傳播科技應用之高中生加入本\n系。相關資訊、修課規定及畢業條件等請參閱本系網\n頁https://ic.pccu.edu.tw/"],["6120031","逢甲大學","通訊工程學系",1,233,"","1.本校日間學士班學生在規定修業年限內，修足應修\n科目與學分數(含非本系至少13 學分)，並通過本校及\n該系、學位學程規定之各項考核(畢業條件) 成績合格\n者，始得畢業授予學位。\n2.通訊工程整合電機、電子與資訊等領域的核心技\n術，以因應資通訊產業的蓬勃發展需求。隨著5G/6G\n與人工智慧技術的持續推進，通訊科技已成為前瞻科\n技發展的重要核心，而具有通訊專業能力的人才，更\n是未來數十年產業最迫切且炙手可熱的需求。本系以\n專業導向為特色，設有「無線通訊」和「數位通訊」\n兩大專業領域，並涵蓋射頻電路與天線、信號處理與\n系統、網路協定與系統等三項子領域，為同學提供多\n元化的學習與發展途徑。同時，配合教學實驗室的實\n作課程，致力於培養學生兼具寬廣視野與跨領域整合\n能力之專業素養。"],["6120009","逢甲大學","航太與系統工程學系",1,233,"","＊物理須達本類組後標。\n本校日間學士班學生在規定修業年限內，修足應修科\n目與學分數(含非本系至少13 學分)，並通過本校及該\n系、學位學程規定之各項考核(畢業條件) 成績合格\n者，始得畢業授予學位。"],["6120004","逢甲大學","人工智慧技術與應用學士學位學程",1,234,"","本校日間學士班學生在規定修業年限內，修足應修科\n目與學分數(含非本系至少13 學分)，並通過本校及該\n系、學位學程規定之各項考核(畢業條件) 成績合格\n者，始得畢業授予學位。"],["6120006","逢甲大學","應用數學系",1,234,"",""],["6120011","逢甲大學","土木工程學系",2,234,"",""],["6120012","逢甲大學","水利工程與資源保育學系",2,234,"",""],["6120035","長庚大學","數位金融科技學系",1,234,"","＊國文、英文、數學A 須達本類組均標。\n1.本系旨在為普惠金融，提供社會大眾平等、永續的\n金融服務為使命，培養兼具數位資訊與金融專長之跨\n領域專業人才。\n2.為落實理論與實務相結合，提供資訊科技、財務金\n融及數量方法的整合課程訓練，以迎合數位金融相關\n產業發展的新契機。\n3.本校設有資源教室，關懷與服務身心障礙學生，可\n提供學生課業及生活等方面諮詢服務。\n4.本校學士班學生需通過「英文畢業門檻」及「深耕\n學園」課程，始具畢業資格，相關規定請參考本校語\n文中心及學務處網頁公告。"],["6120030","實踐大學","資訊管理學系（高雄校區）",1,234,"","＊數學A 須達本類組底標。\n1.學生除須於修業年限內修畢所屬學系組應修學分\n外，「英語文畢業能力指標」等畢業門檻必須達到學校\n規定。\n2.培養物聯網應用、人工智慧、雲端應用、資訊安全\n人才，課程內容以實用生活導向。\n大四時可至國內企業實習並有廠商優先錄用機會；透\n過專題和參加全國性比賽訓練實務與表達能力；安排\n專任教師針對證照及課程輔導，畢業前取得1 門以上\n專業證照。\n3.欲從事資訊工作，宜具備自我管理及情緒調適能\n力。"],["6120001","高雄醫學大學","醫務管理暨醫療資訊學系",1,234,"","＊國文、英文、數學A 須達本類組底標。\n1.本學系為醫藥衛生相關學系，課程或實習具實務操\n作及與人直接互動的特性，學生必備相當之視覺、聽\n覺、辨色力、行動、口語溝通及情緒管理能力，以因\n應日後職場醫療服務或實驗研究所需。\n2.本校宿舍設有無障礙及低床位寢室，對於入住相關\n無障礙需求，建議先來電洽詢本校生活輔導組(電\n話:07-3121101#2823)或資源教室(電話:07-\n3121101#2121)進行評估與討論。\n3.本校設有無障礙設施，實際使用需求建議選填志願\n前可至校園了解環境。"],["6130005","國立中興大學","植物病理學系",1,235,"","＊英文、化學、生物須達本類組均標。\n1.本系核心實驗課程(如:真菌學、植物線蟲學、植物\n細菌學、植物病毒學...等)，因課程需要，學生於就\n學期間，須具備並學習操作儀器、配置藥劑、使用顯\n微鏡、色彩判定、團隊溝通、移動身軀遠離危險、能\n控制自身情緒，具相當之抗壓能力。\n2.本系網址:https://www.pp.nchu.edu.tw/，聯絡電\n話:04-22840780#323。"],["6130009","國立中興大學","昆蟲學系",1,235,"","＊生物須達本類組前標。\n＊英文須達本類組均標。\n1.本系實驗性質課程含有各式儀器操作(如:普通昆蟲\n學實習、昆蟲生理學實習等)，須具備儀器操作之能\n力。\n2.本系以昆蟲學、生命科學、農業科學及生態學為基\n礎，培育具昆蟲學、生命科學、農學、植物防疫及檢\n疫、病媒與環境衛生昆蟲以及生物多樣性、生態保育\n等學識之科學研究與實務能力之專業高階人才。\n3.本系網址:https://www.entomol.nchu.edu.tw/，聯\n絡電話:04-22840361#524。"],["6130006","國立中正大學","心理學系",1,235,"","＊國文、英文、數學A 須達本類組均標。\n1.因本系有多門心理學實驗課程及部分課程以分組方\n式進行，故需具有實驗操作及溝通能力，且具備自我\n管理與情緒適應能力。\n2.入學本校學士班學生須於畢業前(建議在大三結束\n前)修習「社會實踐課程」(包含實踐6 至10 小時)。\n修習「社會實踐課程」及格者方得畢業。身心障礙學\n生之「社會實踐課程」內容，得由授課教師依實際情\n形適當調整，特殊狀況者，經通識教育中心同意後，\n得予免修「社會實踐課程」。本 立屏東科技大學","社會工作系",1,237,"電機與電子群資電類","1.本校訂有學生英文能力畢業門檻，於三年級上\n學期開學前須參加一次具公信力之語言測驗機構\n舉辦之外語能力測驗，仍無法通過第二點所列測\n驗之一者，得於三年級上學期起修習本校開設之\n「外語實務訓練」系列課程，或繼續參加外語能\n力檢定測驗。\n2.各項說明若有未盡事宜，悉依本校「學則」\n及各系相關規定辦理。"],["6319005","國立臺北科技大學","應用英文系",1,237,"外語群英語類","＊英文、專業科目(二)、總成績須達本類組均\n標。\n1.本校針對本項甄試管道入學之新生，於暑假辦\n理「新生轉銜座談暨個別化支持計畫會議」與\n「新生輔導營」，提供入學前生活與學習適應。\n2.本校實施英文畢業門檻與校外實習必修。\n3.開設「適應體育班」，提供經體育室評估後具\n有特殊教育需求之肢體障礙生選修。\n4.配合本校邁向國際優質科技大學之目標，各系\n部分必、選修課程採全英語授課。\n5.本校設有跨領域學習畢業條件。"],["6304017","國立臺北科技大學","工業工程與管理系",1,238,"電機與電子群資電類","＊總成績須達本類組均標。\n1.本系重視閱讀、聽講、溝通理解及表達能力，\n課程重視團隊協調與合作，並需參與業界實務實\n習。\n2.本校針對本項甄試管道入學之新生，於暑假辦\n理「新生轉銜座談暨個別化支持計畫會議」與\n「新生輔導營」，提供入學前生活與學習適應。\n3.本校實施英文畢業門檻與校外實習必修。\n4.開設「適應體育班」，提供經體育室評估後具\n有特殊教育需求之肢體障礙生選修。\n5.配合本校邁向國際優質科技大學之目標，各系\n部分必、選修課程採全英語授課。\n6.本校設有跨領域學習畢業條件。"],["6310051","國立臺北科技大學","經營管理系",1,238,"商業與管理群","＊總成績須達本類組均標。\n1.本系多數課程進行方式為課堂討論、小組報\n告，須具備團隊合作和溝通能力以及語文聽說讀\n寫能力。\n2.本校針對本項甄試管道入學之新生，於暑假辦\n理「新生轉銜座談暨個別化支持計畫會議」與\n「新生輔導營」，提供入學前生活與學習適應。\n3.本校實施英文畢業門檻與校外實習必修。\n4.開設「適應體育班」，提供經體育室評估後具\n有特殊教育需求之肢體障礙生選修。\n5.配合本校邁向國際優質科技大學之目標，各系\n部分必、選修課程採全英語授課。\n6.本校設有跨領域學習畢業條件。"],["6303006","國立虎尾科技大學","光電工程系",1,238,"電機與電子群電機類","1.本校設有資源教室，提供身心障礙學生在學期\n間特殊教育輔導與服務措施，協助身心障礙學生\n克服學習問題與困難，並提供學習及生活相關諮\n詢。\n2.於暑假期間開設新生暑期先修班課程(為期六\n週，免學費)，安排入住學校宿舍，讓新生提早\n到校適應新的學習與生活環境。\n3.本校重視學生英語能力的培養，各系組依其發\n展領域均訂有相關規定藉以強化學生將來之升學\n與就業優勢。"],["6304023","國立虎尾科技大學","電子工程系",1,238,"電機與電子群資電類","＊專業科目(一)、專業科目(二)須達本類組均\n標。\n1.本校設有資源教室，提供身心障礙學生在學期\n間特殊教育輔導與服務措施，協助身心障礙學生\n克服學習問題與困難，並提供學習及生活相關諮\n詢。\n2.於暑假期間開設新生暑期先修班課程(為期六\n週，免學費)，安排入住學校宿舍，讓新生提早\n到校適應新的學習與生活環境。\n3.本校重視學生英語能力的培養，各系組依其發\n展領域均訂有相關規定藉以強化學生將來之升學\n與就業優勢。"],["6310057","國立虎尾科技大學","企業管理系",2,239,"商業與管理群","＊數學(B)須達本類組均標。\n1.本校設有資源教室，提供身心障礙學生在學期\n間特殊教育輔導與服務措施，協助身心障礙學生\n克服學習問題與困難，並提供學習及生活相關諮\n詢。\n2.於暑假期間開設新生暑期先修班課程(為期六\n週，免學費)，安排入住學校宿舍，讓新生提早\n到校適應新的學習與生活環境。\n3.本校重視學生英語能力的培養，各系組依其發\n展領域均訂有相關規定藉以強化學生將來之升學\n與就業優勢。"],["6304026","國立澎湖科技大學","海洋遊憩系",1,239,"電機與電子群資電類","＊國文、英文、總成績須達本類組均標。\n需具備良好的行動能力與獨立實務操作能力。"],["6310064","國立澎湖科技大學","海洋遊憩系",1,239,"商業與管理群","＊國文、英文、總成績須達本類組均標。 1,248,"動力機械群",""],["6410001","國立臺東專科學校","園藝暨景觀科",1,248,"商業與管理群",""],["7110032","國立政治大學","傳播學院大一大二不分系",2,249,"","＊國文、英文須達本類組前標。\n本院上課教室及實驗單位分別座落於本校山上、山下\n校區。本院課程重視團隊合作、溝通理解及表達能\n力。教學採分組討論，著重實務操作及報告。上課時\n會上下山移動，需具有基本體能與移動能力。"],["7110059","國立政治大學","中國文學系",1,249,"","＊國文須達本類組頂標。\n＊英文、歷史須達本類組均標。"],["7110088","國立政治大學","阿拉伯語文學系",1,249,"","＊英文須達本類組頂標。\n＊國文、總成績須達本類組前標。\n因課程以語文教學為主，需具備：\n1.溝通互動之能力。\n2.視覺辨識字體差異之能力(尤其是點點的數量與位\n置)，聽力能辨別細微發音差異以及清晰之口語表達能\n力。\n3.持續學習之專注力與記憶力以克服阿語之困難及豐\n富性。"],["7110041","國立臺灣大學","社會學系",1,249,"","＊國文、英文、數學B 須達本類組頂標。"],["7110042","國立臺灣大學","工商管理學系企業管理組",1,249,"","＊英文、數學B 須達本類組頂標。\n＊總成績須達本類組前標。"],["7110043","國立臺灣大學","會計學系",1,249,"","＊英文、數學B 須達本類組頂標。\n＊總成績須達本類組前標。"],["7110044","國立臺灣大學","國際企業學系",1,249,"","＊數學B 須達本類組頂標。\n＊英文須達本類組前標。\n＊總成績須達本類組均標。"],["7110045","國立臺灣大學","法律學系司法組",1,249,"","＊國文、英文、數學B 須達本類組頂標。"],["7110049","國立中興大學","歷史學系",2,249,"","＊國文、英文、歷史須達本類組均標。\n1.本系教育目標在於培養學生從事研究、教學與文化\n傳播事業所需之歷史知識，歡迎對歷史有興趣的年輕\n人加入我們的行列。\n2.本系網址:https://www.history.nchu.edu.tw/，聯\n絡電話:04-22840324#553。"],["7110050","國立中興大學","行銷學系",1,249,"","＊國文、英文、數學B 須達本類組頂標。\n1.本系學科修讀期間需使用電腦，與同儕間進行團隊\n合作，進行口語報告及溝通，需具人際溝通協調能\n力。\n2.本系網址:https://marketing.nchu.edu.tw/，聯絡\n電話:04-22840392#792。"],["7110046","國立中山大學","外國語文學系",1,250,"","＊國文、英文須達本類組頂標。\n1.聽、說及口語表達為學習外語之基本能力，亦為本\n系培訓重點之一。\n2.本系學區位於半山坡處，往返交通路程依山而修，\n較為蜿蜒曲折，需小心慢行。\n3.本系學士班學生於畢業前，於「語文素養」之「英\n語文」必修學分，以及「跨院選修」之「學術/專業英\n文課程」選修學分須依本系必修科目表之修課規定修\n習，並通過本系規定之「英語文能力標準認證」(含英\n文檢定標準及補救措施等相關規定)，方得畢業。\n4.各項說明若有未盡事宜，悉依本校「學則」及必修\n科目表等相關規定辦理。"],["7110052","國立中山大學","劇場藝術學系",1,250,"","＊國文須達本類組均標。\n1.本系旨在培養劇場研究與演出、創作專業人才，除\n了理論課程之外，仍有大量劇場實作參與，因參與演\n出及製作之專業性訓練，需具備一般之視覺、聽、\n說、口語表達能力及肢體運動能力，表導演課程需涉\n及大量內在探索、肢體動作與課後排練，設計課程包\n含部分工廠實習與機具操作。\n2.本學系為師資培育學系。\n3.入學本校學士班學生畢業前，需依起始分級先修畢\n「語文素養:英語文」領域必修課程，再修習一門學術\n英文EAP 或專業英文ESP 跨院選修課程，並通過本校\n「英語文能力標準認證」，方得畢業。詳細資料請逕至\n西灣學院/更多資訊/規章表單/學生專區/學士班學生\n英語文能力標準認證。\n4.各項說明若有未盡事宜，悉依本校「學則」及必修\n科目表等相關規定辦理。"],["7110066","國立中正大學","外國語文學系",1,250,"","＊英文須達本類組前標。\n＊國文須達本類組均標。\n入學本校學士班學生須於畢業前(建議在大三結束前)\n修習「社會實踐課程」(包含實踐6 至10 小時)。修習\n「社會實踐課程」及格者方得畢業。 身心障礙學生之\n「社會實踐課程」內容，得由授課教師依實際情形適\n當調整，特殊狀況者，經通識教育中心同意後，得予\n免修「社會實踐課程」。本項規定若有異動，以學生入\n學時適用之規定為準。"],["7110031","國立高雄師範大學","特殊教育學系",1,250,"","＊國文、英文、總成績須達本類組均標。\n1.上課地點:和平校區\n2.本系為師資培育學系；入學後可依本校「師資培育\n甄選及修習教育專業課程辦法」及各學系所定相關辦\n法，或依本校「學生修習教育學程辦法」考試錄取\n後，修習教育學程。\n3.本校實施「英語能力檢定」之畢業門檻，學士班學\n生在規定修業年限內，除修滿學系應修學分外，「英語\n能力檢測」必須達到學校規定，方得畢業。\n4.以上說明若有未盡事宜，悉依本校「學則」及相關\n法令規定辦理。"],["7110086","國立東華大學","華文文學與創作學系",1,251,"","＊國文須達本類組均標。"],["7110092","國立東華大學","臺灣文化學系",2,251,"","＊歷史、地理須達本類組均標。\n本系課程重溝通理解與表達，其中包含如參與觀察、\n深度訪談等校外田野調查課程，須具相當溝通協調與\n移動能力。"],["7110022","國立暨南國際大學","中國語文學系",1,251,"","＊國文須達本類組均標。\n＊歷史須達本類組後標。"],["7110023","國立暨南國際大學","經濟學系",1,251,"","＊數學B 須達本類組均標。"],["7110089","國立暨南國際大學","教育政策與行政學系",1,251,"","＊國文須達本類組均標。\n1.本系擁有學、碩、博士班完整學制，強調將教育政\n策與行政研究應用於課程教學創新，注重教育行政實\n習，結合專業理論與實務經驗，培養教育行政人才。\n學生生涯發展以升學、公務員、教師及公、民營機構\n四大取向為主。\n2.就讀本系成績優異者可申請五年內取得學、碩士學\n位。\n3.本系網址:https://epa.ncnu.edu.tw/\n4.聯絡方式:049-2910960 分機2762，E-\nmail:epa@ncnu.edu.tw。"],["7110003","國立臺東大學","音樂學系",1,251,"",""],["7110005","國立臺東大學","公共與文化事務學系",1,251,"","＊國文、歷史、地理須達本類組後標。"],["7110006","國立臺東大學","身心整合與運動休閒產業學系",1,251,"","21 世紀在「運動」與「健康」主軸因素驅動下，建構\n優質運動休閒環境及提高全民健康意識。本系為順應\n全球產業趨勢，是全國唯一整合身心學與運動休閒管\n理專業師資，培養理論與實務兼備運動休閒管理人\n才。本系課程包括各類術科與肢體操作，游泳為必修\n課程，並有大量體適能相關課程，且須參與業界實務\n實習。"],["7110009","國立臺東大學","英美語文學系",4,251,"","＊英文須達本類組底標。"],["7110008","國立宜蘭大學","休閒產業與健康促進學系",1,251,"","＊國文須達本類組均標。\n本系課程包含休閒運動管理等操作器材之需求，因此\n需具有相當之視覺功能及移動能力。"],["7110071","國立宜蘭大學","應用經濟與管理學系",1,251,"","＊總成績須達本類組均標。\n本系課程重視團隊合作、協調溝通，並需參與業界實\n務實習，學生需具備人際相處及情緒管理能力。"],["7110085","國立宜蘭大學","外國語文學系",2,251,"","＊英文須達本類組均標。\n本系課程中需閱讀大量書面資料，並以口語進行表達\n及演練，課程大多著重分組討論及報告。"],["7110055","國立聯合大學","臺灣語文與傳播學系",2,251,"",""],["7110062","國立金門大學","企業管理學系",1,251,"","＊總成績須達本類組均標。"],["7110064","國立金門大學","社會工作學系",1,251,"","＊總成績須達本類組均標。"],["7110097","國立金門大學","應用英語學系",1,251,"","＊總成績須達本類組均標。"],["7110040","國立臺灣體育運動大學","運動資訊與傳播學系",3,252,"","＊國文、英文、數學B 須達本類組後標。\n1.本系為培育運動資訊傳播專業人才，需具備口語表\n達、溝通能力，轉播工作需久站、運用肢體操作攝影\n機等設備。\n2.具人際互動溝通協調能力、能控管自身情緒、具相\n當之抗壓能力。\n3.體育術科:本校訂有校訂必修游泳課程，院訂必修田\n徑課程各1 學分課程，另訂系選修術科5 學分。"],["7110065","東海大學","外國語文學系",2,252,"","＊國文、英文須達本類組後標。\n本系教學重視閱讀、聽講、溝通理解及表達能力，口\n說課程著重分組及口頭報告。"],["7110010","東吳大學","英文學系",1,252,"","＊英文須達本類組前標。\n＊國文須達本類組均標。\n1.本校有外雙溪及城中兩個校區，外雙溪校區位處山\n坡地，需具備移動能力。\n2.法律學系修業5 年，其餘學系均為4 年。\n3.除須於規定年限內修畢學系規定應修科目與學分\n外，尚須通過校系規定之外語能力、資訊能力及美育\n活動畢業標準，方得畢業；如未通過，本校訂有補救\n措施，協助提昇其能力與素質。\n4.為使學生得以充分運用教學與各項生活資源，法商\n學院一年級新生每週規劃部分課程至 外雙溪校區上\n課。\n5.本校學雜費及獎助學金等資訊，請逕上本校德育中\n心網頁查詢。\n6.本系課程著重溝通理解與表達能力，須具備相當視\n覺、聽覺、口語表達能力以及人際互動合作協調能\n力。"],["7110017","淡江大學","財務金融學系",1,252,"","＊英文、數學B 須達本類組後標。\n本系採行多元教學方式，培養學生獨立思考和解決問\n題之分析能力，並提供企業實習課程，提高理論實務\n應用能力。"],["7110019","淡江大學","歐洲語文學系德文組",1,252,"","須通過德語能力檢定測驗(Zertifikat Deutsch B1)，\n始授予學士學位。"],["7110026","淡江大學","歐洲語文學系西文組",2,252,"","通過西語檢定B1 等級，始得畢業；畢業前凡通過西檢\nB2/C1 等級，頒發獎學金。"],["7110027","淡江大學","歐洲語文學系法文組",1,252,"","須通過法語檢定測驗 DELF B1 等級，始授予學士學\n位。"],["7110028","淡江大學","歐洲語文學系俄文組",2,252,"",""],["7110030","淡江大學","中國文學學系",1,252,"",""],["7110100","淡江大學","歷史學系",1,252,"",""],["7110015","逢甲大學","合作經濟暨社會事業經營學系",1,252,"","本校日間學士班學生在規定修業年限內，修足應修科\n目與學分數(含非本系至少13 學分)，並通過本校及該\n系、學位學程規定之各項考核(畢業條件)成績合格\n者，始得畢業授予學位。"],["7110016","逢甲大學","統計學系",1,253,"","本校日間學士班學生在規定修業年限內，修足應修科\n目與學分數(含非本系至少13 學分)，並通過本校及該\n系、學位學程規定之各項考核(畢業條件) 成績合格\n者，始得畢業授予學位。"],["7110018","逢甲大學","企業管理學系",1,253,"",""],["7110020","逢甲大學","外國語文學系",2,253,"","＊英文須達本類組均標。\n1.本校日間學士班學生在規定修業年限內，修足應修\n科目與學分數(含非本系至少13 學分)，並通過本校及\n該系、學位學程規定之各項考核(畢業條件) 成績合格\n者，始得畢業授予學位。\n2.本系課程奠基學生英外語語言與文化能力，並結合\nAI 數位工具，來強化學生人文敘事力；提供國外大學\n雙聯與交換機會；提供國內外專業實習；提供校內跨\n領域選修課程，提升就業競爭力；提供日文、西文等\n第二外語供學生修習；提供外文系學生專屬獎學金。"],["7110021","逢甲大學","土地管理學系",1,253,"","＊國文須達本類組後標。\n本校日間學士班學生在規定修業年限內，修足應修科\n目與學分數(含非本系至少13 學分)，並通過本校及該\n系、學位學程規定之各項考核(畢業條件) 成績合格\n者，始得畢業授予學位。"],["7110033","靜宜大學","大眾傳播學系",1,253,"","＊國文須達本類組後標。\n1.本系為傳播相關科系，實作課程學習包含:影像拍\n攝、剪輯後製、採訪、團隊合作等面向，因此需具備\n相當之視覺、聽覺辨識、口語表達與溝通、器材操\n作、移動能力，以及人際互動溝通協調能力。\n2.為更詳盡認識及選擇學系，請務必上網查詢課程與\n簡介(https://masscom.pu.edu.tw/)。"],["7110036","靜宜大學","生態人文學系",2,253,"","＊國文須達本類組底標。\n1.本系課程包含野外調查實習課，需具較佳之體能及\n移動能力。\n2.為更詳盡認識及選擇學系，請務必上網查詢課程與\n簡介(https://eco.pu.edu.tw/)。"],["7110091","靜宜大學","資料科學暨大數據分析與應用學系",1,253,"","＊數學B 須達本類組後標。\n1.本系發展主軸為人工智慧與資料科學(大數據)。\n2.為更詳盡認識及選擇學系，請務必上網查詢課程與\n簡介(https://ds.pu.edu.tw/)。"],["7110057","義守大學","大眾傳播學系",1,253,"","在「全媒體」時代，AI 不僅是工具，更是「跨平台的\n敘事串接者」。作為高屏唯一的傳播科系，本系致力於\n培養數位傳播高手。以AI 為核心，整合舞台、社群、\n短影音與網站，讓學生運用AI 技術產製多元內容。這\n些內容不僅能應用於廣告公關和影視節目，更透過數\n位人文與智慧媒體製播，融入人文視角，創造具備深\n度的創新作品。我們重視傳統傳播知識與文化社會的\n理解，讓學生畢業後能投身數位廣告、AI 內容生成、\n智慧城市資訊傳播或數位策展等領域，成為兼具創意\n與技術的產業人才。本系聯絡電話:07-6577711 轉\n5952，網址:dmc.isu.edu.tw。"],["7110058","義守大學","資訊管理學系",2,254,"","1.本系旨在培育人工智慧、行動商務、大數據與智慧\n物聯網產業亟需之專業人才，課程中融入AI 輔助教\n學，輔導同學考取多張國際級專業證照，並與多家資\n訊公司合作，提供實習與就業機會，以期達成「畢業\n即就業」之目標。\n2.本系聯絡電話:07-6577711 轉6552，網址:\nmis.isu.edu.tw。"],["7110087","義守大學","企業管理學系",1,254,"","1.本系在培養有競爭力之專業經理人與創業家，並聚\n焦於創意廣告與行銷物流、組織領導與人力資源，以\n及企業診斷與創業管理，三個特色管理學程。\n2.課程採用多元教學模式，結合AI 科技、個案研討、\n專題競賽、實務實作與企業實習等，擺脫傳統聽講課\n程設計，並通過AACSB 國際商管認證，教學品質獲世\n界級肯定。\n3.系友遍及各行各業，如創業家、廣告行銷、人力資\n源、工業管理、公職、金融從業人員等。\n4.本系聯絡電話:07-6577711 轉5902，網\n址:ba.isu.edu.tw。"],["7110061","銘傳大學","金融科技應用學系（桃園校區）",2,254,"","1.本系在桃園校區上課，研究所在台北校區上課，實\n習銜接就業，實務與學術並重。\n2.金融科技為跨領域整合學習，課程共分為「創新基\n礎」、「數位金融」、「資訊科學」、「媒體市場」、「法制\n監理」五大專業，使學生具備多工專才之能力。\n3.學生在校期間需通過「英語能力」、「資訊能力」、\n「中文能力」、「運動能力」及「專業基本能力」檢定\n後，始得畢業。\n4.歡迎各位有興趣的學子報考，有任何問題請來\n電:03-3507001 #5269。"],["7110072","銘傳大學","應用英語學系（桃園校區）",2,254,"","＊英文須達本類組底標。\n1.本系培養具備商務、教育、口筆譯、觀光知能的英\n語文專業人才。\n2.課程設計著重英語文書寫、溝通及協商能力，系專\n業課程以英語授課。\n3.可申請海外交換生學程、雙學位學程，及至英、\n美、澳、日短期交流 (每年名額至少 40 名 )。\n4.本系設有碩士班及五年一貫的學士碩士學程。\n5.本系位於本校桃園校區。系網址\nhttps://dae.mcu.edu.tw/\n6.學生在校期間需通過英語能力、資訊能力、中文能\n力、運動能力及專業基本能力檢定，始得畢業。未通\n過各項能力檢定者，應參加由各教學單位提出之補救\n教學相關課程，修習合格後，始得畢業。"],["7110078","銘傳大學","諮商臨床與工商心理學系（桃園校區）",1,255,"","1.本系課程重視溝通理解及表達能力，著重分組討\n論、口頭及書面報告。\n2.本系在桃園校區上課。\n3.學生在校期間需通過校外機構實習 240 小時，「英語\n能力」、「資訊能力」、「中文能力」、「體能力」及「專\n業基本能力」檢定者，始得畢業。未通過各項能力檢\n定者，應參加由各教學單位提出之補救教學相關課\n程，修習合格後，始得畢業。"],["7110068","實踐大學","金融管理學系（高雄校區）",1,255,"","＊國文須達本類組底標。\n1.學生除須於修業年限內修畢所屬學系組應修學分\n外，「語文畢業能力指標」等畢業門檻必須達到學校規\n定。\n2.本系特色:\n(1)大一每20 名有二位熱忱導師。\n(2)老師課後義務輔導。\n(3)大一可考取2 張以上專業證照。\n(4)大四帶薪全台實習，畢業可留用。\n3.本校諮商中心設有資源教室及輔導老師，提供課業\n及生活諮詢輔導之協助。"],["7110074","實踐大學","會計學系（臺北校區）",2,255,"","＊國文、英文須達本類組底標。\n1.本校諮商中心設有資源教室及輔導老師，提供課業\n及生活諮詢輔導之協助。\n2.學生須於修業年限內修畢本學系組應修學分，並通\n過本系規定之專業能力畢業門檻。"],["7110075","實踐大學","財務金融學系（臺北校區）",1,255,"",""],["7110094","真理大學","音樂應用學系",5,255,"","音樂應用學系提供四個模組給熱愛音樂的你加入，包\n含演奏演唱、流行音樂、藝術行政與音樂療育。組別\n靈活應用，可依興趣申請轉組，增加同學對音樂的更\n多理解。詳細介紹請參考本系網\n站:https://music.au.edu.tw 或洽(02)26212121 轉\n1788 或5366。"],["7110095","真理大學","應用日語學系",8,255,"","＊國文、英文須達本類組底標。\n1.聽、說、讀、寫、譯是學習外語的基本能力，也是\n本系培養學生的核心。透過扎實的語言能力訓練，進\n一步結合日本經貿、觀光、教育等跨域專業知識，培\n養學生多元能力，提升畢業後的就業競爭力。\n2.本系相關資訊請參照本系系網，本系網址:\nhttps://japanese.au.edu.tw/"],["7110096","真理大學","企業管理學系",5,255,"","＊國文須達本類組底標。\n1.本系相關資訊請參閱系網頁\n( https://ba.au.edu.tw/ )\n2.本系之教育目標在於培育企業經營管理之實務專業\n人才；要求學生要能有人際溝通與團隊合作技能，可\n以獨立思考與創新能力，課程內容涵蓋課堂討論、報\n告撰寫與實作。"],["7110098","真理大學","法律學系",10,256,"","＊國文須達本類組底標。\n1.對於法律有興趣，並具有維護公平正義、扶助社會\n上受害人與弱勢者之心志者。\n2.本系系網:https://law.au.edu.tw/。\n3.連絡電話:02-26212121 轉1797、4322。\n4.系主任信箱:au4322@mail.au.edu.tw。"],["7110099","真理大學","國際經營與貿易學系",6,256,"","1.本系以培育具有健全人格特質、人文關懷素養、宏\n遠國際觀、英日外語溝通能力、國際經營與經貿等專\n業人才。\n2.相關資訊請參閱學系網頁:\nhttps://itrade.au.edu.tw/"],["7110105","真理大學","財務金融學系",6,256,"","1.本系定位在培育基層金融人才，使學生畢業時能具\n備金融倫理道德素養及金融知識。\n2.相關資訊請參閱財務金融學系網頁:fb.au.edu.tw"],["7110084","慈濟大學","兒童發展與家庭教育學系",2,256,"",""],["7110101","長榮大學","國際企業學系",2,256,"","本校設有資源教室，關懷並提供學生課業及生活諮詢\n服務。"],["7110102","長榮大學","會計資訊學系",4,256,"","1.本校設有資源教室，提供諮詢服務與輔導關懷，使\n學生在大學求學階段皆可獲得完善的個別化支持服\n務。\n2.本系培育學用合一、術德兼備之會計專業人才，並\n著重證照考試相關課程，增進就業能力。畢業生可參\n加會計師、記帳士或公職考試、進入會計師事務所、\n記帳士事務所、一般企業、政府機關或非營利組織機\n構服務。\n3.本系畢業生在各行各業均深受肯定，並有多位傑出\n會計師系友與記帳士系友。歡迎對會計及電腦有興趣\n的同學報考。\n4.本系聯絡電話:06-2785123 轉2201 (週一至週五\n8:10 至17:10)。"],["7110103","長榮大學","航運管理學系",4,256,"","＊國文須達本類組底標。\n本校諮商中心備有資源教室，關懷並提供學生課業及\n生活諮詢服務。"],["7110104","長榮大學","大眾傳播學系",3,256,"","1.本校設有資源教室，關懷並提供學生課業及生活諮\n詢服務。\n2.學系特色:本系是南台灣第一所大眾傳播學系，致力\n培養多元傳播技能與AI 應用的專業人才。課程涵括影\n音、廣告、行銷、社群、新聞、播客、AI 創作等傳播\n領域。\n3.學系介紹:(1).本系豐富多元的領域，鼓舞每一位學\n生展現自我特長，贏得最佳化發展。(2).本系師資榮\n獲國際56 座大獎，指導學生鼎級的拍片技能，應用在\n職場無往不利!(3). 培育學生具備AI 實力創造優勢。\n(4). 本系著重「學用合一」關懷學生實務學習，提供\n媒體實習機會。期待每一位學生都能創造屬於自己精\n彩的學習成果!連絡電話:06-2785123 轉4101，網\n址:https://dweb.cjcu.edu.tw/gimc。"],["7110007","玄奘大學","應用心理學系",2,257,"","＊國文須達本類組底標。\n1.本系學習內容包含基礎心理學、助人心理學、工商\n心理學與犯罪心理學。凡是對人感興趣者，適合報考\n本系。同時，鼓勵同學跨域學習，培養多元技能。\n2.本校學務處學生輔導暨職涯發展中心設有資源教\n室，提供學生校園生活關懷、課業輔導及生職涯諮詢\n等服務。特殊教育學生應主動提出該障礙類別輔具及\n特殊教育需求。"],["7110029","玄奘大學","宗教與文化學系",2,257,"","1.師資課程與學術特色:擁有跨文化而多元視角的師資\n與課程，依「宗教」與「文化」兩大核心要素，規畫\n學術與實務分流課程，可提供豐富的實習課程與多元\n的就業機會。\n2.證照輔導:設有(1)全國第一個「宗教文化旅遊學分\n學程」，培養高文化素養，帶領薪酬較高的高端旅遊團\n之導遊、領隊。(2)「禮儀文化」模組課程，培養優質\n禮儀師。\n3.本校設有資源教室，關懷並提供學生課業及生活諮\n詢服務。"],["7110048","亞洲大學","資訊傳播學系",2,257,"","＊總成績須達本類組均標。\n1.本校設有資源教室，關懷並提供學生課業及生活諮\n詢服務。\n2.本系教師教學重溝通理解及表達能力、分組討論，\n課程著重實務及實習教學，並有專題製作、報告作\n業。\n3.具備電腦操作能力者。"],["7110053","亞洲大學","財經法律學系",1,257,"","＊國文、歷史須達本類組底標。\n1.為配合社會對科技法律人才之迫切需要、及改善科\n技法律風險之不確定性，本系科法組，課程均以因應\n時代之需求並提供學生專業之就業機會而規劃。本組\n畢業生除從事科技法律業之相關工作外，亦可參加國\n家司法人員考試(司法官、律師)、法制人員、記帳\n士、會計師等專技人員考試，或選擇進入研究所深\n造，發展機會寬廣。\n2.本學系課程專業須具備自我學習，惟因本系需校外\n實習，需依實習單位安排時間，自行前往。\n3.本系相關資訊、修課規定及畢業條件等請參閱本系\n網頁:https://fel.asia.edu.tw。"],["7110012","開南大學","應用英語學系",1,257,"","＊英文須達本類組底標。\n聽、說及口語表達為學習外語之基本能力。"],["7110013","開南大學","AI 科技與創新設計學士學位學程",1,257,"","＊國文須達本類組底標。\n本系教師教學重溝通理解，學生須具備表達能力及電\n腦操作能力。"],["7110039","開南大學","休閒與運動管理學系",1,257,"","＊歷史、地理須達本類組底標。\n本系培養休閒服務管理人才，課程重點包括培養現場\n休閒活動指導人員，可能會有接觸人群機會，需具人\n際互動溝通能力，能控管自身情緒。"],["7110106","開南大學","電影與傳播媒體學系",3,258,"","＊歷史須達本類組底標。\n本系教學著重劇組拍攝，適合有實務操作意願、良好\n的移動力(能出外景等)、具備團隊精神與人際互動溝\n通協調能力者。"],["7110073","佛光大學","傳播學系",3,258,"","1.本校校區位於山坡地，建議選填志願前可至校園了\n解環境。\n2.本系課程重視思考、溝通及表達，並著重分組討\n論、口頭與書面報告，另實作課程需製作影片、廣\n播、音樂等，且多為小組作業，需有良好之人際互\n動。\n3.大四時必須完成「畢業製作」課程之畢業門檻，始\n得畢業。"],["7110076","佛光大學","資訊應用學系",1,258,"","1.本校位處山坡地，建議選填志願前可至校園了解環\n境。\n2.本系需完成「專題實作」課程，始得畢業。"],["7110079","佛光大學","人工智慧技術與應用學士學位學程",1,258,"",""],["7110077","佛光大學","建築環境設計學士學位學程",1,258,"","本校位處山坡地，建議選填志願前可至校園了解環\n境。"],["7110090","佛光大學","語文學系",2,258,"","1.本校位處山坡地，建議選填志願前可至校園了解環\n境。\n2.本系有規劃聽力、閱讀、寫作以及口語表達能力之\n課程，可提升學生自主學習能力。"],["7120015","國立清華大學","計量財務金融學系",1,258,"","＊國文、英文、數學A 須達本類組頂標。"],["7120013","國立臺灣大學","化學系",1,258,"","＊數學A、物理、化學須達本類組頂標。\n能親自組裝器材、量取藥品、操作儀器以進行實驗為\n本系訓練學習之重點。部分實驗結果之判別需要辨色\n能力。實驗室環境亦需要在意外狀況下，能迅速離開\n之行動能力。"],["7120016","國立臺灣大學","工程科學及海洋工程學系",1,258,"","＊英文、數學A、物理須達本類組頂標。\n本系網址:https://www.esoe.ntu.edu.tw。"],["7120017","國立臺灣大學","工商管理學系科技管理組",1,258,"","＊英文、數學A 須達本類組頂標。\n＊總成績須達本類組前標。"],["7120022","國立中興大學","物理學系一般物理組",1,258,"","＊數學A、物理須達本類組頂標。\n＊英文須達本類組前標。\n1.本系具有必修實驗課程，實驗課程需動手操作儀\n器，並與其他學生師長充分溝通與互動。\n2.本系網址:https://www.phys.nchu.edu.tw/，聯絡\n電話:04-22840427#622。"],["7120023","國立中興大學","土木工程學系",1,259,"","＊數學A、物理須達本類組前標。\n＊英文須達本類組均標。\n1.本系學科經常要操作儀器設備、電腦繪圖及資料搜\n索、野外實習，需上山下海勘查，攀爬鷹架架設儀器\n等。\n2.本系主要培養土木工程通才為主，理論與實務並\n重，學以致用為目的，並著重基礎學科的培育及工程\n應用學科(結構工程、水利工程、大地工程、測量資\n訊、營建管理等)的訓練。本系部分課程為英語授課，\n以強化學生國際競爭力。\n3.本系網址:https://www.ce.nchu.edu.tw/，聯絡電\n話:04-22840437#221。"],["7120024","國立中興大學","電機工程學系",1,259,"","＊英文、數學A、物理須達本類組前標。\n1.本系實驗性質課程含有各式儀器操作(如:電工實\n驗、電機機械實驗、微電子實驗、基本通訊實驗、自\n動控制實驗等)，學生需具備獨立操作及個人安全維護\n能力。\n2.本系課程含資訊與通訊、人工智慧、控制、綠能、\nIC 設計、光電與半導體等，學生可依個人興趣選修專\n業學程。教學特色:一流師資、齊全的研究設備、與中\n科高科技產業緊密的產學合作。\n3.本系網址:https://www.ee.nchu.edu.tw/，聯絡電\n話:04-22840688#415。"],["7120030","國立陽明交通大學","電機工程學系",1,259,"","＊英文、數學A、物理須達本類組頂標。\n本系課程含實驗操作，基於考量實驗操作危險性與結\n果判斷之需要，學生須具備獨立操作能力及個人安全\n維護能力。"],["7120025","國立中山大學","物理學系",1,259,"","＊英文、數學A、物理須達本類組前標。\n1.操作實驗為本系學習之重點，部份實驗需要團隊一\n起完成，必須有基本溝通協調的能力且能透過親自操\n作儀器奠定基礎專業知識與實驗技能。\n2.入學本校學士班學生畢業前，需依起始分級先修畢\n「語文素養:英語文」領域必修課程，再修習一門學術\n英文EAP 或專業英文ESP 跨院選修課程，並通過本校\n「英語文能力標準認證」，方得畢業。詳細資料請逕至\n西灣學院/更多資訊/規章表單/學生專區/學士班學生\n英語文能力標準認證。\n3.各項說明若有未盡事宜，悉依本校「學則」及必修\n科目表等相關規定辦理。"],["7120037","國立中山大學","機械與機電工程學系",1,260,"","＊英文、數學A、物理須達本類組均標。\n1.本系修課領域含熱流、固力、自動控制、設計製\n造、微奈米系統，強調基礎理論學習，重視實務及工\n程上之應用，強化工程學識、實務技能及團隊合作能\n力。\n2.課程含實驗操作，考量實驗操作危險性與結果判斷\n之需要，學生須具有獨立操作能力及個人安全維護能\n力。\n3.入學本校學士班學生畢業前，需依起始分級先修畢\n「語文素養:英語文」領域必修課程，再修習一門學術\n英文EAP 或專業英文ESP 跨院選修課程，並通過本校\n「英語文能力標準認證」，方得畢業。詳細資料請逕至\n西灣學院/更多資訊/規章表單/學生專區/學士班學生\n英語文能力標準認證。\n4.各項說明若有未盡事宜，悉依本校「學則」及必修\n科目表等相關規定辦理。"],["7120032","國立中正大學","物理學系",1,260,"","＊英文、數學A、物理須達本類組均標。\n1.本系因課程需要，學生於就學期間須具備並學習操\n作儀器、移動身軀遠離危險、能控管自身情緒、具相\n當之抗壓能力。\n2.入學本校學士班學生須於畢業前(建議在大三結束\n前)修習「社會實踐課程」(包含實踐6 至10 小時)。\n修習「社會實踐課程」及格者方得畢業。 身心障礙學\n生之「社會實踐課程」內容，得由授課教師依實際情\n形適當調整，特殊狀況者，經通識教育中心同意後，\n得予免修「社會實踐課程」。本項規定若有異動，以學\n生入學時適用之規定為準。"],["7120014","國立高雄師範大學","電機工程學系",2,260,"","＊數學A 須達本類組頂標。\n＊英文、物理須達本類組前標。\n1.上課地點:燕巢校區。\n2.本系屬電機工程相關類科(含實驗操作課程)，非師\n資培育學系；有意從事教職者，入學後可依本校『學\n生修習教育學程辦法』考試錄取後，修習教育學程。\n3.本校實施「英語能力檢定」之畢業門檻，學士班學\n生在規定修業年限內，「英語能力檢測」必須達到學校\n規定，方得畢業。\n4.以上說明若有未盡事宜，悉依本校「學則」及相關\n法令規定辦理。"],["7120035","國立高雄師範大學","軟體工程與管理學系",1,260,"","＊數學A 須達本類組均標。\n1.上課地點:燕巢校區。\n2.本系屬工程與資訊相關類科(含實驗操作課程)，非\n師資培育學系；有意從事教職者，入學後可依本校\n『學生修習教育學程辦法』考試錄取後，修習教育學\n程。\n3.本校實施「英語能力檢定」之畢業門檻，學士班學\n生在規定修業年限內，「英語能力檢測」必須達到學校\n規定，方得畢業。\n4.以上說明若有未盡事宜，悉依本校「學則」及相關\n法令規定辦理。"],["7120038","國立高雄師範大學","電子工程學系",1,261,"","＊數學A 須達本類組頂標。\n＊英文、物理須達本類組前標。\n1.上課地點:燕巢校區。\n2.本系屬工程相關類科(含實驗操作課程)，非師資培\n育系所，有意從事教職者，入學後可依本校『學生修\n習教育學程辦法』考試錄取後，修習教育學程。\n3.本校實施「英語能力檢定」之畢業門檻，學士班學\n生在規定修業年限內，「英語能力檢測」必須達到學校\n規定，方得畢業。\n4.以上說明若有未盡事宜，悉依本校「學則」及相關\n法令規定辦理。"],["7120011","國立臺北大學","統計學系",1,261,"","＊國文、英文、數學A 須達本類組均標。"],["7120003","國立宜蘭大學","生物機電工程學系",1,261,"","＊數學A、物理須達本類組均標。\n1.本系招收對工程與生物科技有興趣的學生，培育成\n能整合機電工程科技應用於工業及生物產業的工程人\n才。\n2.操作實習為本系重點課程，學生均需透過親自操作\n儀器奠定基礎專業知識與實習技能，部分儀器需透過\n色彩判定操作。而操作實習具有一定危險性，需有能\n力即時移動身軀避開危險。"],["7120029","國立宜蘭大學","電子工程學系",1,261,"","＊數學A、物理、總成績須達本類組均標。\n本系發展以「智慧物聯網」、「半導體與積體電路設\n計」及「通訊與信號處理」三個領域為主。培育有志\n於從事電子、資通訊相關高科技產品研發與設計之人\n才。"],["7120036","國立宜蘭大學","環境工程學系",1,261,"","＊數學A、化學、總成績須達本類組均標。\n因實驗課程涉及相關實驗設備、耗材之操作使用，需\n運用良好視覺、辨色力、行動能力及溝通能力，及個\n人安全維護能力。"],["7120026","中原大學","物理學系物理組",1,261,"","＊數學A、物理須達本類組後標。\n1.學士班入學學生，必須通過本校認定之英文能力鑑\n定考試，始准予畢業，請詳見「中原大學學生英文畢\n業門檻作業細則」。\n2.本系網址:https://phys.cycu.edu.tw/"],["7120007","逢甲大學","工業工程與系統管理學系",1,261,"","＊數學A 須達本類組均標。\n本校日間學士班學生在規定修業年限內，修足應修科\n目與學分數(含非本系至少13 學分)，並通過本校及該\n系、學位學程規定之各項考核(畢業條件)成績合格\n者，始得畢業授予學位。"],["7120006","逢甲大學","機械與電腦輔助工程學系",1,261,"","本校日間學士班學生在規定修業年限內，修足應修科\n目與學分數(含非本系至少13 學分)，並通過本校及該\n系、學位學程規定之各項考核(畢業條件)成績合格\n者，始得畢業授予學位"],["7120040","逢甲大學","自動控制工程學系",1,261,"",""],["7120041","逢甲大學","通訊工程學系",1,261,"",""],["7120042","逢甲大學","航太與系統工程學系",1,262,"","＊物理須達本類組後標。\n本校日間學士班學生在規定修業年限內，修足應修科\n目與學分數(含非本系至少13 學分)，並通過本校及該\n系、學位學程規定之各項考核(畢業條件)成績合格\n者，始得畢業授予學位。"],["7120027","義守大學","材料科學與工程學系",1,262,"","1.本系通過IEET 國際認證，提供學生多樣性跨域課程\n包含: X +AI、半導體、奈米科技、綠色工程及鋼鐵等\n學程，同學可申請預修生五年內完成學/碩士學位。\n2.本系為中南部少數擁有完整規模實驗室(高解析電子\n顯微鏡、物性、薄膜、光電等)之系所，課程連結半導\n體S 廊道及義联集團等資源，提供學生豐富的實習及\n就業機會。\n3.本系畢業系友廣布服務於半導體、光電、綠能、金\n屬、生醫、航太等產業，表現優異，薪資待遇及加薪\n幅度皆名列工程領域前茅。\n4.本系聯絡電話:07-6577711 轉3102，網\n址:mse.isu.edu.tw。"],["7120033","實踐大學","資訊科技與通訊學系（高雄校區）",1,262,"","＊國文須達本類組底標。\n1.專業學習重點有「App 設計」、「人工智慧應用設計」\n和「智慧機器人與無人機」。\n2.通過國際工程教育學會IEET 認證，畢業生受美加紐\n澳英等多國認可。\n3.提供國內外產業實習機會，大三暑假職場體驗，大\n四全年帶薪實習。\n4.在學成績前25%，推薦進入國立知名資訊相關研究所\n5.校友就業調查，本系畢業生平均每月薪資40K 以\n上。"],["7120034","實踐大學","資訊管理學系（高雄校區）",3,262,"","＊數學A 須達本類組底標。\n1.學生除須於修業年限內修畢所屬學系組應修學分\n外，「英語文畢業能力指標」等畢業門檻必須達到學校\n規定。\n2.培養物聯網應用、人工智慧、雲端應用、資訊安全\n人才，課程內容以實用生活導向。\n大四時可至國內企業實習並有廠商優先錄用機會；透\n過專題和參加全國性比賽訓練實務與表達能力；安排\n專任教師針對證照及課程輔導，畢業前取得1 門以上\n專業證照。\n3.欲從事資訊工作，宜具備自我管理及情緒調適能\n力。"],["7120039","真理大學","財務金融學系",6,262,"","1.本系定位在培育基層金融人才，使學生畢業時能具\n備金融倫理道德素養及金融知識。\n2.相關資訊請參閱財務金融學系網頁:fb.au.edu.tw"],["7120019","亞洲大學","資訊工程學系",1,262,"","＊總成績須達本類組均標。\n1.本校設有資源教室，關懷並提供學生課業及生活諮\n詢服務。\n2.本系教師教學重溝通理解及表達能力、分組討論，\n課程著重實務及實習教學，並有專題製作、報告作\n業。\n3.具備電腦操作能力。"],["7130005","國立政治大學","心理學系",1,263,"","＊國文、英文、數學A 須達本類組均標。"],["7130008","國立臺灣大學","植物病理與微生物學系",1,263,"","＊英文、化學、生物須達本類組頂標。\n本系部分學習內容須透過顯微鏡來觀察植物之形態、\n組織及病徵，須具備有色彩觀察及辨識能力。"],["7130018","國立臺灣大學","生物產業傳播暨發展學系",1,263,"","＊國文、英文須達本類組前標。\n＊數學A 須達本類組均標。\n本系網址:https://bicd.ntu.edu.tw/。"],["7130009","國立中興大學","昆蟲學系",1,263,"","＊生物須達本類組前標。\n＊英文須達本類組均標。\n1.本系實驗性質課程含有各式儀器操作(如:普通昆蟲\n學實習、昆蟲生理學實習等)，須具備儀器操作之能\n力。\n2.本系以昆蟲學、生命科學、農業科學及生態學為基\n礎，培育具昆蟲學、生命科學、農學、植物防疫及檢\n疫、病媒與環境衛生昆蟲以及生物多樣性、生態保育\n等學識之科學研究與實務能力之專業高階人才。\n3.本系網址:https://www.entomol.nchu.edu.tw/，聯\n絡電話:04-22840361#524。"],["7130010","國立中興大學","生物科技學士學位學程",1,263,"","＊英文、化學、生物須達本類組前標。\n1.因實驗課程必須親自操作危險化學藥品並判讀結\n果，故須可久站且能穩定操作實驗。\n2.本學程教育宗旨為培育能自我學習及能對農業、環\n境、醫藥、工業等領域進行科際整合的生物科技人\n才。課程涵蓋植物生技、動物生技、微生物生技、生\n物資訊暨生醫機電、智財暨行銷管理等跨領域課程。\n3.本學程網址:https://bpbiot.nchu.edu.tw/，聯絡\n電話:04-22840811#536。"],["7130011","國立中興大學","國際農企業學士學位學程",1,263,"","＊英文須達本類組頂標。\n1.本學程採全英文授課，以語言訓練課程、生態學、\n土壤與作物學、以及微積分為基礎，培育具備農企業\n管理、永續發展規劃、生物多樣性、生態保育及農林\n生態旅遊知識的高階、具國際視野之專業人才。\n2.本學程網址:\nhttps://nchuibpa.simplesite.com/，聯絡電話:04-\n22840849#526。"],["7130013","國立中山大學","生物醫學科技學系全英語學士班",1,263,"","＊國文、英文、數學A 須達本類組均標。\n1.本系部份課程需實驗操作，請考生衡量。\n2.入學本校學士班學生畢業前，需依起始分級先修畢\n「語文素養:英語文」領域必修課程，再修習一門學術\n英文EAP 或專業英文ESP 跨院選修課程，並通過本校\n「英語文能力標準認證」，方得畢業。詳細資料請逕至\n西灣學院/更多資訊/規章表單/學生專區/學士班學生\n英語文能力標準認證。\n3.各項說明若有未盡事宜，悉依本校「學則」及必修\n科目表等相關規定辦理。"],["7130012","國立中山大學","生物科學系",1,264,"","＊生物須達本類組前標。\n＊數學A、化學須達本類組均標。\n1.本系學習內容包含普通生物學(含實驗)、生物化\n學、遺傳學、動植物生理學、分子生物學、生物技術\n實驗等核心相關課程，須具備辨色能力。\n2.本系課程含實驗操作，基於考量實驗操作危險性與\n結果判斷之需要，學生須具備獨立操作能力及個人安\n全維護能力。\n3.入學本校學士班學生畢業前，需依起始分級先修畢\n「語文素養:英語文」領域必修課程，再修習一門學術\n英文EAP 或專業英文ESP 跨院選修課程，並通過本校\n「英語文能力標準認證」，方得畢業。詳細資料請逕至\n西灣學院/更多資訊/規章表單/學生專區/學士班學生\n英語文能力標準認證。\n4.各項說明若有未盡事宜，悉依本校「學則」及必修\n科目表等相關規定辦理。"],["7130014","中原大學","心理學系",1,264,"","＊國文、英文、數學A 須達本類組後標。\n1.學士班入學學生，必須通過本校認定之英文能力鑑\n定考試，始准予畢業，請詳見「中原大學學生英文畢\n業門檻作業細則」。\n2.本系網址:https://psy.cycu.edu.tw/"],["7130015","義守大學","醫學科學與生物科技學系",3,264,"","1.本系含實驗性質課程，學生於就學期間，需具備團\n隊溝通、操作儀器、配置藥劑、使用顯微鏡、色彩判\n定、移動身軀遠離危險之能力。\n2.本系位於醫學院區，聯絡電話:07-6151100 轉\n7302，網址: bst.isu.edu.tw。"],["7130016","義守大學","生物醫學工程學系",1,264,"","1.本系以培育生物醫學工程專業人才為目標，為南台\n灣第一所設立之生物醫學工程學系，並設有碩士班。\n2.本系規劃生醫電子暨醫學資訊、生醫材料暨組織工\n程、生物力學暨福祉科技等特色領域，並開設校外實\n習課程，配合國家政策，整合AI 人工智慧技術與醫療\n器材產業發展，培養學生具跨域創新實務經驗，以提\n升學生就業競爭力。\n3.本系位於醫學院區，歡迎有志投身醫學科技與醫療\n器材產業的同學報考。聯絡電話:07-6151100 轉\n7453，網址:bme.isu.edu.tw。"],["7130002","中國醫藥大學","醫學檢驗生物技術學系",1,264,"","＊化學、生物須達本類組均標。\n1.本系課程重視實驗與操作，學生於就學期間須學習\n操作儀器、配製藥劑、使用顯微鏡，部分實驗需透過\n色彩判定進行結果分析。部分化學實驗具有一定危險\n性，學生需具備即時移動身軀以遠離危險之能力。學\n生均須親自操作實驗或儀器，以奠定專業知識與實驗\n技能。實習期間須與病患及醫療團隊進行溝通，建立\n醫病關係。適合細心沉穩、具人際互動與溝通協調能\n力、能控管自身情緒，並具相當抗壓能力者。\n2.一年級新生在北港分部上課，二年級起在台中英才\n校區上課。\n3.本系網址:https://cmumt.cmu.edu.tw/\n4.學系聯絡電話:04-22053366 分機7201。\n5.聯絡E-mail:aca07@mail.cmu.edu.tw"],["7130003","中國醫藥大學","中國藥學暨中藥資源學系",2,265,"","＊國文、英文須達本類組均標。\n1.一年級新生在北港分部上課，二年級起在台中英才\n校區上課。\n2.學系聯絡電話:04-22053366 分機5201\n3.網址:https://cmuscmr.cmu.edu.tw/\n4.聯絡E-mail:aca20@mail.cmu.edu.tw"],["7130004","中國醫藥大學","藥用化妝品學系",1,265,"","＊英文、化學、生物須達本類組均標。\n1.一年級新生在北港分部上課，二年級起在台中校本\n部上課。\n2.學系聯絡電話:04-22053366 分機5301。\n3.網址:https://cmuscc.cmu.edu.tw/\n4.聯絡E-mail:aca80@mail.cmu.edu.tw"],["7201001","輔英科技大學","職業安全衛生系",1,265,"共同類",""],["7308007","國立雲林科技大學","視覺傳達設計系",2,265,"設計群","＊須通過美術類術科考試。\n＊專業科目(一)、專業科目(二)、總成績須\n達本類組前標。\n1.本系課程含視聽、手繪、美工切割器材、\n機具之操作。\n2.本校設有資源教室，主要關懷與服務身心\n障礙學生，可提供學生課業及生活等方面諮\n詢服務。"],["7310088","國立虎尾科技大學","企業管理系",2,265,"商業與管理群","＊數學(B)須達本類組均標。\n1.本校設有資源教室，提供身心障礙學生在\n學期間特殊教育輔導與服務措施，協助身心\n障礙學生克服學習問題與困難，並提供學習\n及生活相關諮詢。\n2.於暑假期間開設新生暑期先修班課程(為\n期六週，免學費)，安排入住學校宿舍，讓\n新生提早到校適應新的學習與生活環境。\n3.本校重視學生英語能力的培養，各系組依\n其發展領域均訂有相關規定藉以強化學生將\n來之升學與就業優勢。"],["7308047","國立虎尾科技大學","休閒遊憩系",1,266,"設計群","1.本校設有資源教室，提供身心障礙學生在\n學期間特殊教育輔導與服務措施，協助身心\n障礙學生克服學習問題與困難，並提供學習\n及生活相關諮詢。\n2.於暑假期間開設新生暑期先修班課程(為\n期六週，免學費)，安排入住學校宿舍，讓\n新生提早到校適應新的學習與生活環境。\n3.本校重視學生英語能力的培養，各系組依\n其發展領域均訂有相關規定藉以強化學生將\n來之升學與就業優勢。"],["7318015","國立虎尾科技大學","休閒遊憩系",1,266,"農業群",""],["7321069","國立虎尾科技大學","休閒遊憩系",1,266,"餐旅群",""],["7310063","國立勤益科技大學","健康產業科技研發與管理系",1,266,"商業與管理群","＊總成績須達本類組均標。\n1.本系課程重視溝通理解及表達能力。\n2.本系課程含實務技術操作，基於考量實務\n設備操作危險性與結果判斷之需要，學生須\n具備獨立操作能力及個人安全維護力。\n3.本系另訂有專業證照畢業門檻。\n4.本系修課標準需符合國立勤益科技大學\n116 學年度日間部四年制健康產業科技研發\n與管理系學分計畫表之規定。\n5.凡本管道入學新生，本校優先提供工讀機\n會。"],["7310091","國立臺北商業大學","會計資訊系",1,266,"商業與管理群","＊專業科目(二)須達本類組頂標。\n＊國文、英文須達本類組前標。\n需依規定於畢業前通過本系「學生英語能\n力」及「專業能力」畢業門檻，方得畢業。"],["7320007","國立高雄科技大學","應用日語系",1,266,"外語群日語類","＊國文、英文、專業科目(二)須達本類組均\n標。\n1.本校實施畢業門檻，學生需通過校共同必\n修及通識課程與本系所訂定條件及通過相當\n日語能力檢定N1 考試，成績及格後方准畢\n業。相關規定請參閱本校共同教育課程實施\n辦法、語言教學實施要點、共同教育課程結\n構規劃表及本系網站\n(https://jp.nkust.edu.tw/)查詢。\n2.聽、說、讀、寫、譯等技能為學習之基本\n能力，亦為本系培養學生之重點。\n3.本系教師教學重溝通理解及表達能力。\n4.具備電腦操作能力。\n5.上課地點為第一校區。\n6.本校五校區皆設有資源教室，關懷與協助\n身心障礙學生，提供課業及生活等方面的諮\n詢協助。"],["7301016","朝陽科技大學","工業工程與管理系",3,266,"機械群","1.本系大一有實習工廠實作。\n2.本校「勞作教育」列為校訂必修課程，本\ <script>
const {rows, arts, groups} = JSON.parse(document.getElementById('data').textContent);
const byId = id => document.getElementById(id);
const dis = byId('dis'), route = byId('route'), exam = byId('exam');
const group = byId('group'), query = byId('query'), art = byId('art');
const labels = ['第一類組','第二類組','第三類組','第四類組'];
const disabilities = ['視覺障礙','聽覺障礙','腦性麻痺','自閉症','學習障礙','肢體障礙','其他障礙'];
const rules = {'1':[1],'2':[2],'3':[2,3,4],'4':[4],'二跨一':[1,2],'三跨一':[1,2,3,4],'四跨一':[1,4]};
const examName = x => labels[Number(x)-1] || x;
const routeOf = code => ({1:'u',2:'t',3:'v',4:'v'})[code[1]];
const rowGroup = row => routeOf(row[0]) === 'u' ? labels[Number(row[0][2])-1] : row[5];
const pageSize = 30;
let eligible = [], page = 1;
function options(select, entries, placeholder) {
  select.replaceChildren(new Option(placeholder, ''), ...entries.map(([value,label]) => new Option(label,value)));
}
function make(tag, value, className) {
  const element = document.createElement(tag);
  element.textContent = value;
  if (className) element.className = className;
  return element;
}
function resetExam() {
  const entries = route.value === 'u'
    ? Object.keys(rules).map(x => [x,examName(x)])
    : groups[route.value].map(x => [x,x]);
  options(exam, entries, '請選擇報考類群組');
  exam.disabled = !dis.value;
  updateScope();
}
function updateScope() {
  const scope = exam.value
    ? (route.value === 'u' ? rules[exam.value].map(examName) : [exam.value])
    : [];
  eligible = scope.length ? rows.filter(row =>
    row[0][0] === dis.value && routeOf(row[0]) === route.value && scope.includes(rowGroup(row))
  ) : [];
  byId('rule').textContent = scope.length
    ? '可選填範圍｜' + scope.join('、')
    : '請先選擇障礙別與報考類群組。';
  options(group, scope.map(x => [x,x]), '全部');
  byId('groupLabel').hidden = scope.length <= 1;
  byId('filterPanel').hidden = !scope.length;
  query.value = '';
  art.value = '';
  page = 1;
  render();
}
function render() {
  const terms = normalize(query.value).trim().split(/\s+/).filter(Boolean);
  const filtered = eligible.filter(row => {
    const text = normalize(row.slice(0,3).join(' ') + ' ' + rowGroup(row));
    return terms.every(term => text.includes(term))
      && (!group.value || rowGroup(row) === group.value)
      && (!art.value || Boolean(arts[row[0]]) === (art.value === 'yes'));
  });
  const list = byId('list');
  list.replaceChildren();
  byId('count').textContent = exam.value
    ? filtered.length + ' 筆校系志願 · ' + new Set(filtered.map(row => row[1])).size + ' 所學校'
    : '';
  if (!filtered.length) {
    const message = !exam.value ? '完成上方選擇後，校系會顯示在這裡。'
      : eligible.length ? '目前沒有符合搜尋條件的校系。可清除關鍵字或調整篩選。'
      : '簡章中，這個障礙別在目前選填範圍內沒有招生校系。';
    list.append(make('p',message,'empty'));
  }
  for (const row of filtered.slice((page-1)*pageSize,page*pageSize)) list.append(card(row));
  const pages = Math.ceil(filtered.length/pageSize);
  byId('pager').hidden = pages <= 1;
  byId('pageText').textContent = '第 ' + page + '／' + pages + ' 頁';
  byId('prev').disabled = page <= 1;
  byId('next').disabled = page >= pages;
}
const normalize = text => text.normalize('NFKC').replaceAll('台','臺').toLowerCase();
function card([code, school, department, seats, pdf, category, note]) {
  const row = [code, school, department, seats, pdf, category];
  const card = make('article','','entry');
  card.append(make('p',school,'school'),make('h3',department));
  const tagLine = make('p','','meta');
  const sub = code[1] === '3' ? '四技組｜' : code[1] === '4' ? '二專組｜' : '';
  tagLine.append(make('span',sub + rowGroup(row),'tag'));
  if (arts[code]) tagLine.append(make('span','術科｜' + arts[code],'tag art'));
  card.append(tagLine,make('p','代碼 ' + code + '　·　名額 ' + seats + '　·　簡章第 ' + (pdf-10) + ' 頁（PDF 第 ' + pdf + ' 頁）','meta'));
  const standards = [...note.replaceAll('\n','').matchAll(/[＊*][^。＊*]*(?:。|$)/g)].map(x => x[0]).filter(x => x.includes('須達'));
  if (standards.length) card.append(make('p',standards.join(' '),'standard'));
  if (note) {
    const details = document.createElement('details');
    details.append(make('summary','查看簡章備註'),make('p',note,'note'));
    card.append(details);
  }
  return card;
}
options(dis,disabilities.map((label,i) => [String(i+1),label]),'請選擇障礙別');
for (const [name,scope] of Object.entries(rules))
  byId('rules').append(make('li',examName(name) + ' → ' + scope.map(examName).join('、')));
dis.addEventListener('change',resetExam);
route.addEventListener('change',resetExam);
exam.addEventListener('change',updateScope);
for (const control of [query,group,art]) control.addEventListener('input',() => {
  page = 1;
  render();
});
for (const [id,step] of [['prev',-1],['next',1]]) byId(id).addEventListener('click',() => {
  page += step;
  render();
  byId('heading').focus();
});
resetExam();
</script>
